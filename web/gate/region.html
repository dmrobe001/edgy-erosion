<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Region gate</title></head>
<body>
<pre id="log">building the planet, then region tiles on WebGPU...</pre>
<script type="module">
  const params = new URLSearchParams(location.search);
  const worker = new Worker('./region-worker.js', { type: 'module' });
  worker.onmessage = (e) => {
    window.gateResult = e.data;
    document.getElementById('log').textContent = JSON.stringify(e.data, null, 2);
  };
  worker.onerror = (e) => { window.gateResult = { error: e.message }; };
  worker.postMessage({ seed: params.get('seed') || 'gate', tiles: Number(params.get('tiles') || 4), compareCPU: params.get('cpu') !== '0' });
</script>
</body>
</html>
