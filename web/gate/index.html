<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Generator gates</title></head>
<body>
<pre id="log">running level 0 in a worker...</pre>
<script type="module">
  const params = new URLSearchParams(location.search);
  const seed = params.get('seed') || 'gate';
  const worker = new Worker('./l0-worker.js', { type: 'module' });
  worker.onmessage = (e) => {
    window.gateResult = e.data;
    document.getElementById('log').textContent = JSON.stringify(e.data, null, 2);
  };
  worker.onerror = (e) => { window.gateResult = { error: e.message }; };
  worker.postMessage({ seed, golden: { seed: 7, options: { subdivisions: 12, duration: 2e7, dt: 2e6, upliftWindow: 4e6 } } });
</script>
</body>
</html>
