name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: plates.html is up to date with src/
        run: cp plates.html /tmp/committed.html && sh build.sh && cmp plates.html /tmp/committed.html
      - run: node tests/run_all.js
