      edge: Uint8Array.from(hex.edge), bounds: { ...hex.bounds }, cellAt: (px, py) => hex.cellAt(px, py),
    });
  }
}

// ---- src/simulation.js ----
// The simulation: state, the order of processes in a time step, and bookkeeping.
//
// STATE (per cell, all in metres):
//   rock       elevation of the bedrock surface
//   soil       thickness of loose material on top (regolith, alluvium, talus)
//   z          surface elevation = rock + soil (kept in sync)
//   upliftCum  total rock uplift so far (to look up strata in the rock's own frame)
//
// ONE STEP of length dt:
//   1. uplift       rock rises by U(x, y) dt (except at fixed base-level outlets)
//   2. weathering   bedrock converts to soil at P0 exp(-soil / h*)   (Heimsath et al. 1997, Nature 388)
//   3. vegetation   cover from climate and soil depth
//   4. flow         lakes, flow directions, drainage area
//   5. rivers       stream power incision + sediment deposition
//   6. creep        nonlinear soil creep
//   7. rockfall     Culmann cliff failure -> debris
//   7b. coast       waves notch sea cliffs, lower platforms, spread shore sediment
//   8. avalanche    over-steep soil and talus slide to the angle of repose
//   9. boundaries   material reaching an open edge leaves the domain
//
// Operator splitting like this is first-order accurate in dt; keep dt small
// compared with the timescales you care about (e.g. the rockfall timescale).











class Simulation {
  /**
   * @param {object|string} [params] parameter overrides (see params.js), optionally
   *   with `preset: name`; or just a preset name.
   * @param {object} [options]
   * @param {object} [options.mesh] a mesh satisfying the contract in mesh.js, used
   *   instead of the hex grid described by params.grid (snapshots then cannot rebuild it)
   */
  constructor(params = {}, options = {}) {
    this.params = resolveParams(params);
    const g = this.params.grid;
    const [ox, oy] = g.origin || [0, 0];
    /** The mesh. Called `grid` for history; any mesh satisfying mesh.js works. */
    this.grid = options.mesh || new HexGrid(g.cols, g.rows, g.dx, ox, oy);
    checkMesh(this.grid);
    const n = this.grid.size;
    this.rock = new Float64Array(n);
    this.soil = new Float64Array(n);
    this.z = new Float64Array(n);
    this.upliftCum = new Float64Array(n);
    this.veg = new Float64Array(n);
    this.surfaceRock = new Int32Array(n);
    this.outlet = new Uint8Array(n);
    this.boundaryOutlet = new Uint8Array(n);
    this.upliftField = new Float64Array(n);
    this.precipWeight = new Float64Array(n);
    this.vegMax = new Float64Array(n);
    /** Net surface change rate over the last step (m/yr), uplift included. */
    this.dzdt = new Float64Array(n);
    /** Recent rockfall thickness removed per cell (m), decaying over a few steps; for display. */
    this.rockfallActivity = new Float64Array(n);
    /** Wave exposure 0..1 near the shore (0 elsewhere), from the last step. */
    this.waveExposureField = new Float64Array(n);
    /** Depth (m) of the wave-cut notch at the foot of each sea cliff. Part of the state. */
    this.notch = new Float64Array(n);
    /** Drainage area (m^2, precipitation-weighted) entering each cell from outside the domain. */
    this.inflowArea = new Float64Array(n);
    /** Sediment flux (m^3/yr) entering each cell from outside the domain. */
    this.inflowSediment = new Float64Array(n);
    /** Prescribed elevation change rate (m/yr) of open-edge cells; 0 = fixed base level. */
    this.boundaryRate = new Float64Array(n);
    /** Sediment flux (m^3/yr) leaving each cell along its river, from the last step. */
    this.qsOut = new Float64Array(n);
    this.flow = {
      filled: new Float64Array(n),
      receiver: new Int32Array(n),
      receiverDist: new Float64Array(n),
      order: new Int32Array(n),
      area: new Float64Array(n),
      visited: new Uint8Array(n),
      flowExponent: 0,
      inflow: this.inflowArea,
    };
    this.qs = new Float64Array(n);
    this.scratch = {
      eroded: new Float64Array(n),
      zNew: new Float64Array(n),
      qs: new Float64Array(n),
      edgeFlux: new Float64Array(this.grid.degree * n),
      outTotal: new Float64Array(n),
      zStart: new Float64Array(n),
    };
    this.time = 0;
    this.stepCount = 0;
    this.rng = new Rng(this.params.seed);
    // volume budget (m^3): uplift includes prescribed boundary motion; inflow is
    // sediment carried in by rivers from outside the domain
    this.budget = { uplift: 0, exported: 0, inflow: 0 };
    this.last = { substeps: 0, rockfallEvents: 0, rockfallVolume: 0, avalancheVolume: 0, exported: 0, cliffCollapses: 0, coastSubsteps: 0 };
    /** Current sea level (m), or null when there is no sea. */
    this.seaLevel = seaLevelAt(this.params, 0);

    this._buildBoundaries();
    this._buildDerived();
    this._initialTerrain();
    this._updateDerivedState();
    routeFlow(this.grid, this.z, this.outlet, this.precipWeight, this.flow);
  }

  /** Rebuild a simulation exactly from snapshot() output. */
  static fromSnapshot(snap) {
    const sim = new Simulation(snap.params);
    sim.rock.set(snap.rock);
    sim.soil.set(snap.soil);
    sim.upliftCum.set(snap.upliftCum);
    if (snap.notch) sim.notch.set(snap.notch);
    if (snap.inflowArea) sim.inflowArea.set(snap.inflowArea);
    if (snap.inflowSediment) sim.inflowSediment.set(snap.inflowSediment);
    if (snap.boundaryRate) sim.boundaryRate.set(snap.boundaryRate);
    sim.time = snap.time;
    sim.seaLevel = seaLevelAt(sim.params, sim.time);
    sim.stepCount = snap.stepCount;
    sim.budget = { inflow: 0, ...snap.budget };
    sim._updateDerivedState();
    routeFlow(sim.grid, sim.z, sim.outlet, sim.precipWeight, sim.flow);
    sim.rng.state = snap.rngState >>> 0; // after routing, which may draw random numbers
    return sim;
  }

  /** Everything needed to reproduce and continue this run, as plain JSON-able data. */
  snapshot() {
    return {
      format: 'edgy-erosion-snapshot/1',
      params: this.params,
      time: this.time,
      stepCount: this.stepCount,
      rngState: this.rng.state,
      budget: { ...this.budget },
      rock: Array.from(this.rock),
      soil: Array.from(this.soil),
      upliftCum: Array.from(this.upliftCum),
      notch: Array.from(this.notch),
      inflowArea: Array.from(this.inflowArea),
      inflowSediment: Array.from(this.inflowSediment),
      boundaryRate: Array.from(this.boundaryRate),
    };
  }

  /**
   * Replace the state wholesale (used when zooming in from a parent run). Arrays are
   * copied; anything omitted is left as it is.
   */
  setState({ rock, soil, upliftCum, time, inflowArea, inflowSediment, boundaryRate } = {}) {
    if (rock) this.rock.set(rock);
    if (soil) this.soil.set(soil);
    if (upliftCum) this.upliftCum.set(upliftCum);
    if (inflowArea) this.inflowArea.set(inflowArea);
    if (inflowSediment) this.inflowSediment.set(inflowSediment);
    if (boundaryRate) this.boundaryRate.set(boundaryRate);
    if (time != null) { this.time = time; this.seaLevel = seaLevelAt(this.params, time); }
    this.notch.fill(0);
    this._updateDerivedState();
    routeFlow(this.grid, this.z, this.outlet, this.precipWeight, this.flow);
    return this;
  }

  /**
   * Change parameters mid-run (climate, rates, rocks, strata...). Grid geometry and
   * the initial condition cannot change; make a new Simulation for that.
   */
  setParams(overrides) {
    const next = deepMerge(this.params, overrides);
    for (const k of ['cols', 'rows', 'dx']) {
      if (next.grid[k] !== this.params.grid[k]) throw new Error('grid cannot change mid-run; create a new Simulation');
    }
    if (JSON.stringify(next.grid.origin) !== JSON.stringify(this.params.grid.origin)) throw new Error('grid cannot change mid-run; create a new Simulation');
    validate(next);
    this.params = next;
    this.seaLevel = seaLevelAt(next, this.time);
    this._buildBoundaries();
    this._buildDerived();
    this._updateDerivedState();
  }

  /** Advance one step. */
  step(dt = this.params.time.dt) {
    const p = this.params;
    const { grid, rock, soil, z, boundaryOutlet } = this;
    const n = grid.size;
    const area = grid.area;
    this.scratch.zStart.set(z);
    this.seaLevel = seaLevelAt(p, this.time + dt / 2);

    // 1. uplift
    let upliftVol = 0;
    for (let i = 0; i < n; i++) {
      if (boundaryOutlet[i]) {
        // open edges are fixed base level, or follow a prescribed rate (a zoomed patch
        // tracking its frozen parent); that is surface motion, not rock uplift
        const b = this.boundaryRate[i] * dt;
        rock[i] += b;
        upliftVol += b * area[i];
        continue;
      }
      const u = this.upliftField[i] * dt;
      rock[i] += u;
      this.upliftCum[i] += u;
      upliftVol += u * area[i];
    }
    this.budget.uplift += upliftVol;
    this._updateSurfaceRock();

    // 2. weathering
    if (p.weathering.enabled) {
      const wp = p.weathering;
      // climate: frost cracking speeds production, and so does moisture (chemical weathering)
      const frost = 1 + wp.frostBoost * p.climate.frost;
      const wet = Math.pow(Math.max(p.climate.precipitation, 1e-6), wp.moistureExponent ?? 0);
      const vb = p.vegetation.productionBoost;
      const hs = wp.productionDepth;
      for (let i = 0; i < n; i++) {
        if (boundaryOutlet[i] || soil[i] > 40 * hs) continue; // production negligible under deep soil
        // dh/dt = P exp(-h/h*) integrates exactly to h(t+dt) = h* ln(exp(h/h*) + P dt / h*)
        const P = this.lith.weathering[this.surfaceRock[i]] * frost * wet * (1 + vb * this.veg[i]);
        const h1 = hs * Math.log(Math.exp(soil[i] / hs) + (P * dt) / hs);
        const d = h1 - soil[i];
        if (!(d > 0)) continue;
        rock[i] -= d;
        soil[i] = h1;
      }
      this._updateSurfaceRock();
    }
    for (let i = 0; i < n; i++) z[i] = rock[i] + soil[i];

    // 3. vegetation, 4. flow
    this._updateVegetation();
    this._updateOutlets();
    routeFlow(grid, z, this.outlet, this.precipWeight, this.flow);

    // 5. rivers
    let exported = 0;
    if (p.fluvial.enabled) {
      exported += fluvial(this, dt);
      let inflow = 0;
      for (let i = 0; i < n; i++) inflow += this.inflowSediment[i];
      this.budget.inflow += inflow * dt;
    }

    // 6. creep
    this.last.substeps = p.hillslope.enabled ? creep(this, dt).substeps : 0;

    // 7. rockfall
    const act = this.rockfallActivity;
    for (let i = 0; i < n; i++) act[i] *= 0.7;
    if (p.rockfall.enabled) {
      const rf = rockfall(this, dt);
      this.last.rockfallEvents = rf.events;
      this.last.rockfallVolume = rf.volume;
    } else {
      this.last.rockfallEvents = 0;
      this.last.rockfallVolume = 0;
    }

    // 7b. coast: waves cut cliffs and platforms and rework shore sediment
    if (p.coast.enabled && this.seaLevel != null) {
      const c = coast(this, dt);
      exported += c.exported;
      this.last.cliffCollapses = c.collapses;
      this.last.coastSubsteps = c.substeps;
    } else {
      this.waveExposureField.fill(0);
      this.last.cliffCollapses = 0;
      this.last.coastSubsteps = 0;
    }

    // 8. avalanche
    this.last.avalancheVolume = p.hillslope.enabled ? avalanche(this) : 0;

    // 9. open boundaries: loose material leaves; base level stays fixed
    for (let i = 0; i < n; i++) {
      if (boundaryOutlet[i] && soil[i] > 0) {
        exported += soil[i] * area[i];
        soil[i] = 0;
      }
      z[i] = rock[i] + soil[i];
    }
    this.budget.exported += exported;
    this.last.exported = exported;

    this.time += dt;
    this.stepCount++;
    const zs = this.scratch.zStart;
    for (let i = 0; i < n; i++) this.dzdt[i] = (z[i] - zs[i]) / dt;
    this._updateDerivedState();
    // Re-route on the final surface so lakes, drainage area etc. match `z` for display
    // and analysis. (The next step routes again after uplift.)
    routeFlow(grid, z, this.outlet, this.precipWeight, this.flow);
    return this;
  }

  /** Advance `steps` steps; optional callback(sim) after each. */
  run(steps, onStep) {
    for (let s = 0; s < steps; s++) {
      this.step();
      if (onStep) onStep(this);
    }
    return this;
  }

  /** Total volume of rock + soil above z = 0 datum (m^3), for budget checks. */
  volume() {
    let v = 0;
    for (let i = 0; i < this.grid.size; i++) v += (this.rock[i] + this.soil[i]) * this.grid.area[i];
    return v;
  }

  /** Summary numbers for logging. */
  stats() {
    const { z, soil, grid } = this;
    let zmin = Infinity, zmax = -Infinity, zsum = 0, ssum = 0, bare = 0, lake = 0;
    const f = this.flow.filled;
    for (let i = 0; i < grid.size; i++) {
      if (z[i] < zmin) zmin = z[i];
      if (z[i] > zmax) zmax = z[i];
      zsum += z[i];
      ssum += soil[i];
      if (soil[i] < 0.05) bare++;
      if (f[i] - z[i] > 0.1) lake++;
    }
    return {
      time: this.time,
      step: this.stepCount,
      minElevation: zmin,
      maxElevation: zmax,
      meanElevation: zsum / grid.size,
      meanSoil: ssum / grid.size,
      bareRockFraction: bare / grid.size,
      lakeFraction: lake / grid.size,
      rockfallEvents: this.last.rockfallEvents,
      rockfallVolume: this.last.rockfallVolume,
      exportedVolume: this.last.exported,
      seaLevel: this.seaLevel,
      cliffCollapses: this.last.cliffCollapses,
      creepSubsteps: this.last.substeps,
    };
  }

  // ---------------------------------------------------------------- internals

  _buildBoundaries() {
    const open = new Set(this.params.boundary.open);
    const g = this.grid;
    for (let i = 0; i < g.size; i++) {
      const e = g.edge[i];
      this.boundaryOutlet[i] =
        ((e & 1) && open.has('west')) || ((e & 2) && open.has('east')) ||
        ((e & 4) && open.has('north')) || ((e & 8) && open.has('south')) ? 1 : 0;
    }
  }

  _buildDerived() {
    const p = this.params;
    const g = this.grid;
    this.flow.flowExponent = p.fluvial.routing === 'mfd' ? p.fluvial.flowExponent : 0;
    this.flow.randomExponent = p.fluvial.randomReceivers ? p.fluvial.randomExponent : 0;
    this.flow.rng = this.rng;
    this.frame = referenceFrame(p, g);
    this.lith = new Lithology(p, g, this.frame);
    const F = this.frame;
    const W = F.width, H = F.height;
    const u = p.uplift;
    const ang = ((u.angle || 0) * Math.PI) / 180;
    const ux = Math.cos(ang), uy = -Math.sin(ang);
    for (let i = 0; i < g.size; i++) {
      const fx = (g.x[i] - F.x) / W - 0.5;
      const fy = (g.y[i] - F.y) / W - 0.5 * (H / W); // width units, centred
      let f = 1;
      switch (u.pattern) {
        case 'uniform': f = 1; break;
        case 'dome': f = Math.exp(-(fx * fx + fy * fy) / (2 * u.radius * u.radius)); break;
        case 'tilt': f = clamp01(0.5 + fx * ux + fy * uy); break;
        case 'fault': f = -fx * uy + fy * ux + (u.offset || 0) < 0 ? 1 : 0; break;
        default: throw new Error(`unknown uplift pattern "${u.pattern}"`);
      }
      this.upliftField[i] = this.boundaryOutlet[i] ? 0 : u.rate * f;

      const P = Math.max(0, p.climate.precipitation * (1 + p.climate.precipitationGradient * (fx)));
      this.precipWeight[i] = P; // relative to a 1 m/yr reference
      const vc = p.vegetation.cover;
      this.vegMax[i] = vc === 'auto' ? P / (P + p.vegetation.halfSaturation) : Math.max(0, Math.min(1, +vc));
    }
  }

  _initialTerrain() {
    const p = this.params.initial;
    const g = this.grid;
    const F = this.frame;
    const W = F.width, H = F.height;
    const ang = ((p.angle || 0) * Math.PI) / 180;
    const ux = Math.cos(ang), uy = -Math.sin(ang);
    const noise = p.noise || { amplitude: 0 };
    for (let i = 0; i < g.size; i++) {
      const fx = (g.x[i] - F.x) / W;
      const fy = (g.y[i] - F.y) / H;
      let shape = 0;
      switch (p.type) {
        case 'flat': shape = 0; break;
        case 'plateau': {
          // distance inside the plateau rectangle, in width units
          let d = Math.min(fx - p.margin, 1 - p.margin - fx, (fy - p.margin) * (H / W), (1 - p.margin - fy) * (H / W));
          if (p.edgeNoise) d += p.edgeNoise * fbm(g.x[i], g.y[i], { wavelength: 0.3 * W, octaves: 4, seed: (this.params.seed | 0) + 31 });
          shape = smoothstep(clamp01(d / p.edgeWidth + 0.5));
          break;
        }
        case 'dome': {
          const rx = fx - 0.5, ry = (fy - 0.5) * (H / W);
          shape = Math.exp(-(rx * rx + ry * ry) / (2 * 0.22 * 0.22));
          break;
        }
        case 'ramp': shape = clamp01(0.5 + (fx - 0.5) * ux + (fy - 0.5) * (H / W) * uy); break;
        case 'ridge': shape = clamp01(1 - 2 * Math.abs((fx - 0.5) * -uy + (fy - 0.5) * (H / W) * ux)); break;
        default: throw new Error(`unknown initial terrain type "${p.type}"`);
      }
      let zi = p.base + p.height * shape;
      if (noise.amplitude) {
        zi += noise.amplitude * fbm(g.x[i], g.y[i], { wavelength: noise.wavelength, octaves: noise.octaves ?? 5, gain: noise.gain ?? 0.5, seed: this.params.seed | 0 });
      }
      this.rock[i] = zi - (this.boundaryOutlet[i] ? 0 : p.soil);
      this.soil[i] = this.boundaryOutlet[i] ? 0 : p.soil;
    }
    // Open edges are base level: no higher than `base`, so rivers have somewhere to go.
    for (let i = 0; i < g.size; i++) if (this.boundaryOutlet[i]) this.rock[i] = Math.min(this.rock[i], p.base);
  }

  _updateSurfaceRock() {
    const { rock, upliftCum, lith, surfaceRock } = this;
    // sample just below the surface so a cell sitting exactly on a boundary uses the rock beneath
    for (let i = 0; i < this.grid.size; i++) surfaceRock[i] = lith.rockAt(i, rock[i] - upliftCum[i] - 1e-6);
  }

  _updateVegetation() {
    const hv = this.params.vegetation.soilDepthScale;
    for (let i = 0; i < this.grid.size; i++) this.veg[i] = this.vegMax[i] * (1 - Math.exp(-this.soil[i] / hv));
  }

  _updateOutlets() {
    const sea = this.seaLevel;
    let any = false;
    let lowest = 0;
    for (let i = 0; i < this.grid.size; i++) {
      this.outlet[i] = this.boundaryOutlet[i] || (sea != null && this.z[i] < sea) ? 1 : 0;
      if (this.outlet[i]) any = true;
      if (this.z[i] < this.z[lowest]) lowest = i;
    }
    // No open edge and no sea left (e.g. the sea floor was uplifted or the sea fell
    // away): the lowest cell becomes the terminal sink of an internally drained basin.
    if (!any) this.outlet[lowest] = 1;
  }

  _updateDerivedState() {
    for (let i = 0; i < this.grid.size; i++) this.z[i] = this.rock[i] + this.soil[i];
    this._updateSurfaceRock();
    this._updateVegetation();
    this._updateOutlets();
  }
}

/**
 * The rectangle that fractional positions in the parameters refer to: plateau margins,
 * plug locations, fault lines, dip centres, rainfall gradients. By default the domain
 * itself; a zoomed-in patch inherits its parent's, so the geology lines up.
 */
function referenceFrame(params, mesh) {
  if (params.frame) return { ...params.frame };
  const b = mesh.bounds;
  return {
    x: mesh.originX ?? b.xmin,
    y: mesh.originY ?? b.ymin,
    width: mesh.width ?? b.xmax - b.xmin,
    height: mesh.height ?? b.ymax - b.ymin,
  };
}

function clamp01(v) {
  return v < 0 ? 0 : v > 1 ? 1 : v;
}

function smoothstep(t) {
  return t * t * (3 - 2 * t);
}

// ---- src/nest.js ----
// Zooming in: refine a patch of a running simulation at finer spacing.
//
// This is coarse-graining in reverse ("backmapping", as in polymer simulation):
// the parent is frozen, a patch of it is reconstructed on a finer grid, detail the
// parent could not resolve is added, and the patch then evolves under its own
// physics with the parent supplying everything that crosses the patch edges.
//
// What the child inherits from the frozen parent:
//   - topography, soil and cumulative uplift, interpolated linearly and corrected
//     so the child's average over each parent cell equals the parent value
//     ("mean-preserving"), plus zero-mean roughness scaled to the local parent relief;
//   - the parameters, the seed and the reference frame, so strata, plugs, fault lines,
//     weak zones and rainfall line up exactly with the parent's;
//   - the time and the sea level;
//   - boundary conditions: every edge cell of the patch is an outlet whose elevation
//     follows the parent's last rate of change (dz/dt), and rivers that flow into the
//     patch in the parent enter the child with their drainage area and sediment flux.
//
// What it does NOT do: anything the child does never flows back to the parent
// (one-way coupling), and the parent's rates are frozen at its last step.




/**
 * Linear interpolation of a per-cell field of a hex-lattice simulation at (x, y):
 * barycentric on the triangle of cell centres that contains the point.
 */
function interpolator(mesh, field) {
  if (!mesh.lattice) throw new Error('interpolation needs a hexagonal-lattice parent mesh');
  const D = mesh.degree;
  const nb = mesh.neighbors;
  return (x, y) => {
    const p = mesh.cellAt(x, y);
    if (p < 0) return NaN;
    const dx = x - mesh.x[p];
    const dy = y - mesh.y[p];
    if (dx === 0 && dy === 0) return field[p];
    // slot k points along azimuth 60k degrees (y grows southwards, so north is -y)
    let az = (Math.atan2(-dy, dx) * 180) / Math.PI;
    if (az < 0) az += 360;
    const k = Math.floor(az / 60) % 6;
    const a = nb[D * p + k];
    const b = nb[D * p + ((k + 1) % 6)];
    if (a < 0 || b < 0) return field[p]; // at the parent's edge: nearest value
    // barycentric coordinates of (x, y) in triangle (p, a, b)
    const x1 = mesh.x[a] - mesh.x[p], y1 = mesh.y[a] - mesh.y[p];
    const x2 = mesh.x[b] - mesh.x[p], y2 = mesh.y[b] - mesh.y[p];
    const det = x1 * y2 - x2 * y1;
    const wa = (dx * y2 - x2 * dy) / det;
    const wb = (x1 * dy - dx * y1) / det;
    return (1 - wa - wb) * field[p] + wa * field[a] + wb * field[b];
  };
}

/**
 * Create a finer simulation of a patch of `parent`.
 * @param {Simulation} parent
 * @param {object} o
 * @param {[number, number]} o.center world position of the patch centre (m)
 * @param {number} [o.factor] refinement: child dx = parent dx / factor
 * @param {number} [o.cols] [o.rows] child grid size in cells
 * @param {number} [o.dt] child time step (default parent dt / factor)
 * @param {number} [o.roughness] amplitude of added detail, as a fraction of the local
 *   parent relief (max - min over a parent cell and its neighbours)
 * @param {number} [o.correctionIterations] passes of the mean-preserving correction
 * @returns {Simulation} the child, with `child.zoom` describing where it came from
 */
function zoomIn(parent, { center, factor = 4, cols = 128, rows = 128, dt, roughness = 0.3, correctionIterations = 16 } = {}) {
  const pg = parent.grid;
  if (!pg.lattice) throw new Error('zooming needs a hexagonal-lattice parent');
  const dx = pg.dx / factor;
  const rowSpacing = (Math.sqrt(3) / 2) * dx;
  // centre the child grid on `center`, then keep it inside the parent's domain
  const halfW = (dx * (cols - 1 + 0.5)) / 2;
  const halfH = (rowSpacing * (rows - 1)) / 2;
  const b = pg.bounds;
  const cx = Math.min(Math.max(center[0], b.xmin + halfW + pg.dx), b.xmax - halfW - pg.dx);
  const cy = Math.min(Math.max(center[1], b.ymin + halfH + pg.dx), b.ymax - halfH - pg.dx);
  if (!(cx - halfW > b.xmin && cx + halfW < b.xmax && cy - halfH > b.ymin && cy + halfH < b.ymax)) {
    throw new Error('the requested patch does not fit inside the parent domain; use fewer cells or a larger factor');
  }
  const origin = [cx - halfW, cy - halfH];

  const pp = parent.params;
  const params = deepMerge(pp, {
    grid: { cols, rows, dx, origin },
    frame: referenceFrame(pp, pg),
    time: { dt: dt ?? pp.time.dt / factor },
    boundary: { open: ['north', 'south', 'east', 'west'], seaLevel: pp.boundary.seaLevel },
    initial: { type: 'flat', base: 0, height: 0, noise: { amplitude: 0 }, soil: 0 },
    zoom: { level: (pp.zoom?.level ?? 0) + 1, factor, center: [cx, cy], parentDx: pg.dx },
  });
  delete params.preset; // the parameters are now fully explicit
  const child = new Simulation(params);
  const cg = child.grid;
  const n = cg.size;

  // --- topography: linear interpolation, roughness, mean-preserving correction ---
  const pz = parent.z;
  const zAt = interpolator(pg, pz);
  const soilAt = interpolator(pg, parent.soil);
  const upAt = interpolator(pg, parent.upliftCum);
  const rateAt = interpolator(pg, parent.dzdt);
  const relief = new Float64Array(pg.size);
  for (let p = 0; p < pg.size; p++) {
    let lo = pz[p], hi = pz[p];
    for (let k = 0; k < pg.degree; k++) {
      const q = pg.neighbors[pg.degree * p + k];
      if (q >= 0) { lo = Math.min(lo, pz[q]); hi = Math.max(hi, pz[q]); }
    }
    relief[p] = hi - lo;
  }
  const reliefAt = interpolator(pg, relief);
  const parentOf = new Int32Array(n);
  const z = new Float64Array(n);
  const soil = new Float64Array(n);
  const upliftCum = new Float64Array(n);
  const boundaryRate = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const x = cg.x[i], y = cg.y[i];
    parentOf[i] = pg.cellAt(x, y);
    const detail = fbm(x, y, { wavelength: pg.dx, octaves: 4, seed: (pp.seed | 0) + 4049 });
    z[i] = zAt(x, y) + roughness * 0.5 * reliefAt(x, y) * detail;
    soil[i] = Math.max(0, soilAt(x, y));
    upliftCum[i] = upAt(x, y);
    if (child.boundaryOutlet[i]) boundaryRate[i] = rateAt(x, y);
  }
  // Correct so each parent cell's child-average equals the parent value: interpolate the
  // per-parent-cell misfit and add it, a few times (a fixed-point iteration).
  const sum = new Float64Array(pg.size);
  const cnt = new Float64Array(pg.size);
  const misfit = new Float64Array(pg.size);
  const misfitAt = interpolator(pg, misfit);
  let residual = 0;
  for (let it = 0; it <= correctionIterations; it++) {
    sum.fill(0); cnt.fill(0);
    for (let i = 0; i < n; i++) { sum[parentOf[i]] += z[i]; cnt[parentOf[i]]++; }
    residual = 0;
    for (let p = 0; p < pg.size; p++) {
      misfit[p] = cnt[p] ? pz[p] - sum[p] / cnt[p] : 0;
      // judge convergence on parent cells the patch covers completely
      if (cnt[p] >= 0.9 * factor * factor) residual = Math.max(residual, Math.abs(misfit[p]));
    }
    if (it === correctionIterations) break;
    for (let i = 0; i < n; i++) z[i] += misfitAt(cg.x[i], cg.y[i]);
  }

  // --- rivers entering the patch from the parent ---
  const inflowArea = new Float64Array(n);
  const inflowSediment = new Float64Array(n);
  const inside = (x, y) => { const c = cg.cellAt(x, y); return c >= 0 && !child.boundaryOutlet[c] ? c : -1; };
  const pf = parent.flow;
  const pD = pg.degree;
  const mfd = pf.flowExponent > 0;
  let enteringArea = 0;
  for (let p = 0; p < pg.size; p++) {
    if (pf.receiver[p] < 0 || inside(pg.x[p], pg.y[p]) >= 0) continue;
    // sediment follows the single receiver
    const r = pf.receiver[p];
    const tr = inside(pg.x[r], pg.y[r]);
    if (tr >= 0) inflowSediment[tr] += parent.qsOut[p];
    // water: all to the receiver, or shared by slope^p as in the parent's MFD routing
    if (!mfd) {
      if (tr >= 0) { inflowArea[tr] += pf.area[p]; enteringArea += pf.area[p]; }
      continue;
    }
    let wsum = 0;
    const w = [];
    for (let k = 0; k < pD; k++) {
      const e = pD * p + k;
      const q = pg.neighbors[e];
      const d = q >= 0 ? pf.filled[p] - pf.filled[q] : 0;
      const wk = d > 0 ? Math.pow(d / pg.dist[e], pf.flowExponent) : 0;
      w.push([q, wk]);
      wsum += wk;
    }
    for (const [q, wk] of w) {
      if (wk <= 0) continue;
      const t = inside(pg.x[q], pg.y[q]);
      if (t >= 0) { const a = (pf.area[p] * wk) / wsum; inflowArea[t] += a; enteringArea += a; }
    }
  }

  // open edges carry no soil; their elevation is the surface itself
  const rock = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    if (child.boundaryOutlet[i]) soil[i] = 0;
    rock[i] = z[i] - soil[i];
  }
  child.setState({ rock, soil, upliftCum, time: parent.time, inflowArea, inflowSediment, boundaryRate });
  child.stepCount = 0;
  child.zoom = {
    level: params.zoom.level, factor, center: [cx, cy], parentDx: pg.dx,
    bounds: { ...cg.bounds }, meanResidual: residual, enteringArea, parentTime: parent.time,
  };
  return child;
}

/**
 * Compare a zoomed child with its frozen parent over the parent cells the patch covers
 * completely: mean elevation, mean rate of change, and the discharge of the largest
 * river leaving the patch. These are the cross-scale consistency checks. The parent is
 * frozen, so its "expected" elevation is extrapolated at its last rate of change over
 * the time the child has run.
 */
function compareWithParent(child, parent) {
  const pg = parent.grid;
  const cg = child.grid;
  const factor = child.zoom.factor;
  const sumZ = new Float64Array(pg.size);
  const sumR = new Float64Array(pg.size);
  const cnt = new Float64Array(pg.size);
  for (let i = 0; i < cg.size; i++) {
    if (child.boundaryOutlet[i]) continue;
    const p = pg.cellAt(cg.x[i], cg.y[i]);
    sumZ[p] += child.z[i]; sumR[p] += child.dzdt[i]; cnt[p]++;
  }
  let nP = 0, parentZ = 0, childZ = 0, parentRate = 0, childRate = 0;
  for (let p = 0; p < pg.size; p++) {
    if (cnt[p] < 0.9 * factor * factor) continue;
    nP++;
    parentZ += parent.z[p]; childZ += sumZ[p] / cnt[p];
    parentRate += parent.dzdt[p]; childRate += sumR[p] / cnt[p];
  }
  // biggest river leaving: child = largest drainage area arriving at an edge cell;
  // parent = largest area at a covered cell whose receiver lies outside the patch
  let childExit = 0;
  for (let i = 0; i < cg.size; i++) if (child.boundaryOutlet[i]) childExit = Math.max(childExit, child.flow.area[i]);
  let parentExit = 0;
  const b = cg.bounds;
  const within = (x, y) => x > b.xmin && x < b.xmax && y > b.ymin && y < b.ymax;
  for (let p = 0; p < pg.size; p++) {
    const r = parent.flow.receiver[p];
    if (r < 0 || !within(pg.x[p], pg.y[p]) || within(pg.x[r], pg.y[r])) continue;
    parentExit = Math.max(parentExit, parent.flow.area[p]);
  }
  const elapsed = child.time - child.zoom.parentTime;
  return {
    parentCells: nP,
    elapsed,
    meanElevation: { parent: parentZ / nP, expected: (parentZ + parentRate * elapsed) / nP, child: childZ / nP },
    meanRate: { parent: parentRate / nP, child: childRate / nP },
    largestExitArea: { parent: parentExit, child: childExit },
  };
}

// ---- src/render.js ----
// Turning simulation state into pixels. Pure functions on typed arrays, so they
// work the same in a browser (into ImageData) and in Node (into a PNG file).

const VIEWS = {
  terrain: 'Terrain (rock, soil, vegetation, water)',
  elevation: 'Elevation (hypsometric tint)',
  geology: 'Geology (rock at the surface)',
  soil: 'Soil thickness',
  vegetation: 'Vegetation cover',
  discharge: 'Drainage area',
  erosion: 'Erosion / deposition rate',
  rockfall: 'Recent rockfall',
  waves: 'Wave exposure',
};

function hexToRgb(hex) {
  const v = parseInt(hex.replace('#', ''), 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}

/** Piecewise-linear colormap; stops = [[t, [r,g,b]], ...] with t ascending in [0, 1]. */
function ramp(stops, t) {
  if (!(t > 0)) return stops[0][1];
  if (t >= 1) return stops[stops.length - 1][1];
  for (let k = 1; k < stops.length; k++) {
    if (t <= stops[k][0]) {
      const [t0, c0] = stops[k - 1];
      const [t1, c1] = stops[k];
      const u = (t - t0) / (t1 - t0);
      return [c0[0] + u * (c1[0] - c0[0]), c0[1] + u * (c1[1] - c0[1]), c0[2] + u * (c1[2] - c0[2])];
    }
  }
  return stops[stops.length - 1][1];
}

const HYPSO = [[0, [62, 110, 70]], [0.25, [120, 150, 85]], [0.5, [190, 175, 115]], [0.75, [150, 110, 80]], [0.92, [200, 190, 185]], [1, [250, 250, 250]]];
const SEQ = [[0, [250, 245, 225]], [0.33, [220, 180, 100]], [0.66, [160, 95, 50]], [1, [70, 40, 25]]];
const GREEN = [[0, [235, 225, 200]], [0.5, [150, 185, 95]], [1, [35, 95, 40]]];
const BLUE = [[0, [245, 245, 240]], [0.4, [150, 190, 220]], [1, [20, 60, 140]]];
const HEAT = [[0, [0, 0, 0]], [0.3, [200, 40, 20]], [0.7, [255, 170, 30]], [1, [255, 255, 200]]];
const SOIL_RGB = [176, 152, 112];
const SAND_RGB = [222, 204, 150];
const VEG_RGB = [72, 112, 52];
const LAKE_RGB = [70, 120, 175];
const SEA_RGB = [40, 80, 140];

/**
 * Lambertian hillshade per cell, light from the north-west at 45 degrees.
 * Gradient by least squares over the available neighbours.
 * @returns {Float32Array} values in [0, 1]
 */
function hillshade(sim, exaggeration = 1) {
  const { grid, z } = sim;
  const n = grid.size;
  const nb = grid.neighbors;
  const out = new Float32Array(n);
  const L = [-0.5, -0.5, Math.SQRT1_2]; // unit vector towards the light (x east, y south, z up)
  for (let i = 0; i < n; i++) {
    let sxx = 0, sxy = 0, syy = 0, sxz = 0, syz = 0;
    for (let k = 0; k < 6; k++) {
      const j = nb[6 * i + k];
      if (j < 0) continue;
      const ddx = grid.x[j] - grid.x[i];
      const ddy = grid.y[j] - grid.y[i];
      const dz = (z[j] - z[i]) * exaggeration;
      sxx += ddx * ddx; sxy += ddx * ddy; syy += ddy * ddy;
      sxz += ddx * dz; syz += ddy * dz;
    }
    const det = sxx * syy - sxy * sxy;
    let gx = 0, gy = 0;
    if (det > 1e-12) {
      gx = (syy * sxz - sxy * syz) / det;
      gy = (sxx * syz - sxy * sxz) / det;
    }
    const norm = Math.sqrt(gx * gx + gy * gy + 1);
    out[i] = Math.max(0, (-gx * L[0] - gy * L[1] + L[2]) / norm);
  }
  return out;
}

/**
 * Colour every cell for the given view.
 * @param {import('./simulation.js').Simulation} sim
 * @param {string} view one of VIEWS
 * @param {Uint8ClampedArray} [out] 3 bytes per cell
 */
function cellColors(sim, view = 'terrain', out) {
  const { grid, z, soil, lith, surfaceRock, veg } = sim;
  const n = grid.size;
  out = out || new Uint8ClampedArray(3 * n);
  const shade = hillshade(sim, view === 'terrain' || view === 'geology' ? 2 : 1.5);
  const rockRgb = lith.color.map(hexToRgb);
  const { filled, area } = sim.flow;
  const sea = sim.seaLevel;
  const cellA = grid.cellArea;

  let zmin = Infinity, zmax = -Infinity, amax = 0, emax = 1e-9;
  for (let i = 0; i < n; i++) {
    if (z[i] < zmin) zmin = z[i];
    if (z[i] > zmax) zmax = z[i];
    if (area[i] > amax) amax = area[i];
    const e = Math.abs(sim.dzdt[i]);
    if (e > emax) emax = e;
  }
  const zr = Math.max(1e-6, zmax - zmin);
  const logAmax = Math.log(Math.max(amax / cellA, 2));
  const cp = sim.params.coast;
  const beachTop = sea != null && cp ? sea + cp.tidalRange / 2 + cp.waveHeight : null;
  const riverStart = Math.min(Math.log(150), 0.6 * logAmax); // contributing cells at which rivers show

  for (let i = 0; i < n; i++) {
    let c;
    const s = shade[i];
    const lit = 0.35 + 0.75 * s;
    const water = sea != null && z[i] < sea ? 2 : filled[i] - z[i] > 0.05 ? 1 : 0;
    switch (view) {
      case 'elevation':
        c = ramp(HYPSO, (z[i] - zmin) / zr).map((v) => v * lit);
        break;
      case 'geology':
        c = rockRgb[surfaceRock[i]].map((v) => v * lit);
        break;
      case 'soil': {
        const t = (Math.log10(Math.max(soil[i], 0.01)) + 2) / 3; // 1 cm .. 10 m
        c = ramp(SEQ, t).map((v) => v * (0.6 + 0.4 * s));
        break;
      }
      case 'vegetation':
        c = ramp(GREEN, veg[i]).map((v) => v * (0.6 + 0.4 * s));
        break;
      case 'discharge': {
        const t = Math.log(Math.max(area[i] / cellA, 1)) / logAmax;
        c = ramp(BLUE, t).map((v) => v * (0.75 + 0.25 * s));
        break;
      }
      case 'erosion': {
        // red = lowering, blue = rising (uplift included); square-root stretch
        const r = sim.dzdt[i] / emax;
        const t = Math.sign(r) * Math.sqrt(Math.abs(r));
        c = t < 0 ? [255, 255 * (1 + t), 255 * (1 + t)] : [255 * (1 - t), 255 * (1 - t), 255];
        c = c.map((v) => v * (0.7 + 0.3 * s));
        break;
      }
      case 'rockfall': {
        const g = 90 + 120 * s;
        const t = Math.min(1, Math.sqrt(sim.rockfallActivity[i] / 10));
        c = t > 0.01 ? ramp(HEAT, 0.3 + 0.7 * t) : [g, g, g];
        break;
      }
      case 'waves': {
        const g = 80 + 110 * s;
        const e = sim.waveExposureField[i];
        c = water === 2 && e === 0 ? [g * 0.5, g * 0.55, g * 0.7] : e > 0 ? ramp(HEAT, 0.25 + 0.75 * e) : [g, g, g];
        if (sim.notch[i] > 0) c = [255, 255, 255];
        break;
      }
      case 'terrain':
      default: {
        const rc = rockRgb[surfaceRock[i]];
        const cover = 1 - Math.exp(-soil[i] / 0.3);
        c = [0, 1, 2].map((k) => rc[k] + cover * (SOIL_RGB[k] - rc[k]));
        c = c.map((v, k) => v + veg[i] * (VEG_RGB[k] - v));
        if (beachTop !== null && soil[i] > 0.2 && z[i] < beachTop) c = SAND_RGB.slice(); // beach sand
        c = c.map((v) => v * lit);
        const t = (Math.log(Math.max(area[i] / cellA, 1)) - riverStart) / (logAmax - riverStart);
        if (t > 0 && !water) c = c.map((v, k) => v + Math.min(1, 0.4 + t) * (LAKE_RGB[k] - v));
        if (water === 1) c = LAKE_RGB.map((v) => v * (0.85 + 0.15 * s));
        if (water === 2) {
          // shallow water shows the bed (platforms, shoals); deep water darkens
          const depth = Math.min(1, (sea - z[i]) / 40);
          const bed = soil[i] > 0.2 ? SAND_RGB : rockRgb[surfaceRock[i]];
          const shallow = Math.exp(-(sea - z[i]) / 4);
          c = SEA_RGB.map((v, k) => (v * (1 - 0.5 * depth) + 40 * (1 - depth)) * (1 - 0.5 * shallow) + 0.5 * shallow * bed[k] * (0.7 + 0.3 * s));
        }
      }
    }
    out[3 * i] = c[0];
    out[3 * i + 1] = c[1];
    out[3 * i + 2] = c[2];
  }
  return out;
}

/**
 * For each pixel of a width x height image, the cell it shows (-1 = none).
 * The grid is fitted inside the image preserving aspect ratio.
 */
function pixelMap(grid, width, height) {
  if (!grid.cellAt) throw new Error('drawing a map needs a mesh with cellAt()');
  const b = grid.bounds;
  const x0 = b.xmin;
  const y0 = b.ymin;
  const scale = Math.min(width / (b.xmax - b.xmin), height / (b.ymax - b.ymin)); // pixels per metre
  const map = new Int32Array(width * height);
  for (let py = 0; py < height; py++) {
    for (let px = 0; px < width; px++) {
      map[py * width + px] = grid.cellAt(x0 + (px + 0.5) / scale, y0 + (py + 0.5) / scale);
    }
  }
  return { map, width, height, scale, x0, y0 };
}

/** Fill an RGBA buffer from per-cell colours through a pixel map. */
function paint(pm, colors, rgba, background = [24, 24, 28]) {
  const { map } = pm;
  for (let p = 0; p < map.length; p++) {
    const i = map[p];
    const o = 4 * p;
    if (i < 0) {
      rgba[o] = background[0]; rgba[o + 1] = background[1]; rgba[o + 2] = background[2];
    } else {
      rgba[o] = colors[3 * i]; rgba[o + 1] = colors[3 * i + 1]; rgba[o + 2] = colors[3 * i + 2];
    }
    rgba[o + 3] = 255;
  }
}

/**
 * Vertical cross-section along one grid row: sky, water, soil, and the rock
 * layers below the surface, coloured by lithology.
 * @returns {{zmin:number, zmax:number, exaggeration:number}}
 */
function crossSection(sim, row, width, height, rgba) {
  const { grid, z, rock, lith, upliftCum } = sim;
  const filled = sim.flow.filled;
  const sea = sim.seaLevel;
  const cols = grid.cols;
  row = Math.max(0, Math.min(grid.rows - 1, row | 0));
  let zmin = Infinity, zmax = -Infinity;
  for (let c = 0; c < cols; c++) {
    const i = row * cols + c;
    zmin = Math.min(zmin, rock[i]);
    zmax = Math.max(zmax, z[i], sea ?? -Infinity);
  }
  const relief = Math.max(zmax - zmin, 10);
  zmin -= 0.35 * relief;
  zmax += 0.08 * relief;
  const rockRgb = lith.color.map(hexToRgb);
  const sky = [34, 36, 44];
  const water = [70, 120, 175];
  const soilC = [196, 172, 128];
  for (let px = 0; px < width; px++) {
    const c = Math.min(cols - 1, Math.floor((px / width) * cols));
    const i = row * cols + c;
    const wl = Math.max(filled[i], sea ?? -Infinity);
    for (let py = 0; py < height; py++) {
      const e = zmax - ((py + 0.5) / height) * (zmax - zmin);
      let col;
      if (e > z[i]) col = e <= wl ? water : sky;
      else if (e > rock[i]) col = soilC;
      else col = rockRgb[lith.rockAt(i, e - upliftCum[i])];
      const o = 4 * (py * width + px);
      rgba[o] = col[0]; rgba[o + 1] = col[1]; rgba[o + 2] = col[2]; rgba[o + 3] = 255;
    }
  }
  const horiz = grid.width / width; // metres per pixel horizontally
  const vert = (zmax - zmin) / height;
  return { zmin, zmax, exaggeration: horiz / vert };
}

// ------------------------------------------------------------------ setup

function buildPresetMenu() {
  const sel = $('preset');
  for (const [name, p] of Object.entries(PRESETS)) {
    const o = document.createElement('option');
    o.value = name;
    o.textContent = name;
    o.title = p.description;
    sel.appendChild(o);
  }
  const custom = document.createElement('option');
  custom.value = '';
  custom.textContent = '(custom)';
  sel.appendChild(custom);
  sel.addEventListener('change', () => {
    if (!sel.value) return;
    stack = []; lastPatch = null;
    const params = resolveParams({ preset: sel.value });
    fillGridInputs(params);
    restart(params);
  });
}

function buildViewMenu() {
  const sel = $('view');
  for (const [k, label] of Object.entries(VIEWS)) {
    const o = document.createElement('option');
    o.value = k;
    o.textContent = label;
    sel.appendChild(o);
  }
  sel.addEventListener('change', draw);
}

function buildSliders() {
  const host = $('sliders');
  host.innerHTML = '';
  for (const s of SLIDERS) {
    if (s.group) {
      const h = document.createElement('h2');
      h.textContent = s.group;
      h.style.marginTop = '0.7rem';
      host.appendChild(h);
      continue;
    }
    if (s.toggle) {
      const lab = document.createElement('label');
      lab.className = 'check';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.dataset.path = s.path;
      cb.addEventListener('change', () => sim.setParams(nest(s.path, cb.checked)));
      lab.append(cb, document.createTextNode(s.label));
      host.appendChild(lab);
      continue;
    }
    const wrap = document.createElement('div');
    wrap.className = 'slider';
    const head = document.createElement('div');
    head.className = 'head';
    const name = document.createElement('span');
    name.textContent = s.label;
    const val = document.createElement('span');
    val.className = 'val';
    head.append(name, val);
    const input = document.createElement('input');
    input.type = 'range';
    input.min = 0;
    input.max = 1000;
    input.dataset.path = s.path;
    const toValue = (t) => (s.log ? s.min * Math.pow(s.max / s.min, t / 1000) : s.min + ((s.max - s.min) * t) / 1000);
    const toSlider = (v) => (s.log ? (1000 * Math.log(v / s.min)) / Math.log(s.max / s.min) : (1000 * (v - s.min)) / (s.max - s.min));
    input.addEventListener('input', () => {
      const v = toValue(+input.value);
      val.textContent = `${fmt(v)} ${s.unit}`;
      sim.setParams(nest(s.path, v));
      if (autoBox) autoBox.checked = false;
    });
    let autoBox = null;
    wrap._sync = () => {
      const v = get(sim.params, s.path);
      if (s.auto && v === 'auto') {
        autoBox.checked = true;
        val.textContent = 'auto';
      } else {
        input.value = toSlider(v);
        val.textContent = `${fmt(v)} ${s.unit}`;
        if (autoBox) autoBox.checked = false;
      }
    };
    wrap.append(head, input);
    if (s.auto) {
      const lab = document.createElement('label');
      lab.className = 'check';
      autoBox = document.createElement('input');
      autoBox.type = 'checkbox';
      autoBox.addEventListener('change', () => {
        sim.setParams(nest(s.path, autoBox.checked ? 'auto' : toValue(+input.value)));
        wrap._sync();
      });
      lab.append(autoBox, document.createTextNode('auto'));
      wrap.appendChild(lab);
    }
    host.appendChild(wrap);
  }
}

function syncControls() {
  for (const el of $('sliders').children) if (el._sync) el._sync();
  for (const cb of $('sliders').querySelectorAll('input[type=checkbox][data-path]')) cb.checked = !!get(sim.params, cb.dataset.path);
  $('dt').value = sim.params.time.dt;
  $('preset').value = sim.params.preset || '';
  $('preset-desc').textContent = sim.params.preset ? PRESETS[sim.params.preset]?.description ?? '' : 'Custom parameters.';
  refreshJson();
  updateExtent();
  syncZoom();
}

function syncZoom() {
  const levels = [...stack.map((f) => f.sim), sim];
  $('zoom-path').textContent = levels.map((s, k) => `level ${k}: dx ${+s.grid.dx.toPrecision(3)} m`).join(' › ') +
    (stack.length ? '' : '. Zoom in to refine a patch; the level above freezes and feeds its edges and rivers.');
  $('zoom-out').disabled = !stack.length;
  for (const id of ['cols', 'rows', 'dx', 'seed', 'preset']) $(id).disabled = stack.length > 0;
  $('zoom-in').textContent = zoomPending ? 'Click the map…' : 'Zoom in…';
}

function setSim(next) {
  sim = next;
  $('hover').innerHTML = '&nbsp;';
  fillGridInputs(sim.params);
  sectionRow = sim.grid.rows >> 1;
  resize();
  syncControls();
  draw();
}

function fillGridInputs(params) {
  $('cols').value = params.grid.cols;
  $('rows').value = params.grid.rows;
  $('dx').value = params.grid.dx;
  $('seed').value = params.seed;
  $('dt').value = params.time.dt;
}

function updateExtent() {
  const cols = +$('cols').value, rows = +$('rows').value, dx = +$('dx').value;
  const w = dx * (cols + 0.5) / 1000, h = (dx * Math.sqrt(3) / 2 * (rows - 1) + 2 * dx / Math.sqrt(3)) / 1000;
  $('extent').textContent = `${w.toFixed(2)} × ${h.toFixed(2)} km, ${cols * rows} cells`;
}

function gridOverrides() {
  return {
    seed: +$('seed').value,
    grid: { cols: +$('cols').value, rows: +$('rows').value, dx: +$('dx').value },
    time: { dt: +$('dt').value },
  };
}

function restart(params) {
  try {
    sim = new Simulation(params);
  } catch (e) {
    $('json-error').textContent = e.message;
    return;
  }
  $('json-error').textContent = '';
  sectionRow = sim.grid.rows >> 1;
  resize();
  syncControls();
  draw();
}

// ------------------------------------------------------------------ drawing

function resize() {
  const wrap = $('map-wrap');
  const cssW = Math.max(200, wrap.clientWidth);
  const g = sim.grid;
  const aspect = g.height / g.width;
  const maxH = window.innerHeight * 0.62;
  let w = cssW;
  let h = w * aspect;
  if (h > maxH) { h = maxH; w = h / aspect; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  // never draw at more than ~3 device pixels per cell row: costs time, adds nothing
  const W = Math.round(Math.min(w * dpr, g.cols * 12));
  const H = Math.round(W * aspect);
  mapCanvas.width = W;
  mapCanvas.height = H;
  mapCanvas.style.width = `${w}px`;
  mapCanvas.style.height = `${w * aspect}px`;
  pm = pixelMap(g, W, H);
  mapImage = mapCtx.createImageData(W, H);
  secCanvas.width = W;
  secCanvas.height = Math.round(W / 3.2);
  secCanvas.style.width = `${w}px`;
  secCanvas.style.height = `${w / 3.2}px`;
}

function draw() {
  const view = $('view').value;
  paint(pm, cellColors(sim, view), mapImage.data);
  mapCtx.putImageData(mapImage, 0, 0);
  // cross-section marker
  const y = (sim.grid.y[sectionRow * sim.grid.cols] - pm.y0) * pm.scale;
  mapCtx.strokeStyle = 'rgba(255,255,255,0.6)';
  mapCtx.setLineDash([6, 4]);
  mapCtx.lineWidth = 1;
  mapCtx.beginPath();
  mapCtx.moveTo(0, y + 0.5);
  mapCtx.lineTo(mapCanvas.width, y + 0.5);
  mapCtx.stroke();
  mapCtx.setLineDash([]);
  if (lastPatch && lastPatch.parent === sim) {
    const b = lastPatch.bounds;
    mapCtx.strokeStyle = 'rgba(255,255,255,0.9)';
    mapCtx.lineWidth = 2;
    mapCtx.strokeRect((b.xmin - pm.x0) * pm.scale, (b.ymin - pm.y0) * pm.scale, (b.xmax - b.xmin) * pm.scale, (b.ymax - b.ymin) * pm.scale);
  }

  const img = secCtx.createImageData(secCanvas.width, secCanvas.height);
  const info = crossSection(sim, sectionRow, secCanvas.width, secCanvas.height, img.data);
  secCtx.putImageData(img, 0, 0);
  $('section-info').textContent = `row ${sectionRow}  z ${info.zmin.toFixed(0)}…${info.zmax.toFixed(0)} m  vertical exaggeration ${info.exaggeration.toFixed(1)}×`;

  const s = sim.stats();
  $('stats').textContent =
    `t = ${(s.time / 1000).toFixed(1)} kyr  step ${s.step}  z ${s.minElevation.toFixed(0)}…${s.maxElevation.toFixed(0)} m  ` +
    `soil ${s.meanSoil.toFixed(2)} m  rockfalls ${s.rockfallEvents}` +
    (s.seaLevel != null ? `  sea level ${s.seaLevel.toFixed(1)} m  cliff collapses ${s.cliffCollapses}` : '');
  drawLegend(view);
  if (stack.length) {
    const c = compareWithParent(sim, stack[stack.length - 1].sim);
    $('zoom-compare').textContent =
      `Against the frozen level above, over ${c.parentCells} of its cells: mean elevation ${c.meanElevation.child.toFixed(1)} m ` +
      `(level above, extrapolated at its last rate: ${c.meanElevation.expected.toFixed(1)} m); largest river leaving ` +
      `${(c.largestExitArea.child / 1e6).toFixed(3)} km² (level above: ${(c.largestExitArea.parent / 1e6).toFixed(3)} km²).`;
  } else {
    $('zoom-compare').textContent = '';
  }
}

function drawLegend(view) {
  const host = $('legend');
  if (view !== 'geology' && view !== 'terrain') { host.innerHTML = ''; return; }
  const used = new Set();
  for (let i = 0; i < sim.grid.size; i++) used.add(sim.surfaceRock[i]);
  for (const k of sim.lith.layerRock) used.add(k);
  host.innerHTML = [...used].sort().map((k) => `<span style="--c:${sim.lith.color[k]}">${sim.lith.names[k]}</span>`).join('') +
    (view === 'terrain' ? '<span style="--c:#b09870">soil / talus</span><span style="--c:#decc96">beach sand</span><span style="--c:#487034">vegetation</span><span style="--c:#4678af">water</span>' : '');
}

function loop() {
  if (running) {
    const t0 = performance.now();
    do { sim.step(); } while (performance.now() - t0 < 30);
    draw();
  }
  requestAnimationFrame(loop);
}

// ------------------------------------------------------------------ events

function cellAtEvent(ev) {
  const r = mapCanvas.getBoundingClientRect();
  const px = Math.floor(((ev.clientX - r.left) / r.width) * mapCanvas.width);
  const py = Math.floor(((ev.clientY - r.top) / r.height) * mapCanvas.height);
  if (px < 0 || py < 0 || px >= pm.width || py >= pm.height) return -1;
  return pm.map[py * pm.width + px];
}

mapCanvas.addEventListener('mousemove', (ev) => {
  const i = cellAtEvent(ev);
  if (i < 0) { $('hover').innerHTML = '&nbsp;'; return; }
  const g = sim.grid;
  const lake = sim.flow.filled[i] - sim.z[i];
  $('hover').textContent =
    `cell (${g.col(i)}, ${g.row(i)})  z ${sim.z[i].toFixed(1)} m  soil ${sim.soil[i].toFixed(2)} m  ` +
    `rock ${sim.lith.names[sim.surfaceRock[i]]}  drainage ${(sim.flow.area[i] / 1e6).toFixed(3)} km²  ` +
    `vegetation ${(100 * sim.veg[i]).toFixed(0)}%  dz/dt ${(sim.dzdt[i] * 1000).toFixed(3)} mm/yr` +
    (lake > 0.05 ? `  lake ${lake.toFixed(1)} m deep` : '') +
    (sim.seaLevel != null && sim.z[i] < sim.seaLevel ? `  sea ${(sim.seaLevel - sim.z[i]).toFixed(1)} m deep` : '') +
    (sim.waveExposureField[i] > 0 ? `  waves ${(100 * sim.waveExposureField[i]).toFixed(0)}%` : '') +
    (sim.notch[i] > 0 ? `  notch ${sim.notch[i].toFixed(1)} m` : '');
});
mapCanvas.addEventListener('click', (ev) => {
  const i = cellAtEvent(ev);
  if (i < 0) return;
  if (zoomPending) {
    zoomPending = false;
    const opts = { center: [sim.grid.x[i], sim.grid.y[i]], factor: +$('zoom-factor').value, cols: +$('zoom-cells').value, rows: +$('zoom-cells').value };
    try {
      const child = zoomIn(sim, opts);
      stack.push({ sim, opts });
      setSim(child);
    } catch (e) {
      $('zoom-compare').textContent = e.message;
      syncZoom();
    }
    return;
  }
  sectionRow = sim.grid.row(i);
  draw();
});

$('zoom-in').addEventListener('click', () => {
  zoomPending = !zoomPending;
  syncZoom();
});
$('zoom-out').addEventListener('click', () => {
  if (!stack.length) return;
  const { sim: parent } = stack.pop();
  lastPatch = { parent, bounds: { ...sim.grid.bounds } };
  setSim(parent);
});

$('run').addEventListener('click', () => {
  running = !running;
  $('run').textContent = running ? 'Pause' : 'Run';
});
$('step').addEventListener('click', () => { sim.step(); draw(); });
$('reset').addEventListener('click', () => {
  if (stack.length) { // re-make this patch from its frozen parent
    const top = stack[stack.length - 1];
    setSim(zoomIn(top.sim, top.opts));
    return;
  }
  const base = { ...sim.params };
  restart(resolveParams({ ...base, ...gridOverrides(), grid: gridOverrides().grid, time: { ...base.time, dt: +$('dt').value } }));
});
$('dt').addEventListener('change', () => sim.setParams({ time: { dt: +$('dt').value } }));
for (const id of ['cols', 'rows', 'dx']) $(id).addEventListener('input', updateExtent);

function refreshJson() {
  $('json').value = JSON.stringify(sim.params, null, 2);
}
$('json-refresh').addEventListener('click', refreshJson);
$('json-apply').addEventListener('click', () => {
  try {
    const p = resolveParams(JSON.parse($('json').value));
    stack = []; lastPatch = null;
    fillGridInputs(p);
    restart(p);
  } catch (e) {
    $('json-error').textContent = e.message;
  }
});

$('copy-params').addEventListener('click', async () => {
  const text = JSON.stringify(sim.params, null, 2);
  try {
    await navigator.clipboard.writeText(text);
    $('copy-status').textContent = 'Parameters copied. Paste them into the JSON box (or a file) to reproduce this run.';
  } catch {
    // clipboard refused: open the JSON panel with the text selected instead
    refreshJson();
    $('json').closest('details').open = true;
    $('json').select();
    $('copy-status').textContent = 'Copying was blocked; the parameters are selected in the JSON box above.';
  }
});
// Single-file builds published where downloads are blocked set this flag.
if (window.EDGY_NO_DOWNLOADS) for (const el of document.querySelectorAll('[data-download]')) el.hidden = true;

function download(name, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('save-png').addEventListener('click', () => {
  mapCanvas.toBlob((b) => download(`edgy-${$('view').value}-t${Math.round(sim.time)}.png`, b));
});
$('save-snapshot').addEventListener('click', () => {
  download(`edgy-snapshot-t${Math.round(sim.time)}.json`, new Blob([JSON.stringify(sim.snapshot())], { type: 'application/json' }));
});
$('load').addEventListener('change', async (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    stack = []; lastPatch = null; // a loaded run stands alone (a saved patch keeps its edges and inflows)
    if (data.format?.startsWith('edgy-erosion-snapshot')) {
      sim = Simulation.fromSnapshot(data);
      fillGridInputs(sim.params);
      sectionRow = sim.grid.rows >> 1;
      resize();
      syncControls();
      draw();
    } else {
      const p = resolveParams(data);
      fillGridInputs(p);
      restart(p);
    }
  } catch (e) {
    $('json-error').textContent = e.message;
  }
});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { resize(); draw(); }, 150);
});

// ------------------------------------------------------------------ start

buildPresetMenu();
buildViewMenu();
buildSliders();
const initial = resolveParams({ preset: 'mesa-country' });
fillGridInputs(initial);
restart(initial);
requestAnimationFrame(loop);

// handy for poking at the simulation from the browser console
window.edgy = { get sim() { return sim; }, Simulation, resolveParams };

</script>
</body>
</html>
