<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edgy Erosion</title>
<style>
:root {
  /* dark-first: dusk over a canyon; light theme below mirrors it */
  --bg: #16171b;
  --panel: #1f2026;
  --line: #33353d;
  --text: #e4e2dc;
  --muted: #9a978f;
  --accent: #d38a4f;
  --on-accent: #1a1208;
  --error: #ff8a7a;
  --canvas-bg: #000000;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f1ec; --panel: #e9e5dc; --line: #cfc8ba; --text: #25221d; --muted: #6b655a;
    --accent: #b0642a; --on-accent: #fffaf3; --error: #b3261e; --canvas-bg: #d9d4c8; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f1ec; --panel: #e9e5dc; --line: #cfc8ba; --text: #25221d; --muted: #6b655a;
  --accent: #b0642a; --on-accent: #fffaf3; --error: #b3261e; --canvas-bg: #d9d4c8; color-scheme: light;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
  background: var(--bg);
  color: var(--text);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
}

header {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.25rem 1rem;
  padding: 0.6rem 1rem;
  border-bottom: 1px solid var(--line);
}
h1 { font-size: 1.15rem; margin: 0; letter-spacing: 0.02em; }
h2 { font-size: 0.85rem; margin: 0 0 0.4rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.sub, .note { color: var(--muted); font-size: 0.85em; }
.error { color: var(--error); white-space: pre-wrap; font-size: 0.85em; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

main {
  display: grid;
  grid-template-columns: minmax(260px, 320px) 1fr;
  min-height: calc(100vh - 3rem);
}

#controls {
  border-right: 1px solid var(--line);
  background: var(--panel);
  padding: 0.5rem 1rem 2rem;
  overflow-y: auto;
  max-height: calc(100vh - 3rem);
}
#controls section { padding: 0.6rem 0; border-bottom: 1px solid var(--line); }
#controls section:last-child { border-bottom: none; }

label { display: block; color: var(--muted); font-size: 0.85em; }
label.row { display: flex; flex-direction: column; gap: 0.2rem; }
input, select, textarea, button {
  font: inherit;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0.3rem 0.4rem;
}
input[type=number] { width: 100%; }
input[type=range] { width: 100%; padding: 0; accent-color: var(--accent); }
textarea { width: 100%; height: 18rem; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
button { cursor: pointer; padding: 0.35rem 0.8rem; }
button:hover { border-color: var(--muted); }
button:disabled, select:disabled, input:disabled { opacity: 0.5; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.buttons { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.4rem; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; margin-bottom: 0.4rem; align-items: end; }

.slider { margin: 0.35rem 0; }
.slider .head { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.85em; }
.slider .val { color: var(--text); font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.check { display: flex; align-items: center; gap: 0.4rem; margin: 0.3rem 0; }

#viewer { padding: 0.5rem 1rem 1rem; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.5rem; margin: 0.3rem 0; }
.toolbar label { display: flex; align-items: center; gap: 0.4rem; }
#map-wrap { width: 100%; }
canvas { display: block; width: 100%; image-rendering: pixelated; background: var(--canvas-bg); border-radius: 4px; }
#map { cursor: crosshair; }
#hover { min-height: 1.4em; color: var(--muted); margin: 0.2rem 0 0.6rem; }
#legend { display: flex; flex-wrap: wrap; gap: 0.3rem 0.9rem; margin-top: 0.5rem; font-size: 0.85em; color: var(--muted); }
#legend span::before { content: ""; display: inline-block; width: 0.8em; height: 0.8em; margin-right: 0.35em; vertical-align: -0.05em; border-radius: 2px; background: var(--c); }

@media (max-width: 760px) {
  main { grid-template-columns: 1fr; }
  #viewer { order: -1; }
  #controls { max-height: none; border-right: none; border-bottom: 1px solid var(--line); }
  #viewer { padding: 0.5rem 16px 1rem; }
  #controls { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
  <header>
    <h1>Edgy Erosion</h1>
    <span class="sub">landscape evolution on a hexagonal grid: rivers, soil, layered rock, cliffs and rockfall</span>
  </header>
  <main>
    <aside id="controls">
      <section>
        <label class="row">Preset
          <select id="preset"></select>
        </label>
        <p id="preset-desc" class="note"></p>
        <div class="buttons">
          <button id="run" class="primary">Run</button>
          <button id="step">Step</button>
          <button id="reset">Reset</button>
        </div>
      </section>

      <section>
        <h2>Grid <span class="note">(applies on Reset)</span></h2>
        <div class="grid3">
          <label>cols<input id="cols" type="number" min="8" max="1024" step="1"></label>
          <label>rows<input id="rows" type="number" min="8" max="1024" step="1"></label>
          <label>dx (m)<input id="dx" type="number" min="0.1" step="any"></label>
        </div>
        <div class="grid3">
          <label>seed<input id="seed" type="number" step="1"></label>
          <label>dt (yr)<input id="dt" type="number" min="1" step="any"></label>
          <span id="extent" class="note"></span>
        </div>
      </section>

      <section>
        <h2>Zoom</h2>
        <p id="zoom-path" class="note"></p>
        <div class="grid3">
          <label>refine ×<select id="zoom-factor"><option>2</option><option selected>4</option><option>8</option></select></label>
          <label>cells<select id="zoom-cells"><option>64</option><option selected>96</option><option>128</option></select></label>
        </div>
        <div class="buttons">
          <button id="zoom-in">Zoom in…</button>
          <button id="zoom-out" disabled>Zoom out</button>
        </div>
        <p id="zoom-compare" class="note"></p>
      </section>

      <section id="sliders"></section>

      <section>
        <details>
          <summary>All parameters (JSON)</summary>
          <p class="note">The complete, reproducible parameter set. Edit and press Apply to restart with it.</p>
          <textarea id="json" spellcheck="false"></textarea>
          <div class="buttons">
            <button id="json-apply">Apply &amp; reset</button>
            <button id="json-refresh">Refresh</button>
          </div>
          <p id="json-error" class="error"></p>
        </details>
      </section>

      <section>
        <h2>Export</h2>
        <div class="buttons">
          <button id="copy-params">Copy parameters</button>
          <button id="save-png" data-download>View as PNG</button>
          <button id="save-snapshot" data-download>Snapshot JSON</button>
        </div>
        <p id="copy-status" class="note"></p>
        <label class="row">Load snapshot / params
          <input id="load" type="file" accept=".json,application/json">
        </label>
      </section>
    </aside>

    <section id="viewer">
      <div class="toolbar">
        <label>View <select id="view"></select></label>
        <span id="stats" class="mono"></span>
      </div>
      <div id="map-wrap"><canvas id="map"></canvas></div>
      <div id="hover" class="mono">&nbsp;</div>
      <div class="toolbar"><span>Cross-section <span class="note">(click the map to choose a row)</span></span><span id="section-info" class="mono"></span></div>
      <canvas id="section"></canvas>
      <div id="legend"></div>
    </section>
  </main>

<script type="module">
// ---- src/rng.js ----
// Seeded pseudo-random numbers and smooth noise.
//
// Everything stochastic in the simulation draws from these, so a run is fully
// determined by its parameters (including `seed`). Math.random is never used.

/**
 * Mulberry32: a tiny 32-bit generator. Not cryptographic; plenty for terrain.
 * The whole state is one uint32, so it can be saved in a snapshot and resumed.
 */
class Rng {
  constructor(seed = 1) {
    this.state = (seed >>> 0) || 0x9e3779b9;
  }

  /** Uniform float in [0, 1). */
  next() {
    let t = (this.state = (this.state + 0x6d2b79f5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  /** Uniform float in [lo, hi). */
  uniform(lo, hi) {
    return lo + (hi - lo) * this.next();
  }
}

/** Integer hash of a lattice point and a seed, returning a float in [-1, 1]. */
function hash2(ix, iy, seed) {
  let h = Math.imul(ix, 0x27d4eb2d) ^ Math.imul(iy, 0x165667b1) ^ Math.imul(seed, 0x9e3779b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  h ^= h >>> 16;
  return (h >>> 0) / 2147483647.5 - 1;
}

const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);

/** Value noise on the unit square lattice, smooth (C2) interpolation, range ~[-1, 1]. */
function valueNoise(x, y, seed) {
  const x0 = Math.floor(x);
  const y0 = Math.floor(y);
  const u = fade(x - x0);
  const v = fade(y - y0);
  const a = hash2(x0, y0, seed);
  const b = hash2(x0 + 1, y0, seed);
  const c = hash2(x0, y0 + 1, seed);
  const d = hash2(x0 + 1, y0 + 1, seed);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

/**
 * Fractal (fractional Brownian motion) noise: a sum of octaves of value noise,
 * each with half the wavelength and `gain` times the amplitude of the last.
 * Normalised so the result stays roughly in [-1, 1].
 *
 * @param {number} x world coordinate (m)
 * @param {number} y world coordinate (m)
 * @param {{wavelength:number, octaves?:number, gain?:number, seed?:number}} o
 */
function fbm(x, y, { wavelength, octaves = 4, gain = 0.5, seed = 0 }) {
  let sum = 0;
  let amp = 1;
  let norm = 0;
  let f = 1 / wavelength;
  for (let k = 0; k < octaves; k++) {
    sum += amp * valueNoise(x * f, y * f, seed + 1013 * k);
    norm += amp;
    amp *= gain;
    f *= 2;
  }
  return sum / norm;
}

// ---- src/hexgrid.js ----
// Hexagonal lattice geometry.
//
// Layout: "pointy-top" hexagons stored in rows, with odd rows shifted right by
// half a cell ("odd-r" offset coordinates). Cell index i = row * cols + col.
//
//   row 0:   0   1   2   3
//   row 1:     4   5   6   7
//   row 2:   8   9  10  11
//
// Every cell centre is exactly `dx` from each of its six neighbours, so the
// cell centres form a triangular lattice and the cells are its Voronoi
// (hexagonal) tiles:
//
//   centre of (col, row):  x = dx * (col + (row & 1) / 2),  y = dx * (sqrt(3)/2) * row
//   hexagon side length (= circumradius):  a = dx / sqrt(3)
//   cell area:                             (sqrt(3) / 2) * dx^2
//
// Internally we also use axial coordinates (q, r) where the six neighbour
// directions are simple constant offsets; see https://www.redblobgames.com/grids/hexagons/
//
// HexGrid implements the general mesh contract in mesh.js (degree, area, dist,
// face, edge flags, bounds), so the processes never assume hexagons. It adds
// `lattice = true`: neighbour slot k always points along azimuth 60k degrees, which
// the wave-exposure sweep relies on. `originX/originY` place cell (0, 0) in world
// coordinates, so nested patches share their parent's coordinate system.

const SQRT3 = Math.sqrt(3);

/** Axial direction vectors, counter-clockwise starting from east. */
const AXIAL_DIRECTIONS = [
  [1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1],
];

/** Index of the opposite direction: OPPOSITE[k] points back along direction k. */
const OPPOSITE = [3, 4, 5, 0, 1, 2];

class HexGrid {
  /**
   * @param {number} cols number of cells per row
   * @param {number} rows number of rows
   * @param {number} dx centre-to-centre lattice spacing (m)
   * @param {number} [originX] world x of the centre of cell (0, 0) (m)
   * @param {number} [originY] world y of the centre of cell (0, 0) (m)
   */
  constructor(cols, rows, dx, originX = 0, originY = 0) {
    if (!(cols >= 3 && rows >= 3)) throw new Error('grid must be at least 3 x 3');
    if (!(dx > 0)) throw new Error('lattice spacing dx must be positive');
    this.cols = cols | 0;
    this.rows = rows | 0;
    this.dx = dx;
    this.size = this.cols * this.rows;
    this.rowSpacing = (SQRT3 / 2) * dx;
    this.cellArea = (SQRT3 / 2) * dx * dx;
    this.edgeLength = dx / SQRT3;
    /** Extent of the cell centres, plus half a cell of padding on each side. */
    this.width = dx * (this.cols + 0.5);
    this.height = this.rowSpacing * (this.rows - 1) + 2 * this.edgeLength;
    this.originX = originX;
    this.originY = originY;
    this.bounds = {
      xmin: originX - dx / 2, ymin: originY - this.edgeLength,
      xmax: originX - dx / 2 + this.width, ymax: originY - this.edgeLength + this.height,
    };
    this.degree = 6;
    this.lattice = true;

    const n = this.size;
    this.x = new Float64Array(n);
    this.y = new Float64Array(n);
    /** neighbours[6 * i + k] = index of the neighbour in direction k, or -1 outside the grid. */
    this.neighbors = new Int32Array(6 * n);
    /** Bit flags: 1 = west edge, 2 = east edge, 4 = north (row 0), 8 = south (last row). */
    this.edge = new Uint8Array(n);

    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        const i = r * this.cols + c;
        this.x[i] = originX + dx * (c + 0.5 * (r & 1));
        this.y[i] = originY + this.rowSpacing * r;
        let flags = 0;
        if (c === 0) flags |= 1;
        if (c === this.cols - 1) flags |= 2;
        if (r === 0) flags |= 4;
        if (r === this.rows - 1) flags |= 8;
        this.edge[i] = flags;
        const [q, rr] = offsetToAxial(c, r);
        for (let k = 0; k < 6; k++) {
          const [nc, nr] = axialToOffset(q + AXIAL_DIRECTIONS[k][0], rr + AXIAL_DIRECTIONS[k][1]);
          this.neighbors[6 * i + k] =
            nc >= 0 && nc < this.cols && nr >= 0 && nr < this.rows ? nr * this.cols + nc : -1;
        }
      }
    }

    // mesh contract: per-cell area, per-edge centre distance and shared face width
    this.area = new Float64Array(n).fill(this.cellArea);
    this.dist = new Float64Array(6 * n);
    this.face = new Float64Array(6 * n);
    for (let e = 0; e < 6 * n; e++) {
      if (this.neighbors[e] >= 0) { this.dist[e] = dx; this.face[e] = this.edgeLength; }
    }
  }

  index(col, row) {
    return row * this.cols + col;
  }

  col(i) {
    return i % this.cols;
  }

  row(i) {
    return (i / this.cols) | 0;
  }

  /**
   * Cell containing the world point (x, y), or -1 if it lies outside the grid.
   * Uses fractional axial coordinates and cube rounding.
   */
  cellAt(x, y) {
    x -= this.originX;
    y -= this.originY;
    const a = this.edgeLength;
    const qf = ((SQRT3 / 3) * x - y / 3) / a;
    const rf = ((2 / 3) * y) / a;
    // cube rounding: (q, r, s) with q + r + s = 0
    const sf = -qf - rf;
    let q = Math.round(qf);
    let r = Math.round(rf);
    const s = Math.round(sf);
    const dq = Math.abs(q - qf);
    const dr = Math.abs(r - rf);
    const ds = Math.abs(s - sf);
    if (dq > dr && dq > ds) q = -r - s;
    else if (dr > ds) r = -q - s;
    const [c, row] = axialToOffset(q, r);
    if (c < 0 || c >= this.cols || row < 0 || row >= this.rows) return -1;
    return row * this.cols + c;
  }

  /** The six corner points of cell i, for drawing. */
  corners(i) {
    const a = this.edgeLength;
    const out = [];
    for (let k = 0; k < 6; k++) {
      const ang = (Math.PI / 180) * (60 * k - 30);
      out.push([this.x[i] + a * Math.cos(ang), this.y[i] + a * Math.sin(ang)]);
    }
    return out;
  }
}

function offsetToAxial(col, row) {
  return [col - ((row - (row & 1)) >> 1), row];
}

function axialToOffset(q, r) {
  return [q + ((r - (r & 1)) >> 1), r];
}

// ---- src/params.js ----
// Parameters: defaults, presets, and merging.
//
// Units throughout: metres (m), years (yr), pascals (Pa), kilograms (kg).
// Parameters are plain JSON so that a run is reproducible from its parameter
// object alone (see Simulation.snapshot()).

/**
 * Rock library. Values are order-of-magnitude, chosen to be plausible at the
 * landscape scale rather than for any particular formation.
 *
 *  erodibility    K in the stream power law  E = K * A^m * S^n  (for m = 0.5, n = 1:
 *                 units yr^-1). Larger = channels cut it faster.
 *  cohesion       rock-MASS cohesion (Pa) in the Culmann cliff-stability criterion.
 *                 Much lower than intact-sample strength because of joints.
 *  frictionAngle  internal friction angle (degrees). Cliffs no steeper than this
 *                 never fail, whatever their height.
 *  weathering     maximum soil (regolith) production rate on bare rock (m/yr).
 *  waveErodibility  sea-cliff retreat rate under full wave exposure (m/yr).
 *                 Observed retreat: ~1e-3 for granite, ~0.1-0.3 for sandstone/chalk,
 *                 ~1 for weak shale or glacial till.
 *  color          for display only.
 */
const ROCKS = {
  granite:   { color: '#b9a99a', erodibility: 1e-5, cohesion: 1.0e6, frictionAngle: 45, weathering: 5e-5, waveErodibility: 0.005 },
  basalt:    { color: '#5d5a5c', erodibility: 1e-5, cohesion: 8.0e5, frictionAngle: 42, weathering: 6e-5, waveErodibility: 0.01 },
  sandstone: { color: '#c98a5a', erodibility: 2e-5, cohesion: 4.0e5, frictionAngle: 40, weathering: 1e-4, waveErodibility: 0.08 },
  limestone: { color: '#d8d2bd', erodibility: 1.5e-5, cohesion: 5.0e5, frictionAngle: 40, weathering: 8e-5, waveErodibility: 0.04 },
  schist:    { color: '#7f8a86', erodibility: 3e-5, cohesion: 2.0e5, frictionAngle: 35, weathering: 1.5e-4, waveErodibility: 0.05 },
  siltstone: { color: '#a8846a', erodibility: 8e-5, cohesion: 6.0e4, frictionAngle: 31, weathering: 3e-4, waveErodibility: 0.25 },
  shale:     { color: '#8f6f6a', erodibility: 1.5e-4, cohesion: 3.0e4, frictionAngle: 28, weathering: 4e-4, waveErodibility: 0.4 },
};

const DEFAULTS = {
  seed: 1,
  grid: {
    cols: 128,      // cells per row
    rows: 128,      // number of rows
    dx: 30,         // centre-to-centre lattice spacing (m)
    origin: [0, 0], // world position of the centre of cell (0, 0) (m)
  },
  // Rectangle { x, y, width, height } (m) that fractional positions refer to (plateau
  // margins, plugs, fault lines, dip centre). null = the domain itself. Zoomed patches
  // inherit their parent's so the geology lines up.
  frame: null,
  time: {
    dt: 2000,       // years per step
  },
  boundary: {
    // Which grid edges are fixed-elevation outlets (base level). Others are closed (no flux).
    open: ['north', 'south', 'east', 'west'],
    // Cells below this elevation are sea: water and sediment sinks. null = no sea.
    seaLevel: null,
  },
  initial: {
    // 'flat' | 'plateau' | 'dome' | 'ramp' | 'ridge'
    type: 'plateau',
    base: 0,         // elevation of the surroundings (m)
    height: 300,     // relief of the initial landform (m)
    margin: 0.15,    // plateau: fraction of the domain left low around the edge
    edgeWidth: 0.05, // plateau: width of the initial slope, as a fraction of domain width
    edgeNoise: 0,    // plateau: irregularity of the outline, as a fraction of domain width
    noise: { amplitude: 15, wavelength: 1000, octaves: 5, gain: 0.5 },
    soil: 0.5,       // initial soil (regolith) thickness (m)
  },
  uplift: {
    rate: 1e-4,      // rock uplift rate relative to base level (m/yr)
    // 'uniform' | 'dome' | 'tilt' | 'fault'
    pattern: 'uniform',
    // dome: gaussian of this width (fraction of domain width)
    radius: 0.3,
    // fault: line through the domain centre at this angle (degrees from +x); the
    // side to the left of the direction of strike is uplifted. offset shifts the line
    // (fraction of domain width).
    angle: 0,
    offset: 0,
    // tilt: rate goes from 0 at one side to `rate` at the other, along `angle`.
  },
  rocks: ROCKS,
  strata: {
    // Layers from the top of the stratigraphic column downwards. Thickness is true
    // thickness (perpendicular to bedding), in metres.
    layers: [{ rock: 'sandstone', thickness: 1e9 }],
    top: 1000,          // elevation of the top of the column at the domain centre (m)
    repeat: false,      // repeat the layer sequence indefinitely downwards
    basement: 'granite',// rock below the last layer (when not repeating)
    dip: 0,             // dip angle of the layers (degrees)
    dipDirection: 0,    // azimuth the layers descend towards (degrees, 0 = east, 90 = north)
    undulation: { amplitude: 0, wavelength: 2000 }, // gentle folding/irregularity of layer surfaces (m)
    // Random spatial variation of rock strength: erodibility x f, cohesion / f, with
    // ln f a smooth noise field of this amplitude (natural-log units) and wavelength (m).
    strengthVariation: { amplitude: 0.5, wavelength: 300 },
  },
  // Vertical bodies of rock that cut across the strata: volcanic plugs, intrusions, dikes.
  // Positions and sizes are fractions of the domain width/height so presets survive
  // changes of grid size. `top` (optional) is the elevation the body reaches up to.
  // e.g. { shape: 'disc', x: 0.5, y: 0.5, radius: 0.08, rock: 'basalt', top: 250 }
  //      { shape: 'dike', x0: 0.1, y0: 0.2, x1: 0.9, y1: 0.7, width: 0.01, rock: 'basalt' }
  bodies: [],
  climate: {
    precipitation: 1.0,          // mean effective runoff-producing precipitation (m/yr)
    precipitationGradient: 0,    // fractional change from west edge to east edge (e.g. -0.5)
    frost: 0.3,                  // 0..1, freeze-thaw intensity: speeds rockfall and weathering
  },
  vegetation: {
    // 'auto' derives the maximum cover from precipitation; a number 0..1 fixes it.
    cover: 'auto',
    halfSaturation: 0.5,         // precipitation (m/yr) giving 50% cover when 'auto'
    soilDepthScale: 0.3,         // cover falls off on soils thinner than this (m): bare rock is bare
    erodibilityReduction: 2.0,   // soil erodibility multiplied by exp(-this * cover)
    diffusivityBoost: 1.0,       // creep diffusivity multiplied by (1 + this * cover) (bioturbation)
    slopeBoost: 0.3,             // critical soil slope multiplied by (1 + this * cover) (root cohesion)
    productionBoost: 0.5,        // soil production multiplied by (1 + this * cover)
  },
  fluvial: {
    enabled: true,
    m: 0.5,                      // drainage-area exponent
    n: 1.0,                      // slope exponent
    soilErodibility: 4e-4,       // K for loose soil/sediment (same units as rock K)
    // 'mfd': drainage area spread over all lower neighbours (smoother hillslopes, no
    // grid-aligned streaks); 'sfd': all to the steepest neighbour (classic D6).
    routing: 'mfd',
    flowExponent: 4,             // MFD: share proportional to drop^this (higher = more channelised)
    // Pick each cell's receiver at random among lower neighbours (weights drop^randomExponent),
    // re-drawn every step. Breaks up channels that would otherwise lock onto the lattice axes.
    randomReceivers: true,
    randomExponent: 2,
    deposition: 0.5,             // dimensionless deposition coefficient G; 0 = detachment-limited
  },
  hillslope: {
    enabled: true,
    diffusivity: 0.01,           // soil creep diffusivity (m^2/yr)
    criticalSlope: 0.8,          // gradient where creep diverges; also the soil angle of repose (~39 deg)
    maxNonlinearity: 10,         // cap on the nonlinear enhancement factor 1/(1-(S/Sc)^2)
    transportDepth: 0.3,         // creep falls off on soils thinner than this (m)
    avalancheIterations: 40,     // max relaxation sweeps per step for over-steep soil/talus
  },
  weathering: {
    enabled: true,
    productionDepth: 0.5,        // soil production e-folding depth h* (m)
    frostBoost: 1.0,             // production multiplied by (1 + this * frost)
    moistureExponent: 1.0,       // production multiplied by (precipitation / 1 m/yr)^this
  },
  coast: {
    // Acts only when boundary.seaLevel is set. Sea level = boundary.seaLevel + a sinusoid,
    // or + a piecewise-linear curve [[time_yr, offset_m], ...] if seaLevelCurve is given.
    enabled: true,
    seaLevelAmplitude: 0,        // m
    seaLevelPeriod: 100000,      // yr (glacial cycles: ~41 kyr before ~1 Ma, ~100 kyr since)
    seaLevelPhase: 90,           // degrees; 90 starts at a highstand
    seaLevelCurve: null,
    tidalRange: 2,               // m
    waveHeight: 2,               // significant wave height (m): sets breaking depth and erosion depth
    // wave climate: directions waves come FROM (deg, 0 = east, 90 = north) and relative
    // weights. Resolved onto the six lattice directions (every 60 degrees).
    waves: [
      { from: 0, weight: 1 }, { from: 45, weight: 1 }, { from: 90, weight: 1 }, { from: 135, weight: 1 },
      { from: 180, weight: 1 }, { from: 225, weight: 1 }, { from: 270, weight: 1 }, { from: 315, weight: 1 },
    ],
    refraction: 0.35,            // share of wave energy spread over all directions (wraps round headlands)
    fetchScale: 3000,            // open-water distance (m) over which waves build to full size
    dissipationLength: 150,      // distance (m) over breaking-depth water that damps waves by e
    beachShielding: 1.0,         // soil thickness (m) that cuts wave erosion by e
    platformRatio: 0.02,         // vertical platform lowering rate / horizontal cliff retreat rate
    depthScale: 1.0,             // erosion decays below low tide over depthScale x waveHeight
    attrition: 0.05,             // rate (m/yr, at full exposure) at which waves grind shore sediment to fines
    debrisRetained: 0.3,         // fraction of eroded rock kept as beach/shore sediment (rest: fines, lost)
    marineDiffusivity: 10,       // shore sediment diffusivity at full exposure (m^2/yr)
    closureDepth: 10,            // depth (m) below which waves barely move sediment (e-folding)
    maxSubsteps: 60,             // cap on diffusion substeps per step (D is reduced if it binds)
  },
  rockfall: {
    enabled: true,
    rockDensity: 2600,           // kg/m^3
    timescale: 300,              // mean waiting time (yr) for an unstable cliff to fail
    frostFactor: 5,              // failure rate multiplied by (1 + this * frost)
  },
};

const isPlainObject = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

/** Recursive merge: objects merge key by key, everything else (including arrays) replaces. */
function deepMerge(base, over) {
  if (!isPlainObject(over)) return over === undefined ? clone(base) : clone(over);
  const out = isPlainObject(base) ? clone(base) : {};
  for (const [k, v] of Object.entries(over)) {
    out[k] = isPlainObject(v) && isPlainObject(out[k]) ? deepMerge(out[k], v) : clone(v);
  }
  return out;
}

function clone(v) {
  return v === undefined ? undefined : JSON.parse(JSON.stringify(v));
}

/**
 * Build a complete parameter object: DEFAULTS <- PRESETS[preset] <- overrides.
 * The returned object records which preset it came from but is self-contained.
 *
 * @param {object|string} [input] overrides (may include `preset: name`), or a preset name
 */
function resolveParams(input = {}) {
  const overrides = typeof input === 'string' ? { preset: input } : input;
  let p = clone(DEFAULTS);
  if (overrides.preset) {
    const preset = PRESETS[overrides.preset];
    if (!preset) throw new Error(`unknown preset "${overrides.preset}"; try one of: ${Object.keys(PRESETS).join(', ')}`);
    const { description, ...rest } = preset;
    p = deepMerge(p, rest);
  }
  p = deepMerge(p, overrides);
  validate(p);
  return p;
}

/** Throw a descriptive error for parameter combinations that cannot work. */
function validate(p) {
  const fail = (msg) => { throw new Error(`invalid parameters: ${msg}`); };
  if (!(p.grid.cols >= 3 && p.grid.rows >= 3)) fail('grid must be at least 3 x 3');
  if (!(p.grid.dx > 0)) fail('grid.dx must be positive');
  if (!(p.time.dt > 0)) fail('time.dt must be positive');
  if (!(p.fluvial.n > 0)) fail('fluvial.n must be positive');
  const rockNames = new Set(Object.keys(p.rocks));
  const needRock = (name, where) => { if (!rockNames.has(name)) fail(`${where} refers to unknown rock "${name}"`); };
  if (!p.strata.layers.length) fail('strata.layers must not be empty');
  p.strata.layers.forEach((l, k) => {
    needRock(l.rock, `strata.layers[${k}]`);
    if (!(l.thickness > 0)) fail(`strata.layers[${k}].thickness must be positive`);
  });
  needRock(p.strata.basement, 'strata.basement');
  p.bodies.forEach((b, k) => needRock(b.rock, `bodies[${k}]`));
  const sides = ['north', 'south', 'east', 'west'];
  for (const s of p.boundary.open) if (!sides.includes(s)) fail(`boundary.open: unknown side "${s}"`);
  if (!p.boundary.open.length && p.boundary.seaLevel == null) {
    fail('need at least one open boundary or a sea level, or water has nowhere to go');
  }
}

// ---- src/lithology.js ----
// Lithology: which rock lies at a given place and depth.
//
// Rock type is a function of position (x, y) and of elevation in the rock's own
// reference frame. Uplift carries the strata up with it, so we look rock up at
//   z_frame = z - cumulativeUplift[i]
// i.e. the elevation the rock had at t = 0. The stratigraphic column is a stack of
// layers whose top surface is a plane (optionally dipping, optionally undulating):
//
//   columnTop(x, y) = top - tan(dip) * s(x, y) + undulation(x, y)
//
// where s is the distance along the dip direction from the domain centre. Vertical
// bodies (plugs, dikes) override the strata below their `top` elevation.


class Lithology {
  /**
   * @param {object} params resolved parameters
   * @param {import('./hexgrid.js').HexGrid} grid
   */
  constructor(params, grid, frame) {
    this.grid = grid;
    const names = Object.keys(params.rocks);
    this.names = names;
    const R = names.length;
    this.erodibility = new Float64Array(R);
    this.cohesion = new Float64Array(R);
    this.frictionAngle = new Float64Array(R); // radians
    this.weathering = new Float64Array(R);
    this.waveErodibility = new Float64Array(R);
    this.color = [];
    names.forEach((name, k) => {
      const r = params.rocks[name];
      this.erodibility[k] = r.erodibility;
      this.cohesion[k] = r.cohesion;
      this.frictionAngle[k] = (r.frictionAngle * Math.PI) / 180;
      this.weathering[k] = r.weathering;
      this.waveErodibility[k] = r.waveErodibility ?? 0.1;
      this.color.push(r.color || '#888888');
    });
    const idx = (name) => names.indexOf(name);

    const st = params.strata;
    this.layerRock = Int32Array.from(st.layers.map((l) => idx(l.rock)));
    // layerBottom[k] = depth below column top of the base of layer k
    this.layerBottom = new Float64Array(st.layers.length);
    // Layer thickness is TRUE thickness, measured perpendicular to the bedding. We look
    // layers up by vertical depth, and a layer of true thickness t dipping at angle
    // `dip` spans t / cos(dip) vertically.
    const vert = 1 / Math.cos(((st.dip || 0) * Math.PI) / 180);
    let d = 0;
    st.layers.forEach((l, k) => { d += l.thickness * vert; this.layerBottom[k] = d; });
    this.columnThickness = d;
    this.repeat = !!st.repeat;
    this.basement = idx(st.basement);

    const n = grid.size;
    // fractional positions and the dip centre refer to the reference frame (see
    // referenceFrame in simulation.js), by default the domain itself
    const F = frame || { x: 0, y: 0, width: grid.width, height: grid.height };
    const W = F.width;
    const H = F.height;
    const xc = F.x + W / 2;
    const yc = F.y + H / 2;
    const tanDip = Math.tan(((st.dip || 0) * Math.PI) / 180);
    const az = ((st.dipDirection || 0) * Math.PI) / 180;
    // screen y points south, so "north" is -y
    const ux = Math.cos(az);
    const uy = -Math.sin(az);
    const und = st.undulation || { amplitude: 0 };
    this.columnTop = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      const s = (grid.x[i] - xc) * ux + (grid.y[i] - yc) * uy;
      let top = st.top - tanDip * s;
      if (und.amplitude) top += und.amplitude * fbm(grid.x[i], grid.y[i], { wavelength: und.wavelength, octaves: 3, seed: (params.seed | 0) + 77 });
      this.columnTop[i] = top;
    }

    // Spatial variation in rock strength (fracture density, cementation...): a smooth
    // random field f(x, y) with E[ln f] = 0. Erodibility is multiplied by f, cohesion
    // divided by it. Breaks up the perfectly regular patterns uniform rock would give.
    const sv = params.strata.strengthVariation || { amplitude: 0 };
    this.weakness = new Float64Array(n).fill(1);
    if (sv.amplitude) {
      for (let i = 0; i < n; i++) {
        this.weakness[i] = Math.exp(sv.amplitude * fbm(grid.x[i], grid.y[i], { wavelength: sv.wavelength, octaves: 4, seed: (params.seed | 0) + 191 }));
      }
    }

    // Vertical bodies
    this.bodyRock = new Int32Array(n).fill(-1);
    this.bodyTop = new Float64Array(n).fill(Infinity);
    for (const b of params.bodies || []) {
      const rock = idx(b.rock);
      const top = b.top ?? Infinity;
      for (let i = 0; i < n; i++) {
        const px = (grid.x[i] - F.x) / W;
        const py = (grid.y[i] - F.y) / H;
        let inside = false;
        if (b.shape === 'disc') {
          // radius is a fraction of width; measure in width units on both axes
          const ddx = px - b.x;
          const ddy = (py - b.y) * (H / W);
          inside = ddx * ddx + ddy * ddy <= b.radius * b.radius;
        } else if (b.shape === 'dike') {
          inside = segmentDistance(px, py * (H / W), b.x0, b.y0 * (H / W), b.x1, b.y1 * (H / W)) <= b.width / 2;
        } else {
          throw new Error(`unknown body shape "${b.shape}"`);
        }
        if (inside) {
          this.bodyRock[i] = rock;
          this.bodyTop[i] = top;
        }
      }
    }
  }

  /**
   * Rock index at cell i and frame elevation z (elevation corrected for uplift).
   */
  rockAt(i, z) {
    if (this.bodyRock[i] >= 0 && z <= this.bodyTop[i]) return this.bodyRock[i];
    let depth = this.columnTop[i] - z;
    if (this.repeat) {
      // a repeating sequence repeats both downwards and upwards
      depth -= Math.floor(depth / this.columnThickness) * this.columnThickness;
    } else if (depth < 0) {
      return this.layerRock[0]; // above the column: top layer extends upward
    } else if (depth >= this.columnThickness) {
      return this.basement;
    }
    const lb = this.layerBottom;
    for (let k = 0; k < lb.length; k++) if (depth < lb[k]) return this.layerRock[k];
    return this.layerRock[lb.length - 1];
  }

  /**
   * Thickness-weighted mean cohesion and tan(friction angle) of the rock between
   * frame elevations zLow and zHigh in cell i. This is the strength of a cliff
   * face cutting through several layers: a failure plane must shear through all of them.
   * Samples at `samples` evenly spaced elevations (cheap, and exact enough for display-scale layers).
   */
  meanStrength(i, zLow, zHigh, samples = 8) {
    if (zHigh <= zLow) {
      const k = this.rockAt(i, zHigh);
      return { cohesion: this.cohesion[k] / this.weakness[i], phi: this.frictionAngle[k] };
    }
    let c = 0;
    let t = 0;
    const h = (zHigh - zLow) / samples;
    for (let s = 0; s < samples; s++) {
      const k = this.rockAt(i, zLow + (s + 0.5) * h);
      c += this.cohesion[k];
      t += Math.tan(this.frictionAngle[k]);
    }
    return { cohesion: c / samples / this.weakness[i], phi: Math.atan(t / samples) };
  }
}

function segmentDistance(px, py, x0, y0, x1, y1) {
  const vx = x1 - x0;
  const vy = y1 - y0;
  const len2 = vx * vx + vy * vy;
  let t = len2 > 0 ? ((px - x0) * vx + (py - y0) * vy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  const dx = px - (x0 + t * vx);
  const dy = py - (y0 + t * vy);
  return Math.sqrt(dx * dx + dy * dy);
}

// ---- src/flow.js ----
// Water routing: depression filling, flow directions, and discharge.
//
// 1. Priority-flood (Barnes, Lehman & Mulla 2014, "Priority-flood: An optimal
//    depression-filling and watershed-labeling algorithm", Computers & Geosciences 62)
//    grows inward from the outlets, always expanding the lowest known cell. Any
//    cell reached from a higher one is a pit and is raised to just above it; the
//    raised surface `filled` is the water surface of lakes. A tiny epsilon makes
//    lake surfaces drain in a definite direction.
// 2. Each cell drains to its steepest-descent neighbour on the filled surface (single
//    flow direction).
//    Drainage AREA can optionally be spread over all lower neighbours (multiple flow
//    direction), which avoids grid-aligned streaks on planar hillslopes; incision and
//    sediment still follow the single steepest receiver.
// 3. Cells pop off the priority queue in increasing filled elevation, so every
//    cell appears after its receiver. That pop order is the "stack": iterate it
//    forwards to go downstream-first, backwards to go upstream-first.

class MinHeap {
  constructor(capacity) {
    this.idx = new Int32Array(capacity);
    this.key = new Float64Array(capacity);
    this.n = 0;
  }
  push(i, k) {
    let p = this.n++;
    const { idx, key } = this;
    while (p > 0) {
      const parent = (p - 1) >> 1;
      if (key[parent] <= k) break;
      idx[p] = idx[parent];
      key[p] = key[parent];
      p = parent;
    }
    idx[p] = i;
    key[p] = k;
  }
  pop() {
    const { idx, key } = this;
    const top = idx[0];
    const last = --this.n;
    const li = idx[last];
    const lk = key[last];
    let p = 0;
    for (;;) {
      let c = 2 * p + 1;
      if (c >= last) break;
      if (c + 1 < last && key[c + 1] < key[c]) c++;
      if (key[c] >= lk) break;
      idx[p] = idx[c];
      key[p] = key[c];
      p = c;
    }
    idx[p] = li;
    key[p] = lk;
    return top;
  }
}

/** Lake surfaces rise by this much (m) per cell away from their outlet. */
const FLAT_EPSILON = 1e-6;

/**
 * @param {object} mesh any mesh satisfying the contract in mesh.js
 * @param {Float64Array} z surface elevation
 * @param {Uint8Array} outlet 1 where water leaves the domain (base level / sea)
 * @param {Float64Array} weight per-cell runoff multiplier (precipitation / 1 m/yr)
 * @param {object} out preallocated arrays: filled, receiver, receiverDist, order, area,
 *   visited (scratch). Optional: out.flowExponent > 0 switches drainage area to multiple
 *   flow direction; out.randomExponent > 0 with out.rng draws random receivers;
 *   out.inflow (Float64Array, m^2) adds drainage area entering from outside the domain.
 */
function routeFlow(mesh, z, outlet, weight, out) {
  const n = mesh.size;
  const D = mesh.degree;
  const nb = mesh.neighbors;
  const dist = mesh.dist;
  const { filled, receiver, order, area } = out;
  const rdist = out.receiverDist;
  const visited = out.visited;
  visited.fill(0);
  const heap = out.heap || (out.heap = new MinHeap(n));
  heap.n = 0;

  let anyOutlet = false;
  for (let i = 0; i < n; i++) {
    if (outlet[i]) {
      filled[i] = z[i];
      receiver[i] = -1;
      visited[i] = 1;
      heap.push(i, z[i]);
      anyOutlet = true;
    }
  }
  if (!anyOutlet) throw new Error('routeFlow: no outlet cells');

  let count = 0;
  while (heap.n > 0) {
    const c = heap.pop();
    order[count++] = c;
    const fc = filled[c];
    for (let k = 0; k < D; k++) {
      const j = nb[D * c + k];
      if (j < 0 || visited[j]) continue;
      visited[j] = 1;
      const raised = fc + FLAT_EPSILON;
      filled[j] = z[j] > raised ? z[j] : raised;
      heap.push(j, filled[j]);
    }
  }
  if (count < n) throw new Error('routeFlow: some cells are not connected to any outlet');

  // Receivers: the steepest descent on the filled surface (drop / distance), or with
  // randomExponent a random lower neighbour weighted by slope^p (the hex analogue of
  // the "Rho8" method of Fairfield & Leymarie 1991, Water Resour. Res. 27). Re-drawn
  // every step, random receivers remove the bias towards the lattice directions while
  // keeping a single receiver for the implicit solver.
  const rng = out.rng;
  const rp = out.randomExponent ?? 0;
  for (let i = 0; i < n; i++) {
    if (outlet[i]) { if (rdist) rdist[i] = 0; continue; }
    const fi = filled[i];
    let best = -1;
    let bestS = 0;
    let bestD = 0;
    let sum = 0;
    for (let k = 0; k < D; k++) {
      const e = D * i + k;
      const j = nb[e];
      if (j < 0 || filled[j] >= fi) continue;
      const S = (fi - filled[j]) / dist[e];
      if (S > bestS) { bestS = S; best = j; bestD = dist[e]; }
      if (rp > 0) sum += Math.pow(S, rp);
    }
    if (rng && rp > 0) {
      let u = rng.next() * sum;
      for (let k = 0; k < D; k++) {
        const e = D * i + k;
        const j = nb[e];
        if (j < 0 || filled[j] >= fi) continue;
        u -= Math.pow((fi - filled[j]) / dist[e], rp);
        if (u <= 0) { best = j; bestD = dist[e]; break; }
      }
    }
    receiver[i] = best;
    if (rdist) rdist[i] = bestD;
  }

  const inflow = out.inflow;
  for (let i = 0; i < n; i++) area[i] = weight[i] * mesh.area[i] + (inflow ? inflow[i] : 0);
  const p = out.flowExponent ?? 0;
  if (!(p > 0)) {
    // single flow direction: everything goes to the receiver
    for (let s = n - 1; s >= 0; s--) {
      const i = order[s];
      const r = receiver[i];
      if (r >= 0) area[r] += area[i];
    }
    return;
  }
  // Multiple flow direction (Freeman 1991, Computers & Geosciences 17): area is shared
  // among all lower neighbours in proportion to slope^p. Large p tends to single flow.
  // Every lower neighbour has lower filled elevation, so it comes earlier in `order`
  // and the upstream-first sweep stays valid.
  const w = out.mfdWeights || (out.mfdWeights = new Float64Array(D));
  for (let s = n - 1; s >= 0; s--) {
    const i = order[s];
    if (receiver[i] < 0) continue;
    const fi = filled[i];
    let sum = 0;
    for (let k = 0; k < D; k++) {
      const e = D * i + k;
      const j = nb[e];
      const d = j >= 0 ? fi - filled[j] : 0;
      w[k] = d > 0 ? Math.pow(d / dist[e], p) : 0;
      sum += w[k];
    }
    const ai = area[i] / sum;
    for (let k = 0; k < D; k++) if (w[k] > 0) area[nb[D * i + k]] += ai * w[k];
  }
}

// ---- src/processes/fluvial.js ----
// Rivers: bedrock/soil incision by the stream power law, then sediment transport
// and deposition downstream.
//
// INCISION. Channel lowering rate E = K * A^m * S^n, where A is the effective
// drainage area (upstream area weighted by precipitation / 1 m/yr) and S the slope
// to the receiver. Rock has its own K; loose sediment (soil, alluvium, talus) has
// K_soil, reduced by vegetation. Within a step the river first strips any sediment
// on its bed at the soil rate, and only then cuts rock, for the remaining time.
//
// Why "strip, then cut" rather than a cover factor exp(-soil/H*) taken from the
// start of the step (as in SPACE, Shobe, Tucker & Barnhart 2017, Geosci. Model Dev. 10):
// each step leaves a sediment layer whose thickness scales with dt (from weathering
// and deposition), and a cover factor computed from it made incision depend strongly
// on dt -- quartering dt changed 150 kyr of evolution by tens of metres, without
// converging. Stripping costs a fraction of the step that does not depend on dt.
//
// Each phase is solved implicitly, downstream first (Braun & Willett 2013,
// Geomorphology 180-181): unconditionally stable for n = 1; Newton's method for n != 1.
//
// DEPOSITION. Eroded material travels downstream as a volumetric flux Qs (m^3/yr).
// Each cell deposits at rate D = G * Qs / A ("xi-q" erosion-deposition model of
// Davy & Lague 2009, in the dimensionless form of Yuan et al. 2019, JGR Earth Surface
// 124). G = 0 recovers pure detachment-limited incision; G ~ 1 gives alluvial
// valleys and fans. Lakes and the sea trap sediment up to their water level.
//
/**
 * @param {import('../simulation.js').Simulation} sim
 * @param {number} dt years
 */
function fluvial(sim, dt) {
  const p = sim.params.fluvial;
  const { grid, lith, rock, soil, z, outlet, boundaryOutlet, veg } = sim;
  const { filled, receiver, receiverDist, order, area } = sim.flow;
  const n = grid.size;
  const cellArea = grid.area;
  const m = p.m;
  const nExp = p.n;
  const Ks = p.soilErodibility;
  const G = p.deposition;
  const vegRed = sim.params.vegetation.erodibilityReduction;
  const sea = sim.seaLevel;
  const lakeTol = 1e-3;
  const eroded = sim.scratch.eroded; // lowering depth this step (m)
  const zNew = sim.scratch.zNew;

  // --- incision, downstream first ---
  for (let s = 0; s < n; s++) {
    const i = order[s];
    eroded[i] = 0;
    zNew[i] = z[i];
    if (outlet[i]) continue;
    if (filled[i] - z[i] > lakeTol) continue; // under a lake: no incision
    const r = receiver[i];
    const zr = zNew[r];
    if (z[i] <= zr) continue;
    const L = receiverDist[i];
    const Am = Math.pow(area[i], m);
    const kSoil = Ks * Math.exp(-vegRed * veg[i]);
    const kRock = lith.erodibility[sim.surfaceRock[i]] * lith.weakness[i];
    // Strip, then cut: loose sediment on the bed is entrained at the soil rate first;
    // only once it is gone does the river cut rock, for the rest of the step.
    let fromSoil = 0;
    let fromRock = 0;
    const zSoil = implicitStep(z[i], zr, kSoil * Am, dt, L, nExp);
    const soilWanted = z[i] - zSoil;
    if (soilWanted <= soil[i]) {
      fromSoil = soilWanted;
    } else {
      fromSoil = soil[i];
      // time spent stripping, in proportion to the depth stripped
      const tRest = dt * (1 - soil[i] / soilWanted);
      const z1 = z[i] - soil[i];
      if (tRest > 0 && z1 > zr) fromRock = z1 - implicitStep(z1, zr, kRock * Am, tRest, L, nExp);
    }
    soil[i] -= fromSoil;
    rock[i] -= fromRock;
    eroded[i] = fromSoil + fromRock;
    zNew[i] = z[i] - eroded[i];
  }

  // --- sediment routing and deposition, upstream first ---
  const qs = sim.scratch.qs; // incoming sediment flux (m^3/yr)
  if (sim.inflowSediment) qs.set(sim.inflowSediment); // rivers entering from outside the domain
  else qs.fill(0);
  const qsOut = sim.qsOut;
  qsOut.fill(0);
  let exported = 0;
  for (let s = n - 1; s >= 0; s--) {
    const i = order[s];
    const ac = cellArea[i];
    const supply = qs[i] + (eroded[i] * ac) / dt; // m^3/yr
    if (supply <= 0) continue;
    const maxDepth = (supply * dt) / ac; // all of it, as a thickness on this cell
    let d;
    if (outlet[i]) {
      d = !boundaryOutlet[i] && sea != null ? clamp(sea - zNew[i], 0, maxDepth) : 0;
    } else if (filled[i] - z[i] > lakeTol) {
      // a lake (judged on the pre-incision surface, which z still holds): fill to the water level
      d = Math.min(filled[i] - zNew[i], maxDepth);
    } else if (G > 0) {
      d = ((G * supply) / (area[i] + G * ac)) * dt;
    } else {
      d = 0;
    }
    soil[i] += d;
    zNew[i] += d;
    const out = supply - (d * ac) / dt;
    qsOut[i] = out;
    const r = receiver[i];
    if (r >= 0) qs[r] += out;
    else exported += out * dt;
  }
  sim.qs = qs;
  for (let i = 0; i < n; i++) z[i] = rock[i] + soil[i];
  return exported;
}

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}

/**
 * One implicit (backward Euler) step of dz/dt = -KA (z - zr)^n / L^n for a cell whose
 * receiver has already been updated to zr (Braun & Willett 2013). Exact algebra for
 * n = 1; Newton's method otherwise. Returns the new elevation, never below zr.
 */
function implicitStep(z0, zr, KA, dt, L, n) {
  if (n === 1) {
    const F = (KA * dt) / L;
    return (z0 + F * zr) / (1 + F);
  }
  // f(h) = h - h0 + F h^n = 0 with h = z - zr, h0 = z0 - zr
  const F = (KA * dt) / Math.pow(L, n);
  const h0 = z0 - zr;
  let h = h0;
  for (let it = 0; it < 30; it++) {
    const hn1 = Math.pow(h, n - 1);
    const f = h - h0 + F * hn1 * h;
    const df = 1 + n * F * hn1;
    const hNext = Math.max(h - f / df, h * 1e-3);
    if (Math.abs(hNext - h) < 1e-9 * (1 + h0)) { h = hNext; break; }
    h = hNext;
  }
  return zr + h;
}

// ---- src/processes/hillslope.js ----
// Hillslopes: soil creep and soil/talus avalanching.
//
// CREEP. Soil moves downslope with a flux per unit width
//
//   q = D * S / (1 - (S/Sc)^2) * (1 - exp(-h / h0))
//
// the nonlinear creep law of Roering, Kirchner & Dietrich 1999 (Water Resour. Res. 35)
// with a depth dependence (thin soil creeps less; bare rock not at all). Only soil
// moves, so outflow from a cell is capped at the soil it has. The enhancement factor
// 1/(1-(S/Sc)^2) is capped at `maxNonlinearity`; anything steeper than Sc is handled
// by avalanching instead.
//
// Finite volumes (see mesh.js): the flux across the face shared by cells i and j moves
// volume q * face * dt, with S = dz / dist. On the regular hex grid this is
// D * f * dz * 2 / (3 dx^2) * dt per cell, the standard isotropic hex Laplacian.
// Explicit substeps keep forward Euler stable.
//
// AVALANCHING. Soil steeper than the angle of repose (slope Sc) slides to lower
// neighbours until it is not, conserving volume (a "thermal erosion" relaxation as
// in Musgrave, Kolb & Mace 1989, SIGGRAPH). This is what builds talus slopes under
// cliffs from rockfall debris.

/** Effective critical slope for cell i, raised by vegetation (root cohesion). */
function criticalSlope(sim, i) {
  return sim.params.hillslope.criticalSlope * (1 + sim.params.vegetation.slopeBoost * sim.veg[i]);
}

/**
 * @param {import('../simulation.js').Simulation} sim
 * @param {number} dt years
 * @returns {{substeps:number}}
 */
function creep(sim, dt) {
  const hp = sim.params.hillslope;
  const vp = sim.params.vegetation;
  const { grid: mesh, soil, z, veg } = sim;
  const n = mesh.size;
  const Dg = mesh.degree;
  const nb = mesh.neighbors;
  const { dist, face, area } = mesh;
  const D0 = hp.diffusivity;
  const fmax = Math.max(1, hp.maxNonlinearity);
  const h0 = hp.transportDepth;
  if (!(D0 > 0)) return { substeps: 0 };

  let vmax = 0;
  for (let i = 0; i < n; i++) if (veg[i] > vmax) vmax = veg[i];
  const Dmax = D0 * (1 + vp.diffusivityBoost * vmax) * fmax;
  // Forward Euler is stable when dt * sum_j(D face / (dist area_i)) <= 1 for every cell
  // (Gershgorin); keep a safety factor.
  let worst = 0;
  for (let i = 0; i < n; i++) {
    let sum = 0;
    for (let k = 0; k < Dg; k++) { const e = Dg * i + k; if (nb[e] >= 0) sum += face[e] / dist[e]; }
    worst = Math.max(worst, sum / area[i]);
  }
  const dtStable = 0.75 / (Dmax * worst);
  const substeps = Math.max(1, Math.ceil(dt / dtStable));
  const h = dt / substeps;

  const flux = sim.scratch.edgeFlux; // volume moved per edge per substep, indexed like neighbors
  const outTotal = sim.scratch.outTotal;
  for (let sub = 0; sub < substeps; sub++) {
    outTotal.fill(0);
    for (let i = 0; i < n; i++) {
      for (let k = 0; k < Dg; k++) {
        const e = Dg * i + k;
        const j = nb[e];
        flux[e] = 0;
        if (j <= i) continue; // each edge once, from its lower-numbered cell
        const dz = z[i] - z[j];
        const up = dz > 0 ? i : j;
        const S = Math.abs(dz) / dist[e];
        const r = S / criticalSlope(sim, up);
        const f = r < 1 ? Math.min(fmax, 1 / (1 - r * r)) : fmax;
        const D = D0 * (1 + vp.diffusivityBoost * veg[up]);
        const depth = 1 - Math.exp(-soil[up] / h0);
        const q = D * f * depth * (dz / dist[e]) * face[e] * h; // volume moved i -> j (negative: j -> i)
        flux[e] = q;
        outTotal[up] += Math.abs(q);
      }
    }
    // scale factor so no cell exports more soil than it has
    for (let i = 0; i < n; i++) {
      const have = soil[i] * area[i];
      outTotal[i] = outTotal[i] > have ? have / outTotal[i] : 1;
    }
    for (let i = 0; i < n; i++) {
      for (let k = 0; k < Dg; k++) {
        const e = Dg * i + k;
        const q0 = flux[e];
        if (q0 === 0) continue;
        const j = nb[e];
        const q = q0 > 0 ? q0 * outTotal[i] : q0 * outTotal[j];
        soil[i] -= q / area[i];
        z[i] -= q / area[i];
        soil[j] += q / area[j];
        z[j] += q / area[j];
      }
    }
    for (let i = 0; i < n; i++) if (soil[i] < 0) { z[i] -= soil[i]; soil[i] = 0; } // round-off only
  }
  return { substeps };
}

/**
 * Relax soil slopes steeper than the critical slope.
 * The first sweep visits every cell; later sweeps only revisit cells next to
 * where something moved (a worklist), alternating direction to avoid bias.
 * @returns {number} total volume moved (m^3)
 */
function avalanche(sim) {
  const { grid: mesh, soil, z, boundaryOutlet } = sim;
  const n = mesh.size;
  const Dg = mesh.degree;
  const nb = mesh.neighbors;
  const { dist, area } = mesh;
  const maxIter = sim.params.hillslope.avalancheIterations;
  const ws = sim.scratch.avalanche || (sim.scratch.avalanche = {
    list: new Int32Array(n), next: new Int32Array(n), mark: new Uint32Array(n), stamp: 0,
    excess: new Float64Array(Dg),
  });
  const excess = ws.excess;
  let list = ws.list;
  let next = ws.next;
  let count = n;
  for (let i = 0; i < n; i++) list[i] = i;
  let moved = 0;
  for (let it = 0; it < maxIter && count > 0; it++) {
    const stamp = ++ws.stamp;
    let nextCount = 0;
    const forward = (it & 1) === 0;
    for (let s = 0; s < count; s++) {
      const i = list[forward ? s : count - 1 - s];
      if (soil[i] <= 0 || boundaryOutlet[i]) continue;
      const Sc = criticalSlope(sim, i);
      let sum = 0;
      let emax = 0;
      let kmax = -1;
      for (let k = 0; k < Dg; k++) {
        const e = Dg * i + k;
        const j = nb[e];
        let ex = 0;
        if (j >= 0) {
          ex = z[i] - z[j] - Sc * dist[e];
          if (ex < 0) ex = 0;
        }
        excess[k] = ex;
        sum += ex;
        if (ex > emax) { emax = ex; kmax = k; }
      }
      if (emax <= 1e-6) continue;
      // Move the volume that would level the steepest pair's excess halfway (half the
      // excess for equal areas), shared among all over-steep neighbours by excess.
      const jm = nb[Dg * i + kmax];
      const want = (emax * area[i] * area[jm]) / (area[i] + area[jm]);
      const M = Math.min(soil[i] * area[i], want); // volume
      for (let k = 0; k < Dg; k++) {
        if (excess[k] === 0) continue;
        const j = nb[Dg * i + k];
        const dv = (M * excess[k]) / sum;
        soil[j] += dv / area[j];
        z[j] += dv / area[j];
      }
      if (M === soil[i] * area[i]) { z[i] -= soil[i]; soil[i] = 0; } // exact, no round-off sliver
      else { soil[i] -= M / area[i]; z[i] -= M / area[i]; }
      moved += M;
      // i and its neighbours may now be unstable
      if (ws.mark[i] !== stamp) { ws.mark[i] = stamp; next[nextCount++] = i; }
      for (let k = 0; k < Dg; k++) {
        const j = nb[Dg * i + k];
        if (j >= 0 && ws.mark[j] !== stamp) { ws.mark[j] = stamp; next[nextCount++] = j; }
      }
    }
    [list, next] = [next, list];
    count = nextCount;
  }
  return moved;
}

// ---- src/processes/rockfall.js ----
// Rockfall and cliff collapse, using the Culmann slope-stability criterion.
//
// A planar rock face of slope angle beta, made of material with cohesion C,
// friction angle phi and unit weight rho*g, can stand to a maximum height
//
//   Hc = (4 C / (rho g)) * sin(beta) cos(phi) / (1 - cos(beta - phi))
//
// and fails along a plane at angle (beta + phi) / 2. (Culmann 1866; used in
// landscape evolution models by Densmore, Ellis & Anderson 1998, JGR 103.) Hc grows
// without bound as beta -> phi, so faces no steeper than phi never fail, and
// strong rock (high C) supports tall vertical cliffs while weak rock does not.
//
// On the grid, each cell is compared with its steepest-down neighbour. The drop
// between them is the face height and atan(drop / distance) its angle. The face strength is the
// thickness-weighted mean over the layers it cuts, so a soft layer at the foot of
// a cliff weakens it -- undercutting, the engine of escarpment retreat.
//
// An unstable face fails stochastically with rate (1/timescale)(1 + frostFactor*frost),
// i.e. probability 1 - exp(-rate dt) per step. The failed wedge is removed down to
// the failure plane (but never more than half the drop, so the two cells cannot
// swap order) and dumped as loose debris (soil) on the lower cell, where the
// avalanche step spreads it into a talus slope.
//
// Grid-scale caveat: cliffs lower than about dx * tan(phi) cannot be represented as
// unstable faces, so rockfall only "switches on" when dx is small compared with the
// cliff heights the rock can sustain.

const G_ACCEL = 9.81;

/** Culmann critical height (m) for a face at angle beta (rad). Infinity if beta <= phi. */
function culmannHeight(beta, cohesion, phi, density) {
  if (beta <= phi) return Infinity;
  return ((4 * cohesion) / (density * G_ACCEL)) * (Math.sin(beta) * Math.cos(phi)) / (1 - Math.cos(beta - phi));
}

/**
 * @param {import('../simulation.js').Simulation} sim
 * @param {number} dt years
 * @returns {{events:number, volume:number}}
 */
function rockfall(sim, dt) {
  const rp = sim.params.rockfall;
  const { grid, lith, rock, soil, z, boundaryOutlet, upliftCum, rng, rockfallActivity } = sim;
  const n = grid.size;
  const Dg = grid.degree;
  const nb = grid.neighbors;
  const { dist, area } = grid;
  const rate = (1 / rp.timescale) * (1 + rp.frostFactor * sim.params.climate.frost);
  const pFail = 1 - Math.exp(-rate * dt);
  let events = 0;
  let volume = 0;

  const forward = (sim.stepCount & 1) === 0;
  for (let s = 0; s < n; s++) {
    const i = forward ? s : n - 1 - s;
    if (boundaryOutlet[i]) continue;
    // the steepest face: largest drop / distance to a neighbour
    let j = -1;
    let L = 0;
    let best = 0;
    for (let k = 0; k < Dg; k++) {
      const e = Dg * i + k;
      const c = nb[e];
      if (c < 0) continue;
      const S = (z[i] - z[c]) / dist[e];
      if (S > best) { best = S; j = c; L = dist[e]; }
    }
    if (j < 0) continue;
    const zj = z[j];
    const drop = z[i] - zj;
    // only the rock part of the face carries load; the soil cap is just weight
    const rockFace = rock[i] - zj;
    if (rockFace <= 0) continue;
    const beta = Math.atan(drop / L);
    const { cohesion, phi } = lith.meanStrength(i, zj - upliftCum[i], rock[i] - upliftCum[i]);
    if (drop <= culmannHeight(beta, cohesion, phi, rp.rockDensity)) continue;
    if (rng.next() >= pFail) continue;

    const stableDrop = L * Math.tan(0.5 * (beta + phi));
    // never so much that the lower cell ends up higher (half the drop for equal areas)
    const remove = Math.min(drop - stableDrop, (drop * area[j]) / (area[i] + area[j]));
    if (remove <= 0) continue;
    const fromSoil = Math.min(soil[i], remove);
    soil[i] -= fromSoil;
    rock[i] -= remove - fromSoil;
    z[i] -= remove;
    const v = remove * area[i];
    soil[j] += v / area[j];
    z[j] += v / area[j];
    events++;
    volume += v;
    rockfallActivity[i] += remove;
  }
  return { events, volume };
}

// ---- src/processes/coast.js ----
// Coasts: wave exposure, sea-cliff retreat, shore-platform lowering, and the
// reworking of sediment near the shore.
//
// SEA LEVEL may vary in time (seaLevelAt). Every cell below it is sea.
//
// WAVE EXPOSURE. For each cell near the shore we follow a ray towards each direction
// waves come from (the wave climate) across the sea until it hits land or leaves the
// grid. Rays run along the six lattice directions (see waveExposure). Along each ray:
//   generation   = 1 - exp(-fetch / fetchScale)       waves grow with open water upwind
//   dissipation  = exp(-shallowLength / dissipationLength)
// where shallowLength is how far the ray runs over water shallower than the breaking
// depth (waveHeight / 0.78). Exposure is the weighted mean of generation x dissipation
// over the wave climate, between 0 (sheltered) and 1 (fully exposed). Dissipation is
// the feedback that limits platform width: a wide shallow platform breaks the waves
// before they reach the cliff (Trenhaile 2000, Marine Geology 166; Anderson, Densmore &
// Ellis 1999, Basin Research 11). [adapted: a cheap stand-in for wave refraction and
// shoaling, which this does not model]
//
// CLIFF RETREAT. Any land cell with sea beside it is attacked from the side: a sea
// cliff, or on a gentle coast a low shore that will become one. Waves cut a notch at
// its foot; the notch deepens horizontally at
//   R = waveErodibility(rock at sea level) x weakness x exposure x exp(-soil / beachShielding)   (m/yr)
// (the beach-shielding exponential follows the SCAPE model, Walkden & Hall 2005,
// Coastal Engineering 52). When the notch reaches dx the cell has been eaten
// through: the column collapses to low-tide level. A cliff can retreat at most one
// cell per step, so keep dt < dx / (fastest retreat rate). A fraction `debrisRetained`
// of the collapsed volume stays as loose debris on the cell; the rest (fines carried
// off in suspension) leaves the domain. The debris shields the next cliff until the
// sea clears it. [adapted: notch-and-collapse is our grid version of lateral retreat]
//
// PLATFORM LOWERING. Submerged cells lower vertically at
//   platformRatio x R x f(depth),  f = 1 within the tidal range, decaying as
//   exp(-(depth - tide/2) / (depthScale x waveHeight)) below it
// (depth-decay of wave erosion: Sunamura 1992, "Geomorphology of Rocky Coasts";
// Anderson et al. 1999). Eroded rock becomes soil in the same proportion as above.
//
// ATTRITION. Shore sediment is ground down to fines and carried away at
//   attrition x exposure x f(depth)   (m/yr; f = 1 in the swash and tidal zone)
// so debris from cliff falls is cleared in time and beaches survive mainly where
// waves are weak or supply is high. [heuristic]
//
// SHORE SEDIMENT. Soil near the shore diffuses with diffusivity
//   D = marineDiffusivity x exposure x exp(-depth / closureDepth)
// down to well below the closure depth and up to the run-up limit above sea level,
// which builds beaches, shorefaces and delta fronts and parks sand in sheltered bays.
// (Depth-decaying marine diffusion as in basin models, e.g. Yuan et al. 2019.) Explicit
// substeps are capped; if the cap binds, D is reduced to the stable value and the
// step reports it.

const BREAK_RATIO = 0.78; // breaking wave height / water depth

/** Sea level (m) at time t (yr), or null when there is no sea. */
function seaLevelAt(params, t) {
  const base = params.boundary.seaLevel;
  if (base == null) return null;
  const c = params.coast;
  if (Array.isArray(c.seaLevelCurve) && c.seaLevelCurve.length) {
    const pts = c.seaLevelCurve;
    if (t <= pts[0][0]) return base + pts[0][1];
    for (let k = 1; k < pts.length; k++) {
      if (t <= pts[k][0]) {
        const [t0, z0] = pts[k - 1];
        const [t1, z1] = pts[k];
        return base + z0 + ((z1 - z0) * (t - t0)) / (t1 - t0);
      }
    }
    return base + pts[pts.length - 1][1];
  }
  if (!c.seaLevelAmplitude) return base;
  return base + c.seaLevelAmplitude * Math.sin((2 * Math.PI * t) / c.seaLevelPeriod + ((c.seaLevelPhase || 0) * Math.PI) / 180);
}

/** Lattice direction k points at azimuth 60k degrees (0 = east, 60 = north-east, ...). */
const LATTICE_AZIMUTH = [0, 60, 120, 180, 240, 300];

/**
 * Split a wave climate onto the six lattice directions: each wave direction's weight
 * goes to the two nearest lattice directions, linearly in angle.
 * @returns {Float64Array} six weights summing to 1
 */
function latticeWaveWeights(waves) {
  const w = new Float64Array(6);
  let total = 0;
  for (const { from, weight } of waves) {
    const a = (((from % 360) + 360) % 360) / 60;
    const k0 = Math.floor(a) % 6;
    const f = a - Math.floor(a);
    w[k0] += weight * (1 - f);
    w[(k0 + 1) % 6] += weight * f;
    total += weight;
  }
  if (total > 0) for (let k = 0; k < 6; k++) w[k] /= total;
  return w;
}

/** For each lattice direction, cell indices sorted so a cell comes after its neighbour in that direction. */
function directionOrders(grid) {
  if (grid._dirOrders) return grid._dirOrders;
  const orders = LATTICE_AZIMUTH.map((az) => {
    const ux = Math.cos((az * Math.PI) / 180);
    const uy = -Math.sin((az * Math.PI) / 180);
    const idx = Array.from({ length: grid.size }, (_, i) => i);
    const proj = (i) => grid.x[i] * ux + grid.y[i] * uy;
    idx.sort((a, b) => proj(b) - proj(a)); // furthest along the direction first
    return Int32Array.from(idx);
  });
  grid._dirOrders = orders;
  return orders;
}

/**
 * Wave exposure in [0, 1] for every cell in `cells`, written into `out`.
 *
 * Rays run along the six lattice directions, which land exactly on cell centres, so
 * each ray's fetch and shallow-water length follow from its neighbour's by dynamic
 * programming: one sweep of the grid per direction, O(n), instead of marching rays.
 * The price is 60-degree angular resolution: wave directions in between are shared
 * between the two nearest lattice directions.
 * @param {import('../simulation.js').Simulation} sim
 */
function waveExposure(sim, sea, cells, count, out) {
  const cp = sim.params.coast;
  const { grid, z } = sim;
  const n = grid.size;
  const nb = grid.neighbors;
  const dx = grid.dx;
  const breakDepth = cp.waveHeight / BREAK_RATIO;
  // Refraction and diffraction bend waves round headlands and towards the shore, so a
  // share of the energy attacks from every direction. [heuristic]
  const W = latticeWaveWeights(cp.waves);
  const r = Math.min(1, Math.max(0, cp.refraction ?? 0));
  for (let k = 0; k < 6; k++) W[k] = (1 - r) * W[k] + r / 6;
  const orders = directionOrders(grid);
  const ws = sim.scratch.waves || (sim.scratch.waves = { fetch: new Float64Array(n), shallow: new Float64Array(n) });
  const { fetch, shallow } = ws;
  for (let c = 0; c < count; c++) out[cells[c]] = 0;
  for (let k = 0; k < 6; k++) {
    if (W[k] === 0) continue;
    const order = orders[k];
    for (let s = 0; s < n; s++) {
      const i = order[s];
      const j = nb[6 * i + k];
      if (j < 0) { fetch[i] = Infinity; shallow[i] = 0; continue; } // open sea beyond the grid
      const depth = sea - z[j];
      if (depth <= 0) { fetch[i] = dx; shallow[i] = 0; continue; } // land upwind
      fetch[i] = dx + fetch[j];
      shallow[i] = shallow[j] + (depth < breakDepth ? dx : 0);
    }
    for (let c = 0; c < count; c++) {
      const i = cells[c];
      const own = sea - z[i];
      const sh = shallow[i] + (own > 0 && own < breakDepth ? dx / 2 : 0);
      const gen = fetch[i] === Infinity ? 1 : 1 - Math.exp(-fetch[i] / cp.fetchScale);
      out[i] += W[k] * gen * Math.exp(-sh / cp.dissipationLength);
    }
  }
}

/**
 * @param {import('../simulation.js').Simulation} sim
 * @param {number} dt years
 * @returns {{exported:number, collapses:number, cliffRetreat:number, substeps:number, diffusivityCapped:boolean}}
 */
function coast(sim, dt) {
  const cp = sim.params.coast;
  const sea = sim.seaLevel;
  const { grid, lith, rock, soil, z, boundaryOutlet, upliftCum } = sim;
  const n = grid.size;
  const nb = grid.neighbors;
  const dx = grid.dx;
  const ac = grid.cellArea;
  const exposure = sim.waveExposureField;
  exposure.fill(0);
  const result = { exported: 0, collapses: 0, cliffRetreat: 0, substeps: 0, diffusivityCapped: false };
  if (sea == null) return result;
  // The exposure sweep follows lattice directions, and cliff retreat is measured in
  // lattice spacings, so this process needs the regular hex lattice (see mesh.js).
  if (!grid.lattice) throw new Error('the coast process needs a hexagonal-lattice mesh (mesh.lattice); disable coast.enabled on other meshes');

  const H = cp.waveHeight;
  const halfTide = cp.tidalRange / 2;
  const runup = halfTide + H; // top of the swash zone above mean sea level
  const activeDepth = 3 * cp.closureDepth;
  const keep = cp.debrisRetained;

  // --- the coastal band: shallow sea, and land touching the sea ---
  const band = sim.scratch.coastBand || (sim.scratch.coastBand = new Int32Array(n));
  let count = 0;
  for (let i = 0; i < n; i++) {
    const depth = sea - z[i];
    if (depth > 0) {
      if (depth < activeDepth) band[count++] = i;
      continue;
    }
    for (let k = 0; k < 6; k++) {
      const j = nb[6 * i + k];
      if (j >= 0 && z[j] < sea) { band[count++] = i; break; }
    }
  }
  waveExposure(sim, sea, band, count, exposure);

  // --- cliff notching and platform lowering ---
  const notch = sim.notch;
  for (let c = 0; c < count; c++) {
    const i = band[c];
    if (boundaryOutlet[i]) continue;
    const ex = exposure[i];
    if (ex <= 0) continue;
    if (z[i] >= sea) {
      // land touching the sea (a sea cliff, or a low shore): waves cut a notch at its foot
      const k = lith.waveErodibility[lith.rockAt(i, sea - upliftCum[i])] * lith.weakness[i];
      const R = k * ex * Math.exp(-soil[i] / cp.beachShielding);
      notch[i] += R * dt;
      result.cliffRetreat += R * dt;
      if (notch[i] >= dx) {
        const newRock = Math.min(rock[i], sea - halfTide);
        const removed = rock[i] - newRock;
        rock[i] = newRock;
        soil[i] += keep * removed;
        result.exported += (1 - keep) * removed * ac;
        // carry the remainder (at most one more cell's worth): retreat is limited to one
        // cell per step, so keep dt below dx / (fastest retreat rate)
        notch[i] = Math.min(notch[i] - dx, dx);
        result.collapses++;
      }
    } else {
      // submerged platform or shoreface: vertical lowering of the rock beneath any soil
      const depth = sea - rock[i];
      const f = depth <= halfTide ? 1 : Math.exp(-(depth - halfTide) / (cp.depthScale * H));
      const k = lith.waveErodibility[sim.surfaceRock[i]] * lith.weakness[i];
      const lower = cp.platformRatio * k * ex * f * Math.exp(-soil[i] / cp.beachShielding) * dt;
      rock[i] -= lower;
      soil[i] += keep * lower;
      result.exported += (1 - keep) * lower * ac;
      notch[i] = 0;
    }
    // attrition: waves grind shore sediment to fines, fastest in the swash zone
    if (soil[i] > 0 && cp.attrition > 0) {
      const d = sea - z[i];
      const g = d < -runup ? 0 : d <= halfTide ? 1 : Math.exp(-(d - halfTide) / (cp.depthScale * H));
      const loss = Math.min(soil[i], cp.attrition * ex * g * dt);
      soil[i] -= loss;
      result.exported += loss * ac;
    }
    z[i] = rock[i] + soil[i];
  }

  // --- shore sediment diffusion (soil only), explicit substeps on the band ---
  const D0 = cp.marineDiffusivity;
  if (D0 > 0 && count > 0) {
    const maxSub = cp.maxSubsteps;
    const dtStable = (0.5 * dx * dx) / (3 * D0); // exposure and depth factors are <= 1
    let substeps = Math.ceil(dt / dtStable);
    let Dscale = 1;
    if (substeps > maxSub) {
      Dscale = (maxSub * dtStable) / dt;
      substeps = maxSub;
      result.diffusivityCapped = true;
    }
    result.substeps = substeps;
    const h = dt / substeps;
    const coef = ((2 / 3) * h * D0 * Dscale) / (dx * dx);
    const inBand = sim.scratch.inBand || (sim.scratch.inBand = new Uint8Array(n));
    for (let c = 0; c < count; c++) inBand[band[c]] = 1;
    // Edge list with conductances, fixed for the step (they change slowly with z).
    const es = sim.scratch.coastEdges || (sim.scratch.coastEdges = {
      a: new Int32Array(6 * n), b: new Int32Array(6 * n), g: new Float64Array(6 * n),
    });
    let ne = 0;
    for (let c = 0; c < count; c++) {
      const i = band[c];
      for (let k = 0; k < 6; k++) {
        const j = nb[6 * i + k];
        if (j < 0 || (inBand[j] && j < i)) continue; // each edge once
        const d = sea - Math.max(z[i], z[j]); // depth over the shallower of the pair
        if (d < -runup) continue;
        const g = coef * 0.5 * (exposure[i] + exposure[j]) * Math.exp(-Math.max(d, 0) / cp.closureDepth);
        if (g <= 0) continue;
        es.a[ne] = i; es.b[ne] = j; es.g[ne] = g; ne++;
      }
    }
    const flux = sim.scratch.coastFlux || (sim.scratch.coastFlux = new Float64Array(6 * n));
    const outTotal = sim.scratch.outTotal;
    const { a: ea, b: eb, g: eg } = es;
    for (let sub = 0; sub < substeps; sub++) {
      for (let e = 0; e < ne; e++) { outTotal[ea[e]] = 0; outTotal[eb[e]] = 0; }
      for (let e = 0; e < ne; e++) {
        const i = ea[e], j = eb[e];
        const q = eg[e] * (z[i] - z[j]); // positive: i -> j
        const up = q > 0 ? i : j;
        // only band cells give sediment, and only if they have some
        if (!inBand[up] || soil[up] <= 0) { flux[e] = 0; continue; }
        flux[e] = q;
        outTotal[up] += Math.abs(q);
      }
      // apply with the soil limit: no cell gives more than it has
      for (let e = 0; e < ne; e++) {
        const q0 = flux[e];
        if (q0 === 0) continue;
        const i = ea[e], j = eb[e];
        const up = q0 > 0 ? i : j;
        const q = outTotal[up] > soil[up] ? (q0 * soil[up]) / outTotal[up] : q0;
        soil[i] -= q; z[i] -= q;
        soil[j] += q; z[j] += q;
      }
      for (let c = 0; c < count; c++) {
        const i = band[c];
        if (soil[i] < 0) { z[i] -= soil[i]; soil[i] = 0; } // round-off only
      }
    }
    for (let c = 0; c < count; c++) inBand[band[c]] = 0;
  }
  return result;
}

// ---- src/mesh.js ----
// The mesh contract: what the processes are allowed to know about the grid.
//
// Every process is written in finite-volume form against this interface, so a
// mesh does not have to be hexagonal, regular or flat. A mesh provides:
//
//   size            number of cells
//   degree          stride of the neighbour arrays (the maximum number of neighbours)
//   neighbors       Int32Array(degree * size); slot k of cell i is neighbors[degree*i + k],
//                   or -1 if unused (slots may be empty anywhere, not only at the end)
//   dist            Float64Array(degree * size): distance between the two cell centres (m)
//   face            Float64Array(degree * size): length of the face the two cells share (m)
//   area            Float64Array(size): cell area (m^2)
//   x, y            Float64Array(size): cell centres in world coordinates (m)
//   edge            Uint8Array(size): which domain sides a cell lies on
//                   (1 west, 2 east, 4 north, 8 south; 0 for interior cells)
//   bounds          { xmin, ymin, xmax, ymax } of the domain (m)
//
// Optional capabilities:
//   cellAt(x, y)    cell containing a point, or -1 (needed for drawing and zooming)
//   lattice         true if slot k always points along azimuth 60k degrees, with
//                   equal spacing (the hexagonal lattice); the wave-exposure sweep needs it
//
// The finite-volume rule every diffusive process uses: a flux q (m^2/yr, per unit face
// length) across the face between i and j moves volume q * face * dt, which changes
// the heights by -q*face*dt/area[i] and +q*face*dt/area[j]. For a gradient flux
// q = D (z_i - z_j)/dist this is the standard two-point flux approximation; on the
// regular hex grid it reduces to the isotropic hex Laplacian.



/** Throw if a mesh breaks the contract (sizes, symmetry, positivity). */
function checkMesh(m) {
  const fail = (msg) => { throw new Error(`invalid mesh: ${msg}`); };
  const { size: n, degree: D } = m;
  if (!(n > 0 && D > 0)) fail('size and degree must be positive');
  for (const [k, len] of [['neighbors', D * n], ['dist', D * n], ['face', D * n], ['area', n], ['x', n], ['y', n], ['edge', n]]) {
    if (!m[k] || m[k].length !== len) fail(`${k} must have length ${len}`);
  }
  for (let i = 0; i < n; i++) {
    if (!(m.area[i] > 0)) fail(`cell ${i} has non-positive area`);
    for (let k = 0; k < D; k++) {
      const j = m.neighbors[D * i + k];
      if (j < 0) continue;
      if (j >= n || j === i) fail(`cell ${i} slot ${k} points at ${j}`);
      if (!(m.dist[D * i + k] > 0 && m.face[D * i + k] > 0)) fail(`edge ${i}-${j} has non-positive dist or face`);
      let back = -1;
      for (let q = 0; q < D; q++) if (m.neighbors[D * j + q] === i) back = D * j + q;
      if (back < 0) fail(`edge ${i}->${j} has no reverse edge`);
      if (Math.abs(m.dist[back] - m.dist[D * i + k]) > 1e-9 * m.dist[back] ||
          Math.abs(m.face[back] - m.face[D * i + k]) > 1e-9 * m.face[back]) fail(`edge ${i}-${j} is not symmetric`);
    }
  }
  return true;
}

/**
 * A mesh given directly as arrays. `GraphMesh.irregular(hex, ...)` derives a
 * deliberately messy one from a hex grid for testing: jittered centres, missing
 * edges (so neighbour counts vary from 2 to 6, with gaps between slots), and
 * randomly perturbed face widths and areas. It satisfies the contract but is NOT
 * a geometrically consistent Voronoi tessellation, so it checks that processes
 * conserve mass and route water on any mesh, not that they converge to the PDE.
 */
class GraphMesh {
  constructor({ size, degree, neighbors, dist, face, area, x, y, edge, bounds, cellAt }) {
    Object.assign(this, { size, degree, neighbors, dist, face, area, x, y, edge, bounds });
    if (cellAt) this.cellAt = cellAt;
    this.lattice = false;
    checkMesh(this);
  }

  static irregular(hex, { jitter = 0.25, drop = 0.15, perturb = 0.3, seed = 1 } = {}) {
    const rng = new Rng(seed);
    const n = hex.size;
    const D = hex.degree;
    const x = Float64Array.from(hex.x, (v) => v + jitter * hex.dx * (rng.next() - 0.5));
    const y = Float64Array.from(hex.y, (v) => v + jitter * hex.dx * (rng.next() - 0.5));
    const neighbors = Int32Array.from(hex.neighbors);
    const degreeOf = (i) => { let c = 0; for (let k = 0; k < D; k++) if (neighbors[D * i + k] >= 0) c++; return c; };
    const slot = (i, j) => { for (let k = 0; k < D; k++) if (neighbors[D * i + k] === j) return D * i + k; return -1; };
    // drop interior edges, keeping every cell at two or more neighbours
    for (let i = 0; i < n; i++) {
      for (let k = 0; k < D; k++) {
        const j = neighbors[D * i + k];
        if (j <= i || rng.next() >= drop) continue;
        if (degreeOf(i) <= 2 || degreeOf(j) <= 2) continue;
        neighbors[D * i + k] = -1;
        neighbors[slot(j, i)] = -1;
      }
    }
    // restore edges until every cell is connected to cell 0
    for (;;) {
      const seen = new Uint8Array(n);
      const stack = [0];
      seen[0] = 1;
      while (stack.length) {
        const i = stack.pop();
        for (let k = 0; k < D; k++) { const j = neighbors[D * i + k]; if (j >= 0 && !seen[j]) { seen[j] = 1; stack.push(j); } }
      }
      const lost = seen.indexOf(0);
      if (lost < 0) break;
      // give the unreached cell back its original hex edges (slot k pairs with OPPOSITE[k])
      for (let k = 0; k < D; k++) {
        const j = hex.neighbors[D * lost + k];
        if (j >= 0) { neighbors[D * lost + k] = j; neighbors[D * j + OPPOSITE[k]] = lost; }
      }
    }
    const dist = new Float64Array(D * n);
    const face = new Float64Array(D * n);
    for (let i = 0; i < n; i++) {
      for (let k = 0; k < D; k++) {
        const j = neighbors[D * i + k];
        if (j < i) continue;
        const d = Math.hypot(x[j] - x[i], y[j] - y[i]);
        const f = hex.edgeLength * (1 + perturb * (rng.next() - 0.5));
        const back = slot(j, i);
        dist[D * i + k] = dist[back] = d;
        face[D * i + k] = face[back] = f;
      }
    }
    const area = Float64Array.from(hex.area, (a) => a * (1 + perturb * (rng.next() - 0.5)));
    return new GraphMesh({
      size: n, degree: D, neighbors, dist, face, area, x, y,
