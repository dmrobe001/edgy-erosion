<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edgy Erosion</title>
<style>
:root {
  /* dark-first: dusk over a canyon; light theme below mirrors it */
  --bg: #16171b;
  --panel: #1f2026;
  --line: #33353d;
  --text: #e4e2dc;
  --muted: #9a978f;
  --accent: #d38a4f;
  --on-accent: #1a1208;
  --error: #ff8a7a;
  --canvas-bg: #000000;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f1ec; --panel: #e9e5dc; --line: #cfc8ba; --text: #25221d; --muted: #6b655a;
    --accent: #b0642a; --on-accent: #fffaf3; --error: #b3261e; --canvas-bg: #d9d4c8; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f1ec; --panel: #e9e5dc; --line: #cfc8ba; --text: #25221d; --muted: #6b655a;
  --accent: #b0642a; --on-accent: #fffaf3; --error: #b3261e; --canvas-bg: #d9d4c8; color-scheme: light;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
  background: var(--bg);
  color: var(--text);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
}

header {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.25rem 1rem;
  padding: 0.6rem 1rem;
  border-bottom: 1px solid var(--line);
}
h1 { font-size: 1.15rem; margin: 0; letter-spacing: 0.02em; }
h2 { font-size: 0.85rem; margin: 0 0 0.4rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.sub, .note { color: var(--muted); font-size: 0.85em; }
.error { color: var(--error); white-space: pre-wrap; font-size: 0.85em; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

main {
  display: grid;
  grid-template-columns: minmax(260px, 320px) 1fr;
  min-height: calc(100vh - 3rem);
}

#controls {
  border-right: 1px solid var(--line);
  background: var(--panel);
  padding: 0.5rem 1rem 2rem;
  overflow-y: auto;
  max-height: calc(100vh - 3rem);
}
#controls section { padding: 0.6rem 0; border-bottom: 1px solid var(--line); }
#controls section:last-child { border-bottom: none; }

label { display: block; color: var(--muted); font-size: 0.85em; }
label.row { display: flex; flex-direction: column; gap: 0.2rem; }
input, select, textarea, button {
  font: inherit;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0.3rem 0.4rem;
}
input[type=number] { width: 100%; }
input[type=range] { width: 100%; padding: 0; accent-color: var(--accent); }
textarea { width: 100%; height: 18rem; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
button { cursor: pointer; padding: 0.35rem 0.8rem; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.buttons { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.4rem; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; margin-bottom: 0.4rem; align-items: end; }

.slider { margin: 0.35rem 0; }
.slider .head { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.85em; }
.slider .val { color: var(--text); font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.check { display: flex; align-items: center; gap: 0.4rem; margin: 0.3rem 0; }

#viewer { padding: 0.5rem 1rem 1rem; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.5rem; margin: 0.3rem 0; }
.toolbar label { display: flex; align-items: center; gap: 0.4rem; }
#map-wrap { width: 100%; }
canvas { display: block; width: 100%; image-rendering: pixelated; background: var(--canvas-bg); border-radius: 4px; }
#map { cursor: crosshair; }
#hover { min-height: 1.4em; color: var(--muted); margin: 0.2rem 0 0.6rem; }
#legend { display: flex; flex-wrap: wrap; gap: 0.3rem 0.9rem; margin-top: 0.5rem; font-size: 0.85em; color: var(--muted); }
#legend span::before { content: ""; display: inline-block; width: 0.8em; height: 0.8em; margin-right: 0.35em; vertical-align: -0.05em; border-radius: 2px; background: var(--c); }

@media (max-width: 760px) {
  main { grid-template-columns: 1fr; }
  #viewer { order: -1; }
  #controls { max-height: none; border-right: none; border-bottom: 1px solid var(--line); }
  #viewer { padding: 0.5rem 16px 1rem; }
  #controls { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
  <header>
    <h1>Edgy Erosion</h1>
    <span class="sub">landscape evolution on a hexagonal grid: rivers, soil, layered rock, cliffs and rockfall</span>
  </header>
  <main>
    <aside id="controls">
      <section>
        <label class="row">Preset
          <select id="preset"></select>
        </label>
        <p id="preset-desc" class="note"></p>
        <div class="buttons">
          <button id="run" class="primary">Run</button>
          <button id="step">Step</button>
          <button id="reset">Reset</button>
        </div>
      </section>

      <section>
        <h2>Grid <span class="note">(applies on Reset)</span></h2>
        <div class="grid3">
          <label>cols<input id="cols" type="number" min="8" max="1024" step="1"></label>
          <label>rows<input id="rows" type="number" min="8" max="1024" step="1"></label>
          <label>dx (m)<input id="dx" type="number" min="0.1" step="any"></label>
        </div>
        <div class="grid3">
          <label>seed<input id="seed" type="number" step="1"></label>
          <label>dt (yr)<input id="dt" type="number" min="1" step="any"></label>
          <span id="extent" class="note"></span>
        </div>
      </section>

      <section id="sliders"></section>

      <section>
        <details>
          <summary>All parameters (JSON)</summary>
          <p class="note">The complete, reproducible parameter set. Edit and press Apply to restart with it.</p>
          <textarea id="json" spellcheck="false"></textarea>
          <div class="buttons">
            <button id="json-apply">Apply &amp; reset</button>
            <button id="json-refresh">Refresh</button>
          </div>
          <p id="json-error" class="error"></p>
        </details>
      </section>

      <section>
        <h2>Export</h2>
        <div class="buttons">
          <button id="copy-params">Copy parameters</button>
          <button id="save-png" data-download>View as PNG</button>
          <button id="save-snapshot" data-download>Snapshot JSON</button>
        </div>
        <p id="copy-status" class="note"></p>
        <label class="row">Load snapshot / params
          <input id="load" type="file" accept=".json,application/json">
        </label>
      </section>
    </aside>

    <section id="viewer">
      <div class="toolbar">
        <label>View <select id="view"></select></label>
        <span id="stats" class="mono"></span>
      </div>
      <div id="map-wrap"><canvas id="map"></canvas></div>
      <div id="hover" class="mono">&nbsp;</div>
      <div class="toolbar"><span>Cross-section <span class="note">(click the map to choose a row)</span></span><span id="section-info" class="mono"></span></div>
      <canvas id="section"></canvas>
      <div id="legend"></div>
    </section>
  </main>

<script type="module">
// ---- src/rng.js ----
// Seeded pseudo-random numbers and smooth noise.
//
// Everything stochastic in the simulation draws from these, so a run is fully
// determined by its parameters (including `seed`). Math.random is never used.

/**
 * Mulberry32: a tiny 32-bit generator. Not cryptographic; plenty for terrain.
 * The whole state is one uint32, so it can be saved in a snapshot and resumed.
 */
class Rng {
  constructor(seed = 1) {
    this.state = (seed >>> 0) || 0x9e3779b9;
  }

  /** Uniform float in [0, 1). */
  next() {
    let t = (this.state = (this.state + 0x6d2b79f5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  /** Uniform float in [lo, hi). */
  uniform(lo, hi) {
    return lo + (hi - lo) * this.next();
  }
}

/** Integer hash of a lattice point and a seed, returning a float in [-1, 1]. */
function hash2(ix, iy, seed) {
  let h = Math.imul(ix, 0x27d4eb2d) ^ Math.imul(iy, 0x165667b1) ^ Math.imul(seed, 0x9e3779b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  h ^= h >>> 16;
  return (h >>> 0) / 2147483647.5 - 1;
}

const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);

/** Value noise on the unit square lattice, smooth (C2) interpolation, range ~[-1, 1]. */
function valueNoise(x, y, seed) {
  const x0 = Math.floor(x);
  const y0 = Math.floor(y);
  const u = fade(x - x0);
  const v = fade(y - y0);
  const a = hash2(x0, y0, seed);
  const b = hash2(x0 + 1, y0, seed);
  const c = hash2(x0, y0 + 1, seed);
  const d = hash2(x0 + 1, y0 + 1, seed);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

/**
 * Fractal (fractional Brownian motion) noise: a sum of octaves of value noise,
 * each with half the wavelength and `gain` times the amplitude of the last.
 * Normalised so the result stays roughly in [-1, 1].
 *
 * @param {number} x world coordinate (m)
 * @param {number} y world coordinate (m)
 * @param {{wavelength:number, octaves?:number, gain?:number, seed?:number}} o
 */
function fbm(x, y, { wavelength, octaves = 4, gain = 0.5, seed = 0 }) {
  let sum = 0;
  let amp = 1;
  let norm = 0;
  let f = 1 / wavelength;
  for (let k = 0; k < octaves; k++) {
    sum += amp * valueNoise(x * f, y * f, seed + 1013 * k);
    norm += amp;
    amp *= gain;
    f *= 2;
  }
  return sum / norm;
}

// ---- src/hexgrid.js ----
// Hexagonal lattice geometry.
//
// Layout: "pointy-top" hexagons stored in rows, with odd rows shifted right by
// half a cell ("odd-r" offset coordinates). Cell index i = row * cols + col.
//
//   row 0:   0   1   2   3
//   row 1:     4   5   6   7
//   row 2:   8   9  10  11
//
// Every cell centre is exactly `dx` from each of its six neighbours, so the
// cell centres form a triangular lattice and the cells are its Voronoi
// (hexagonal) tiles:
//
//   centre of (col, row):  x = dx * (col + (row & 1) / 2),  y = dx * (sqrt(3)/2) * row
//   hexagon side length (= circumradius):  a = dx / sqrt(3)
//   cell area:                             (sqrt(3) / 2) * dx^2
//
// Internally we also use axial coordinates (q, r) where the six neighbour
// directions are simple constant offsets; see https://www.redblobgames.com/grids/hexagons/

const SQRT3 = Math.sqrt(3);

/** Axial direction vectors, counter-clockwise starting from east. */
const AXIAL_DIRECTIONS = [
  [1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1],
];

/** Index of the opposite direction: OPPOSITE[k] points back along direction k. */
const OPPOSITE = [3, 4, 5, 0, 1, 2];

class HexGrid {
  /**
   * @param {number} cols number of cells per row
   * @param {number} rows number of rows
   * @param {number} dx centre-to-centre lattice spacing (m)
   */
  constructor(cols, rows, dx) {
    if (!(cols >= 3 && rows >= 3)) throw new Error('grid must be at least 3 x 3');
    if (!(dx > 0)) throw new Error('lattice spacing dx must be positive');
    this.cols = cols | 0;
    this.rows = rows | 0;
    this.dx = dx;
    this.size = this.cols * this.rows;
    this.rowSpacing = (SQRT3 / 2) * dx;
    this.cellArea = (SQRT3 / 2) * dx * dx;
    this.edgeLength = dx / SQRT3;
    /** Extent of the cell centres, plus half a cell of padding on each side. */
    this.width = dx * (this.cols + 0.5);
    this.height = this.rowSpacing * (this.rows - 1) + 2 * this.edgeLength;

    const n = this.size;
    this.x = new Float64Array(n);
    this.y = new Float64Array(n);
    /** neighbours[6 * i + k] = index of the neighbour in direction k, or -1 outside the grid. */
    this.neighbors = new Int32Array(6 * n);
    /** Bit flags: 1 = west edge, 2 = east edge, 4 = north (row 0), 8 = south (last row). */
    this.edge = new Uint8Array(n);

    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        const i = r * this.cols + c;
        this.x[i] = dx * (c + 0.5 * (r & 1));
        this.y[i] = this.rowSpacing * r;
        let flags = 0;
        if (c === 0) flags |= 1;
        if (c === this.cols - 1) flags |= 2;
        if (r === 0) flags |= 4;
        if (r === this.rows - 1) flags |= 8;
        this.edge[i] = flags;
        const [q, rr] = offsetToAxial(c, r);
        for (let k = 0; k < 6; k++) {
          const [nc, nr] = axialToOffset(q + AXIAL_DIRECTIONS[k][0], rr + AXIAL_DIRECTIONS[k][1]);
          this.neighbors[6 * i + k] =
            nc >= 0 && nc < this.cols && nr >= 0 && nr < this.rows ? nr * this.cols + nc : -1;
        }
      }
    }
  }

  index(col, row) {
    return row * this.cols + col;
  }

  col(i) {
    return i % this.cols;
  }

  row(i) {
    return (i / this.cols) | 0;
  }

  /**
   * Cell containing the world point (x, y), or -1 if it lies outside the grid.
   * Uses fractional axial coordinates and cube rounding.
   */
  cellAt(x, y) {
    const a = this.edgeLength;
    const qf = ((SQRT3 / 3) * x - y / 3) / a;
    const rf = ((2 / 3) * y) / a;
    // cube rounding: (q, r, s) with q + r + s = 0
    const sf = -qf - rf;
    let q = Math.round(qf);
    let r = Math.round(rf);
    const s = Math.round(sf);
    const dq = Math.abs(q - qf);
    const dr = Math.abs(r - rf);
    const ds = Math.abs(s - sf);
    if (dq > dr && dq > ds) q = -r - s;
    else if (dr > ds) r = -q - s;
    const [c, row] = axialToOffset(q, r);
    if (c < 0 || c >= this.cols || row < 0 || row >= this.rows) return -1;
    return row * this.cols + c;
  }

  /** The six corner points of cell i, for drawing. */
  corners(i) {
    const a = this.edgeLength;
    const out = [];
    for (let k = 0; k < 6; k++) {
      const ang = (Math.PI / 180) * (60 * k - 30);
      out.push([this.x[i] + a * Math.cos(ang), this.y[i] + a * Math.sin(ang)]);
    }
    return out;
  }
}

function offsetToAxial(col, row) {
  return [col - ((row - (row & 1)) >> 1), row];
}

function axialToOffset(q, r) {
  return [q + ((r - (r & 1)) >> 1), r];
}

// ---- src/params.js ----
// Parameters: defaults, presets, and merging.
//
// Units throughout: metres (m), years (yr), pascals (Pa), kilograms (kg).
// Parameters are plain JSON so that a run is reproducible from its parameter
// object alone (see Simulation.snapshot()).

/**
 * Rock library. Values are order-of-magnitude, chosen to be plausible at the
 * landscape scale rather than for any particular formation.
 *
 *  erodibility    K in the stream power law  E = K * A^m * S^n  (for m = 0.5, n = 1:
 *                 units yr^-1). Larger = channels cut it faster.
 *  cohesion       rock-MASS cohesion (Pa) in the Culmann cliff-stability criterion.
 *                 Much lower than intact-sample strength because of joints.
 *  frictionAngle  internal friction angle (degrees). Cliffs no steeper than this
 *                 never fail, whatever their height.
 *  weathering     maximum soil (regolith) production rate on bare rock (m/yr).
 *  color          for display only.
 */
const ROCKS = {
  granite:   { color: '#b9a99a', erodibility: 1e-5, cohesion: 1.0e6, frictionAngle: 45, weathering: 5e-5 },
  basalt:    { color: '#5d5a5c', erodibility: 1e-5, cohesion: 8.0e5, frictionAngle: 42, weathering: 6e-5 },
  sandstone: { color: '#c98a5a', erodibility: 2e-5, cohesion: 4.0e5, frictionAngle: 40, weathering: 1e-4 },
  limestone: { color: '#d8d2bd', erodibility: 1.5e-5, cohesion: 5.0e5, frictionAngle: 40, weathering: 8e-5 },
  schist:    { color: '#7f8a86', erodibility: 3e-5, cohesion: 2.0e5, frictionAngle: 35, weathering: 1.5e-4 },
  siltstone: { color: '#a8846a', erodibility: 8e-5, cohesion: 6.0e4, frictionAngle: 31, weathering: 3e-4 },
  shale:     { color: '#8f6f6a', erodibility: 1.5e-4, cohesion: 3.0e4, frictionAngle: 28, weathering: 4e-4 },
};

const DEFAULTS = {
  seed: 1,
  grid: {
    cols: 128,      // cells per row
    rows: 128,      // number of rows
    dx: 30,         // centre-to-centre lattice spacing (m)
  },
  time: {
    dt: 2000,       // years per step
  },
  boundary: {
    // Which grid edges are fixed-elevation outlets (base level). Others are closed (no flux).
    open: ['north', 'south', 'east', 'west'],
    // Cells below this elevation are sea: water and sediment sinks. null = no sea.
    seaLevel: null,
  },
  initial: {
    // 'flat' | 'plateau' | 'dome' | 'ramp' | 'ridge'
    type: 'plateau',
    base: 0,         // elevation of the surroundings (m)
    height: 300,     // relief of the initial landform (m)
    margin: 0.15,    // plateau: fraction of the domain left low around the edge
    edgeWidth: 0.05, // plateau: width of the initial slope, as a fraction of domain width
    edgeNoise: 0,    // plateau: irregularity of the outline, as a fraction of domain width
    noise: { amplitude: 15, wavelength: 1000, octaves: 5, gain: 0.5 },
    soil: 0.5,       // initial soil (regolith) thickness (m)
  },
  uplift: {
    rate: 1e-4,      // rock uplift rate relative to base level (m/yr)
    // 'uniform' | 'dome' | 'tilt' | 'fault'
    pattern: 'uniform',
    // dome: gaussian of this width (fraction of domain width)
    radius: 0.3,
    // fault: line through the domain centre at this angle (degrees from +x); the
    // side to the left of the direction of strike is uplifted. offset shifts the line
    // (fraction of domain width).
    angle: 0,
    offset: 0,
    // tilt: rate goes from 0 at one side to `rate` at the other, along `angle`.
  },
  rocks: ROCKS,
  strata: {
    // Layers from the top of the stratigraphic column downwards.
    layers: [{ rock: 'sandstone', thickness: 1e9 }],
    top: 1000,          // elevation of the top of the column at the domain centre (m)
    repeat: false,      // repeat the layer sequence indefinitely downwards
    basement: 'granite',// rock below the last layer (when not repeating)
    dip: 0,             // dip angle of the layers (degrees)
    dipDirection: 0,    // azimuth the layers descend towards (degrees, 0 = east, 90 = north)
    undulation: { amplitude: 0, wavelength: 2000 }, // gentle folding/irregularity of layer surfaces (m)
    // Random spatial variation of rock strength: erodibility x f, cohesion / f, with
    // ln f a smooth noise field of this amplitude (natural-log units) and wavelength (m).
    strengthVariation: { amplitude: 0.5, wavelength: 300 },
  },
  // Vertical bodies of rock that cut across the strata: volcanic plugs, intrusions, dikes.
  // Positions and sizes are fractions of the domain width/height so presets survive
  // changes of grid size. `top` (optional) is the elevation the body reaches up to.
  // e.g. { shape: 'disc', x: 0.5, y: 0.5, radius: 0.08, rock: 'basalt', top: 250 }
  //      { shape: 'dike', x0: 0.1, y0: 0.2, x1: 0.9, y1: 0.7, width: 0.01, rock: 'basalt' }
  bodies: [],
  climate: {
    precipitation: 1.0,          // mean effective runoff-producing precipitation (m/yr)
    precipitationGradient: 0,    // fractional change from west edge to east edge (e.g. -0.5)
    frost: 0.3,                  // 0..1, freeze-thaw intensity: speeds rockfall and weathering
  },
  vegetation: {
    // 'auto' derives the maximum cover from precipitation; a number 0..1 fixes it.
    cover: 'auto',
    halfSaturation: 0.5,         // precipitation (m/yr) giving 50% cover when 'auto'
    soilDepthScale: 0.3,         // cover falls off on soils thinner than this (m): bare rock is bare
    erodibilityReduction: 2.0,   // soil erodibility multiplied by exp(-this * cover)
    diffusivityBoost: 1.0,       // creep diffusivity multiplied by (1 + this * cover) (bioturbation)
    slopeBoost: 0.3,             // critical soil slope multiplied by (1 + this * cover) (root cohesion)
    productionBoost: 0.5,        // soil production multiplied by (1 + this * cover)
  },
  fluvial: {
    enabled: true,
    m: 0.5,                      // drainage-area exponent
    n: 1.0,                      // slope exponent
    soilErodibility: 4e-4,       // K for loose soil/sediment (same units as rock K)
    soilCoverScale: 0.5,         // soil thickness (m) that shields bedrock from incision (e-folding)
    // 'mfd': drainage area spread over all lower neighbours (smoother hillslopes, no
    // grid-aligned streaks); 'sfd': all to the steepest neighbour (classic D6).
    routing: 'mfd',
    flowExponent: 4,             // MFD: share proportional to drop^this (higher = more channelised)
    // Pick each cell's receiver at random among lower neighbours (weights drop^randomExponent),
    // re-drawn every step. Breaks up channels that would otherwise lock onto the lattice axes.
    randomReceivers: true,
    randomExponent: 2,
    deposition: 0.5,             // dimensionless deposition coefficient G; 0 = detachment-limited
  },
  hillslope: {
    enabled: true,
    diffusivity: 0.01,           // soil creep diffusivity (m^2/yr)
    criticalSlope: 0.8,          // gradient where creep diverges; also the soil angle of repose (~39 deg)
    maxNonlinearity: 10,         // cap on the nonlinear enhancement factor 1/(1-(S/Sc)^2)
    transportDepth: 0.3,         // creep falls off on soils thinner than this (m)
    avalancheIterations: 40,     // max relaxation sweeps per step for over-steep soil/talus
  },
  weathering: {
    enabled: true,
    productionDepth: 0.5,        // soil production e-folding depth h* (m)
    frostBoost: 1.0,             // production multiplied by (1 + this * frost)
    moistureExponent: 1.0,       // production multiplied by (precipitation / 1 m/yr)^this
  },
  rockfall: {
    enabled: true,
    rockDensity: 2600,           // kg/m^3
    timescale: 300,              // mean waiting time (yr) for an unstable cliff to fail

};

const isPlainObject = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

/** Recursive merge: objects merge key by key, everything else (including arrays) replaces. */
function deepMerge(base, over) {
  if (!isPlainObject(over)) return over === undefined ? clone(base) : clone(over);
  const out = isPlainObject(base) ? clone(base) : {};
  for (const [k, v] of Object.entries(over)) {
    out[k] = isPlainObject(v) && isPlainObject(out[k]) ? deepMerge(out[k], v) : clone(v);
  }
  return out;
}

function clone(v) {
  return v === undefined ? undefined : JSON.parse(JSON.stringify(v));
}

/**
 * Build a complete parameter object: DEFAULTS <- PRESETS[preset] <- overrides.
 * The returned object records which preset it came from but is self-contained.
 *
 * @param {object|string} [input] overrides (may include `preset: name`), or a preset name
 */
function resolveParams(input = {}) {
  const overrides = typeof input === 'string' ? { preset: input } : input;
  let p = clone(DEFAULTS);
  if (overrides.preset) {
    const preset = PRESETS[overrides.preset];
    if (!preset) throw new Error(`unknown preset "${overrides.preset}"; try one of: ${Object.keys(PRESETS).join(', ')}`);
    const { description, ...rest } = preset;
    p = deepMerge(p, rest);
  }
  p = deepMerge(p, overrides);
  validate(p);
  return p;
}

/** Throw a descriptive error for parameter combinations that cannot work. */
function validate(p) {
  const fail = (msg) => { throw new Error(`invalid parameters: ${msg}`); };
  if (!(p.grid.cols >= 3 && p.grid.rows >= 3)) fail('grid must be at least 3 x 3');
  if (!(p.grid.dx > 0)) fail('grid.dx must be positive');
  if (!(p.time.dt > 0)) fail('time.dt must be positive');
  if (!(p.fluvial.n > 0)) fail('fluvial.n must be positive');
  const rockNames = new Set(Object.keys(p.rocks));
  const needRock = (name, where) => { if (!rockNames.has(name)) fail(`${where} refers to unknown rock "${name}"`); };
  if (!p.strata.layers.length) fail('strata.layers must not be empty');
  p.strata.layers.forEach((l, k) => {
    needRock(l.rock, `strata.layers[${k}]`);
    if (!(l.thickness > 0)) fail(`strata.layers[${k}].thickness must be positive`);
  });
  needRock(p.strata.basement, 'strata.basement');
  p.bodies.forEach((b, k) => needRock(b.rock, `bodies[${k}]`));
  const sides = ['north', 'south', 'east', 'west'];
  for (const s of p.boundary.open) if (!sides.includes(s)) fail(`boundary.open: unknown side "${s}"`);
  if (!p.boundary.open.length && p.boundary.seaLevel == null) {
    fail('need at least one open boundary or a sea level, or water has nowhere to go');
  }
}

// ---- src/lithology.js ----
// Lithology: which rock lies at a given place and depth.
//
// Rock type is a function of position (x, y) and of elevation in the rock's own
// reference frame. Uplift carries the strata up with it, so we look rock up at
//   z_frame = z - cumulativeUplift[i]
// i.e. the elevation the rock had at t = 0. The stratigraphic column is a stack of
// layers whose top surface is a plane (optionally dipping, optionally undulating):
//
//   columnTop(x, y) = top - tan(dip) * s(x, y) + undulation(x, y)
//
// where s is the distance along the dip direction from the domain centre. Vertical
// bodies (plugs, dikes) override the strata below their `top` elevation.


class Lithology {
  /**
   * @param {object} params resolved parameters
   * @param {import('./hexgrid.js').HexGrid} grid
   */
  constructor(params, grid) {
    this.grid = grid;
    const names = Object.keys(params.rocks);
    this.names = names;
    const R = names.length;
    this.erodibility = new Float64Array(R);
    this.cohesion = new Float64Array(R);
    this.frictionAngle = new Float64Array(R); // radians
    this.weathering = new Float64Array(R);
    this.color = [];
    names.forEach((name, k) => {
      const r = params.rocks[name];
      this.erodibility[k] = r.erodibility;
      this.cohesion[k] = r.cohesion;
      this.frictionAngle[k] = (r.frictionAngle * Math.PI) / 180;
      this.weathering[k] = r.weathering;
      this.color.push(r.color || '#888888');
    });
    const idx = (name) => names.indexOf(name);

    const st = params.strata;
    this.layerRock = Int32Array.from(st.layers.map((l) => idx(l.rock)));
    // layerBottom[k] = depth below column top of the base of layer k
    this.layerBottom = new Float64Array(st.layers.length);
    let d = 0;
    st.layers.forEach((l, k) => { d += l.thickness; this.layerBottom[k] = d; });
    this.columnThickness = d;
    this.repeat = !!st.repeat;
    this.basement = idx(st.basement);

    const n = grid.size;
    const W = grid.width;
    const H = grid.height;
    const xc = W / 2;
    const yc = H / 2;
    const tanDip = Math.tan(((st.dip || 0) * Math.PI) / 180);
    const az = ((st.dipDirection || 0) * Math.PI) / 180;
    // screen y points south, so "north" is -y
    const ux = Math.cos(az);
    const uy = -Math.sin(az);
    const und = st.undulation || { amplitude: 0 };
    this.columnTop = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      const s = (grid.x[i] - xc) * ux + (grid.y[i] - yc) * uy;
      let top = st.top - tanDip * s;
      if (und.amplitude) top += und.amplitude * fbm(grid.x[i], grid.y[i], { wavelength: und.wavelength, octaves: 3, seed: (params.seed | 0) + 77 });
      this.columnTop[i] = top;
    }

    // Spatial variation in rock strength (fracture density, cementation...): a smooth
    // random field f(x, y) with E[ln f] = 0. Erodibility is multiplied by f, cohesion
    // divided by it. Breaks up the perfectly regular patterns uniform rock would give.
    const sv = params.strata.strengthVariation || { amplitude: 0 };
    this.weakness = new Float64Array(n).fill(1);
    if (sv.amplitude) {
      for (let i = 0; i < n; i++) {
        this.weakness[i] = Math.exp(sv.amplitude * fbm(grid.x[i], grid.y[i], { wavelength: sv.wavelength, octaves: 4, seed: (params.seed | 0) + 191 }));
      }
    }

    // Vertical bodies
    this.bodyRock = new Int32Array(n).fill(-1);
    this.bodyTop = new Float64Array(n).fill(Infinity);
    for (const b of params.bodies || []) {
      const rock = idx(b.rock);
      const top = b.top ?? Infinity;
      for (let i = 0; i < n; i++) {
        const px = grid.x[i] / W;
        const py = grid.y[i] / H;
        let inside = false;
        if (b.shape === 'disc') {
          // radius is a fraction of width; measure in width units on both axes
          const ddx = px - b.x;
          const ddy = (py - b.y) * (H / W);
          inside = ddx * ddx + ddy * ddy <= b.radius * b.radius;
        } else if (b.shape === 'dike') {
          inside = segmentDistance(px, py * (H / W), b.x0, b.y0 * (H / W), b.x1, b.y1 * (H / W)) <= b.width / 2;
        } else {
          throw new Error(`unknown body shape "${b.shape}"`);
        }
        if (inside) {
          this.bodyRock[i] = rock;
          this.bodyTop[i] = top;
        }
      }
    }
  }

  /**
   * Rock index at cell i and frame elevation z (elevation corrected for uplift).
   */
  rockAt(i, z) {
    if (this.bodyRock[i] >= 0 && z <= this.bodyTop[i]) return this.bodyRock[i];
    let depth = this.columnTop[i] - z;
    if (depth < 0) return this.layerRock[0]; // above the column: top layer extends upward
    if (depth >= this.columnThickness) {
      if (!this.repeat) return this.basement;
      depth %= this.columnThickness;
    }
    const lb = this.layerBottom;
    for (let k = 0; k < lb.length; k++) if (depth < lb[k]) return this.layerRock[k];
    return this.layerRock[lb.length - 1];
  }

  /**
   * Thickness-weighted mean cohesion and tan(friction angle) of the rock between
   * frame elevations zLow and zHigh in cell i. This is the strength of a cliff
   * face cutting through several layers: a failure plane must shear through all of them.
   * Samples at `samples` evenly spaced elevations (cheap, and exact enough for display-scale layers).
   */
  meanStrength(i, zLow, zHigh, samples = 8) {
    if (zHigh <= zLow) {
      const k = this.rockAt(i, zHigh);
      return { cohesion: this.cohesion[k] / this.weakness[i], phi: this.frictionAngle[k] };
    }
    let c = 0;
    let t = 0;
    const h = (zHigh - zLow) / samples;
    for (let s = 0; s < samples; s++) {
      const k = this.rockAt(i, zLow + (s + 0.5) * h);
      c += this.cohesion[k];
      t += Math.tan(this.frictionAngle[k]);
    }
    return { cohesion: c / samples / this.weakness[i], phi: Math.atan(t / samples) };
  }
}

function segmentDistance(px, py, x0, y0, x1, y1) {
  const vx = x1 - x0;
  const vy = y1 - y0;
  const len2 = vx * vx + vy * vy;
  let t = len2 > 0 ? ((px - x0) * vx + (py - y0) * vy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  const dx = px - (x0 + t * vx);
  const dy = py - (y0 + t * vy);
  return Math.sqrt(dx * dx + dy * dy);
}

// ---- src/flow.js ----
// Water routing: depression filling, flow directions, and discharge.
//
// 1. Priority-flood (Barnes, Lehman & Mulla 2014, "Priority-flood: An optimal
//    depression-filling and watershed-labeling algorithm", Computers & Geosciences 62)
//    grows inward from the outlets, always expanding the lowest known cell. Any
//    cell reached from a higher one is a pit and is raised to just above it; the
//    raised surface `filled` is the water surface of lakes. A tiny epsilon makes
//    lake surfaces drain in a definite direction.
// 2. Each cell drains to its lowest neighbour on the filled surface (single flow
//    direction; on a hex grid all six neighbours are equidistant, so lowest = steepest).
//    Drainage AREA can optionally be spread over all lower neighbours (multiple flow
//    direction), which avoids grid-aligned streaks on planar hillslopes; incision and
//    sediment still follow the single steepest receiver.
// 3. Cells pop off the priority queue in increasing filled elevation, so every
//    cell appears after its receiver. That pop order is the "stack": iterate it
//    forwards to go downstream-first, backwards to go upstream-first.

class MinHeap {
  constructor(capacity) {
    this.idx = new Int32Array(capacity);
    this.key = new Float64Array(capacity);
    this.n = 0;
  }
  push(i, k) {
    let p = this.n++;
    const { idx, key } = this;
    while (p > 0) {
      const parent = (p - 1) >> 1;
      if (key[parent] <= k) break;
      idx[p] = idx[parent];
      key[p] = key[parent];
      p = parent;
    }
    idx[p] = i;
    key[p] = k;
  }
  pop() {
    const { idx, key } = this;
    const top = idx[0];
    const last = --this.n;
    const li = idx[last];
    const lk = key[last];
    let p = 0;
    for (;;) {
      let c = 2 * p + 1;
      if (c >= last) break;
      if (c + 1 < last && key[c + 1] < key[c]) c++;
      if (key[c] >= lk) break;
      idx[p] = idx[c];
      key[p] = key[c];
      p = c;
    }
    idx[p] = li;
    key[p] = lk;
    return top;
  }
}

/** Lake surfaces rise by this much (m) per cell away from their outlet. */
const FLAT_EPSILON = 1e-6;

/**
 * @param {import('./hexgrid.js').HexGrid} grid
 * @param {Float64Array} z surface elevation
 * @param {Uint8Array} outlet 1 where water leaves the domain (base level / sea)
 * @param {Float64Array} weight per-cell runoff multiplier (precipitation / 1 m/yr)
 * @param {object} out preallocated arrays: filled, receiver, order, area, visited (scratch);
 *   optional out.flowExponent > 0 switches drainage area to multiple flow direction
 */
function routeFlow(grid, z, outlet, weight, out) {
  const n = grid.size;
  const nb = grid.neighbors;
  const { filled, receiver, order, area } = out;
  const visited = out.visited;
  visited.fill(0);
  const heap = out.heap || (out.heap = new MinHeap(n));
  heap.n = 0;

  let anyOutlet = false;
  for (let i = 0; i < n; i++) {
    if (outlet[i]) {
      filled[i] = z[i];
      receiver[i] = -1;
      visited[i] = 1;
      heap.push(i, z[i]);
      anyOutlet = true;
    }
  }
  if (!anyOutlet) throw new Error('routeFlow: no outlet cells');

  let count = 0;
  while (heap.n > 0) {
    const c = heap.pop();
    order[count++] = c;
    const fc = filled[c];
    for (let k = 0; k < 6; k++) {
      const j = nb[6 * c + k];
      if (j < 0 || visited[j]) continue;
      visited[j] = 1;
      const raised = fc + FLAT_EPSILON;
      filled[j] = z[j] > raised ? z[j] : raised;
      heap.push(j, filled[j]);
    }
  }

  const rng = out.rng;
  const rp = out.randomExponent ?? 0;
  for (let i = 0; i < n; i++) {
    if (outlet[i]) continue;
    let best = -1;
    let bestZ = filled[i];
    for (let k = 0; k < 6; k++) {
      const j = nb[6 * i + k];
      if (j >= 0 && filled[j] < bestZ) { bestZ = filled[j]; best = j; }
    }
    if (rng && rp > 0) {
      // Random receiver among the lower neighbours, chosen with probability proportional
      // to drop^rp (the hex analogue of the "Rho8" method of Fairfield & Leymarie 1991,
      // Water Resour. Res. 27). Re-drawn every step, it removes the bias towards the six
      // lattice directions while keeping a single receiver for the implicit solver.
      const fi = filled[i];
      let sum = 0;
      for (let k = 0; k < 6; k++) {
        const j = nb[6 * i + k];
        if (j >= 0 && filled[j] < fi) sum += Math.pow(fi - filled[j], rp);
      }
      let u = rng.next() * sum;
      for (let k = 0; k < 6; k++) {
        const j = nb[6 * i + k];
        if (j >= 0 && filled[j] < fi) {
          u -= Math.pow(fi - filled[j], rp);
          if (u <= 0) { best = j; break; }
        }
      }
    }
    receiver[i] = best;
  }

  const a = grid.cellArea;
  for (let i = 0; i < n; i++) area[i] = weight[i] * a;
  const p = out.flowExponent ?? 0;
  if (!(p > 0)) {
    // single flow direction: everything goes to the steepest receiver
    for (let s = n - 1; s >= 0; s--) {
      const i = order[s];
      const r = receiver[i];
      if (r >= 0) area[r] += area[i];
    }
    return;
  }
  // Multiple flow direction (Freeman 1991, Computers & Geosciences 17): area is shared
  // among all lower neighbours in proportion to slope^p. Large p tends to single flow.
  // Every lower neighbour has lower filled elevation, so it comes earlier in `order`
  // and the upstream-first sweep stays valid.
  const w = new Float64Array(6);
  for (let s = n - 1; s >= 0; s--) {
    const i = order[s];
    if (receiver[i] < 0) continue;
    const fi = filled[i];
    let sum = 0;
    for (let k = 0; k < 6; k++) {
      const j = nb[6 * i + k];
      const d = j >= 0 ? fi - filled[j] : 0;
      w[k] = d > 0 ? Math.pow(d, p) : 0;
      sum += w[k];
    }
    const ai = area[i] / sum;
    for (let k = 0; k < 6; k++) if (w[k] > 0) area[nb[6 * i + k]] += ai * w[k];
  }
}

// ---- src/processes/fluvial.js ----
// Rivers: bedrock/soil incision by the stream power law, then sediment transport
// and deposition downstream.
//
// INCISION. Channel lowering rate E = K * A^m * S^n, where A is the effective
// drainage area (upstream area weighted by precipitation / 1 m/yr), S the slope to
// the receiver, and K an erodibility that blends between soil and bedrock:
//
//   K = K_soil * (1 - c) + K_rock * c,      c = exp(-soil / soilCoverScale)
//
// (thick soil -> soil erodibility; bare rock -> rock erodibility; after the SPACE
// model of Shobe, Tucker & Barnhart 2017, Geosci. Model Dev. 10). Vegetation
// reduces K_soil. We solve implicitly in time, downstream first, following
// Braun & Willett 2013 (Geomorphology 180-181), which is unconditionally stable for
// n = 1; for n != 1 each cell's implicit equation is solved by Newton's method.
//
// DEPOSITION. Eroded material travels downstream as a volumetric flux Qs (m^3/yr).
// Each cell deposits at rate D = G * Qs / A ("xi-q" erosion-deposition model of
// Davy & Lague 2009, in the dimensionless form of Yuan et al. 2019, JGR Earth Surface
// 124). G = 0 recovers pure detachment-limited incision; G ~ 1 gives alluvial
// valleys and fans. Lakes and the sea trap sediment up to their water level.
//
// As in SPACE, the soil term only removes soil and the rock term only removes rock.
// Simplification: the implicit solve uses the blended K for the total lowering and
// then splits it in proportion; if the soil runs out mid-step the soil share is
// simply truncated (the cell lowers a little less than the implicit solution).

/**
 * @param {import('../simulation.js').Simulation} sim
 * @param {number} dt years
 */
function fluvial(sim, dt) {
  const p = sim.params.fluvial;
  const { grid, lith, rock, soil, z, outlet, boundaryOutlet, veg } = sim;
  const { filled, receiver, order, area } = sim.flow;
  const n = grid.size;
  const L = grid.dx;
  const ac = grid.cellArea;
  const m = p.m;
  const nExp = p.n;
  const Ks = p.soilErodibility;
  const Hs = p.soilCoverScale;
  const G = p.deposition;
  const vegRed = sim.params.vegetation.erodibilityReduction;
  const sea = sim.params.boundary.seaLevel;
  const lakeTol = 1e-3;
  const eroded = sim.scratch.eroded; // lowering depth this step (m)
  const zNew = sim.scratch.zNew;

  // --- incision, downstream first ---
  for (let s = 0; s < n; s++) {
    const i = order[s];
    eroded[i] = 0;
    zNew[i] = z[i];
    if (outlet[i]) continue;
    if (filled[i] - z[i] > lakeTol) continue; // under a lake: no incision
    const r = receiver[i];
    const zr = zNew[r];
    if (z[i] <= zr) continue;
    const cover = Math.exp(-soil[i] / Hs);
    const kSoil = Ks * Math.exp(-vegRed * veg[i]) * (1 - cover);
    const kRock = lith.erodibility[sim.surfaceRock[i]] * lith.weakness[i] * cover;
    const K = kSoil + kRock;
    const Am = Math.pow(area[i], m);
    let zi;
    if (nExp === 1) {
      const F = (K * Am * dt) / L;
      zi = (z[i] + F * zr) / (1 + F);
    } else {
      // f(h) = h - h0 + F h^n = 0 with h = zi - zr, h0 = z[i] - zr
      const F = (K * Am * dt) / Math.pow(L, nExp);
      const h0 = z[i] - zr;
      let h = h0;
      for (let it = 0; it < 30; it++) {
        const hn1 = Math.pow(h, nExp - 1);
        const f = h - h0 + F * hn1 * h;
        const df = 1 + nExp * F * hn1;
        const hNext = Math.max(h - f / df, h * 1e-3);
        if (Math.abs(hNext - h) < 1e-9 * (1 + h0)) { h = hNext; break; }
        h = hNext;
      }
      zi = zr + h;
    }
    // Split the lowering between soil entrainment and bedrock incision in proportion to
    // their terms in K. Soil removal cannot exceed the soil present; it never eats into rock.
    const total = z[i] - zi;
    const fromSoil = Math.min(soil[i], (total * kSoil) / K);
    const fromRock = (total * kRock) / K;
    soil[i] -= fromSoil;
    rock[i] -= fromRock;
    eroded[i] = fromSoil + fromRock;
    zNew[i] = z[i] - eroded[i];
  }

  // --- sediment routing and deposition, upstream first ---
  const qs = sim.scratch.qs; // incoming sediment flux (m^3/yr)
  qs.fill(0);
  let exported = 0;
  for (let s = n - 1; s >= 0; s--) {
    const i = order[s];
    const supply = qs[i] + (eroded[i] * ac) / dt; // m^3/yr
    if (supply <= 0) continue;
    const maxDepth = (supply * dt) / ac; // all of it, as a thickness on this cell
    let d;
    if (outlet[i]) {
      d = !boundaryOutlet[i] && sea != null ? clamp(sea - zNew[i], 0, maxDepth) : 0;
    } else if (filled[i] - z[i] > lakeTol) {
      // a lake (judged on the pre-incision surface, which z still holds): fill to the water level
      d = Math.min(filled[i] - zNew[i], maxDepth);
    } else if (G > 0) {
      d = ((G * supply) / (area[i] + G * ac)) * dt;
    } else {
      d = 0;
    }
    soil[i] += d;
    zNew[i] += d;
    const out = supply - (d * ac) / dt;
    const r = receiver[i];
    if (r >= 0) qs[r] += out;
    else exported += out * dt;
  }
  sim.qs = qs;
  for (let i = 0; i < n; i++) z[i] = rock[i] + soil[i];
  return exported;
}

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}

// ---- src/processes/hillslope.js ----
// Hillslopes: soil creep and soil/talus avalanching.
//
// CREEP. Soil moves downslope with a flux per unit width
//
//   q = D * S / (1 - (S/Sc)^2) * (1 - exp(-h / h0))
//
// the nonlinear creep law of Roering, Kirchner & Dietrich 1999 (Water Resour. Res. 35)
// with a depth dependence (thin soil creeps less; bare rock not at all). Only soil
// moves, so outflow from a cell is capped at the soil it has. The enhancement factor
// 1/(1-(S/Sc)^2) is capped at `maxNonlinearity`; anything steeper than Sc is handled
// by avalanching instead.
//
// On the hex lattice, the flux across the edge shared by cells i and j changes the
// height of each by
//     dh = q * edgeLength / cellArea * dt = q * 2 / (3 dx) * dt,   with S = dz / dx,
// which works out to D * f * dz * 2 / (3 dx^2) * dt -- the standard hex-lattice
// Laplacian. Forward Euler is stable for dt < dx^2 / (3 D f); we substep.
//
// AVALANCHING. Soil steeper than the angle of repose (slope Sc) slides to lower
// neighbours until it is not, conserving volume (a "thermal erosion" relaxation as
// in Musgrave, Kolb & Mace 1989, SIGGRAPH). This is what builds talus slopes under
// cliffs from rockfall debris.

const LAPLACE = 2 / 3; // hex-lattice Laplacian coefficient (divided by dx^2)

/** Effective critical slope for cell i, raised by vegetation (root cohesion). */
function criticalSlope(sim, i) {
  return sim.params.hillslope.criticalSlope * (1 + sim.params.vegetation.slopeBoost * sim.veg[i]);
}

/**
 * @param {import('../simulation.js').Simulation} sim
 * @param {number} dt years
 * @returns {{substeps:number}}
 */
function creep(sim, dt) {
  const hp = sim.params.hillslope;
  const vp = sim.params.vegetation;
  const { grid, soil, z, veg } = sim;
  const n = grid.size;
  const nb = grid.neighbors;
  const dx = grid.dx;
  const D0 = hp.diffusivity;
  const fmax = Math.max(1, hp.maxNonlinearity);
  const h0 = hp.transportDepth;
  if (!(D0 > 0)) return { substeps: 0 };

  let vmax = 0;
  for (let i = 0; i < n; i++) if (veg[i] > vmax) vmax = veg[i];
  const Dmax = D0 * (1 + vp.diffusivityBoost * vmax);
  const dtStable = (0.5 * dx * dx) / (3 * Dmax * fmax);
  const substeps = Math.max(1, Math.ceil(dt / dtStable));
  const h = dt / substeps;
  const coef = (LAPLACE * h) / (dx * dx);

  const flux = sim.scratch.edgeFlux; // 3 per cell: directions 0 (E), 1 (NE), 2 (NW)
  const outTotal = sim.scratch.outTotal;
  for (let sub = 0; sub < substeps; sub++) {
    outTotal.fill(0);
    for (let i = 0; i < n; i++) {
      for (let k = 0; k < 3; k++) {
        const j = nb[6 * i + k];
        const e = 3 * i + k;
        if (j < 0) { flux[e] = 0; continue; }
        const dz = z[i] - z[j];
        const up = dz > 0 ? i : j;
        const S = Math.abs(dz) / dx;
        const Sc = criticalSlope(sim, up);
        const r = S / Sc;
        const f = r < 1 ? Math.min(fmax, 1 / (1 - r * r)) : fmax;
        const D = D0 * (1 + vp.diffusivityBoost * veg[up]);
        const depth = 1 - Math.exp(-soil[up] / h0);
        const q = D * f * depth * dz * coef; // height moved i -> j (negative: j -> i)
        flux[e] = q;
        outTotal[up] += Math.abs(q);
      }
    }
    // scale factor so no cell exports more soil than it has
    for (let i = 0; i < n; i++) {
      outTotal[i] = outTotal[i] > soil[i] ? soil[i] / outTotal[i] : 1;
    }
    for (let i = 0; i < n; i++) {
      for (let k = 0; k < 3; k++) {
        const q0 = flux[3 * i + k];
        if (q0 === 0) continue;
        const j = nb[6 * i + k];
        const q = q0 > 0 ? q0 * outTotal[i] : q0 * outTotal[j];
        soil[i] -= q;
        soil[j] += q;
        z[i] -= q;
        z[j] += q;
      }
    }
    for (let i = 0; i < n; i++) if (soil[i] < 0) { z[i] -= soil[i]; soil[i] = 0; } // round-off only
  }
  return { substeps };
}

/**
 * Relax soil slopes steeper than the critical slope.
 * The first sweep visits every cell; later sweeps only revisit cells next to
 * where something moved (a worklist), alternating direction to avoid bias.
 * @returns {number} total volume moved (m^3)
 */
function avalanche(sim) {
  const { grid, soil, z, boundaryOutlet } = sim;
  const n = grid.size;
  const nb = grid.neighbors;
  const dx = grid.dx;
  const maxIter = sim.params.hillslope.avalancheIterations;
  const excess = new Float64Array(6);
  const ws = sim.scratch.avalanche || (sim.scratch.avalanche = {
    list: new Int32Array(n), next: new Int32Array(n), mark: new Uint32Array(n), stamp: 0,
  });
  let list = ws.list;
  let next = ws.next;
  let count = n;
  for (let i = 0; i < n; i++) list[i] = i;
  let moved = 0;
  for (let it = 0; it < maxIter && count > 0; it++) {
    const stamp = ++ws.stamp;
    let nextCount = 0;
    const forward = (it & 1) === 0;
    for (let s = 0; s < count; s++) {
      const i = list[forward ? s : count - 1 - s];
      if (soil[i] <= 0 || boundaryOutlet[i]) continue;
      const lim = criticalSlope(sim, i) * dx;
      let sum = 0;
      let emax = 0;
      for (let k = 0; k < 6; k++) {
        const j = nb[6 * i + k];
        let e = 0;
        if (j >= 0) {
          e = z[i] - z[j] - lim;
          if (e < 0) e = 0;
        }
        excess[k] = e;
        sum += e;
        if (e > emax) emax = e;
      }
      if (emax <= 1e-6) continue;
      // Move half the largest excess (the amount that would level the steepest pair),
      // shared among all over-steep neighbours in proportion to their excess.
      const M = Math.min(soil[i], 0.5 * emax);
      for (let k = 0; k < 6; k++) {
        if (excess[k] === 0) continue;
        const j = nb[6 * i + k];
        const dm = (M * excess[k]) / sum;
        soil[j] += dm;
        z[j] += dm;
      }
      soil[i] -= M;
      z[i] -= M;
      moved += M;
      // i and its neighbours may now be unstable
      if (ws.mark[i] !== stamp) { ws.mark[i] = stamp; next[nextCount++] = i; }
      for (let k = 0; k < 6; k++) {
        const j = nb[6 * i + k];
        if (j >= 0 && ws.mark[j] !== stamp) { ws.mark[j] = stamp; next[nextCount++] = j; }
      }
    }
    [list, next] = [next, list];
    count = nextCount;
  }
  return moved * grid.cellArea;
}

// ---- src/processes/rockfall.js ----
// Rockfall and cliff collapse, using the Culmann slope-stability criterion.
//
// A planar rock face of slope angle beta, made of material with cohesion C,
// friction angle phi and unit weight rho*g, can stand to a maximum height
//
//   Hc = (4 C / (rho g)) * sin(beta) cos(phi) / (1 - cos(beta - phi))
//
// and fails along a plane at angle (beta + phi) / 2. (Culmann 1866; used in
// landscape evolution models by Densmore, Ellis & Anderson 1998, JGR 103.) Hc grows
// without bound as beta -> phi, so faces no steeper than phi never fail, and
// strong rock (high C) supports tall vertical cliffs while weak rock does not.
//
// On the grid, each cell is compared with its lowest neighbour. The drop between
// them is the face height and atan(drop / dx) its angle. The face strength is the
// thickness-weighted mean over the layers it cuts, so a soft layer at the foot of
// a cliff weakens it -- undercutting, the engine of escarpment retreat.
//
// An unstable face fails stochastically with rate (1/timescale)(1 + frostFactor*frost),
// i.e. probability 1 - exp(-rate dt) per step. The failed wedge is removed down to
// the failure plane (but never more than half the drop, so the two cells cannot
// swap order) and dumped as loose debris (soil) on the lower cell, where the
// avalanche step spreads it into a talus slope.
//
// Grid-scale caveat: cliffs lower than about dx * tan(phi) cannot be represented as
// unstable faces, so rockfall only "switches on" when dx is small compared with the
// cliff heights the rock can sustain.

const G_ACCEL = 9.81;

/** Culmann critical height (m) for a face at angle beta (rad). Infinity if beta <= phi. */
function culmannHeight(beta, cohesion, phi, density) {
  if (beta <= phi) return Infinity;
  return ((4 * cohesion) / (density * G_ACCEL)) * (Math.sin(beta) * Math.cos(phi)) / (1 - Math.cos(beta - phi));
}

/**
 * @param {import('../simulation.js').Simulation} sim
 * @param {number} dt years
 * @returns {{events:number, volume:number}}
 */
function rockfall(sim, dt) {
  const rp = sim.params.rockfall;
  const { grid, lith, rock, soil, z, boundaryOutlet, upliftCum, rng, rockfallActivity } = sim;
  const n = grid.size;
  const nb = grid.neighbors;
  const dx = grid.dx;
  const rate = (1 / rp.timescale) * (1 + rp.frostFactor * sim.params.climate.frost);
  const pFail = 1 - Math.exp(-rate * dt);
  let events = 0;
  let volume = 0;

  const forward = (sim.stepCount & 1) === 0;
  for (let s = 0; s < n; s++) {
    const i = forward ? s : n - 1 - s;
    if (boundaryOutlet[i]) continue;
    let j = -1;
    let zj = z[i];
    for (let k = 0; k < 6; k++) {
      const c = nb[6 * i + k];
      if (c >= 0 && z[c] < zj) { zj = z[c]; j = c; }
    }
    if (j < 0) continue;
    const drop = z[i] - zj;
    // only the rock part of the face carries load; the soil cap is just weight
    const rockFace = rock[i] - zj;
    if (rockFace <= 0) continue;
    const beta = Math.atan(drop / dx);
    const { cohesion, phi } = lith.meanStrength(i, zj - upliftCum[i], rock[i] - upliftCum[i]);
    if (drop <= culmannHeight(beta, cohesion, phi, rp.rockDensity)) continue;
    if (rng.next() >= pFail) continue;

    const stableDrop = dx * Math.tan(0.5 * (beta + phi));
    const remove = Math.min(drop - stableDrop, 0.5 * drop);
    if (remove <= 0) continue;
    const fromSoil = Math.min(soil[i], remove);
    soil[i] -= fromSoil;
    rock[i] -= remove - fromSoil;
    z[i] -= remove;
    soil[j] += remove;
    z[j] += remove;
    events++;
    volume += remove * grid.cellArea;
    rockfallActivity[i] += remove;
  }
  return { events, volume };
}

// ---- src/simulation.js ----
// The simulation: state, the order of processes in a time step, and bookkeeping.
//
// STATE (per cell, all in metres):
//   rock       elevation of the bedrock surface
//   soil       thickness of loose material on top (regolith, alluvium, talus)
//   z          surface elevation = rock + soil (kept in sync)
//   upliftCum  total rock uplift so far (to look up strata in the rock's own frame)
//
// ONE STEP of length dt:
//   1. uplift       rock rises by U(x, y) dt (except at fixed base-level outlets)
//   2. weathering   bedrock converts to soil at P0 exp(-soil / h*)   (Heimsath et al. 1997, Nature 388)
//   3. vegetation   cover from climate and soil depth
//   4. flow         lakes, flow directions, drainage area
//   5. rivers       stream power incision + sediment deposition
//   6. creep        nonlinear soil creep
//   7. rockfall     Culmann cliff failure -> debris
//   8. avalanche    over-steep soil and talus slide to the angle of repose
//   9. boundaries   material reaching an open edge leaves the domain
//
// Operator splitting like this is first-order accurate in dt; keep dt small
// compared with the timescales you care about (e.g. the rockfall timescale).









class Simulation {
  /**
   * @param {object|string} [params] parameter overrides (see params.js), optionally
   *   with `preset: name`; or just a preset name.
   */
  constructor(params = {}) {
    this.params = resolveParams(params);
    const g = this.params.grid;
    this.grid = new HexGrid(g.cols, g.rows, g.dx);
    const n = this.grid.size;
    this.rock = new Float64Array(n);
    this.soil = new Float64Array(n);
    this.z = new Float64Array(n);
    this.upliftCum = new Float64Array(n);
    this.veg = new Float64Array(n);
    this.surfaceRock = new Int32Array(n);
    this.outlet = new Uint8Array(n);
    this.boundaryOutlet = new Uint8Array(n);
    this.upliftField = new Float64Array(n);
    this.precipWeight = new Float64Array(n);
    this.vegMax = new Float64Array(n);
    /** Net surface change rate over the last step (m/yr), uplift included. */
    this.dzdt = new Float64Array(n);
    /** Recent rockfall thickness removed per cell (m), decaying over a few steps; for display. */
    this.rockfallActivity = new Float64Array(n);
    this.flow = {
      filled: new Float64Array(n),
      receiver: new Int32Array(n),
      order: new Int32Array(n),
      area: new Float64Array(n),
      visited: new Uint8Array(n),
      flowExponent: 0,
    };
    this.qs = new Float64Array(n);
    this.scratch = {
      eroded: new Float64Array(n),
      zNew: new Float64Array(n),
      qs: new Float64Array(n),
      edgeFlux: new Float64Array(3 * n),
      outTotal: new Float64Array(n),
      zStart: new Float64Array(n),
    };
    this.time = 0;
    this.stepCount = 0;
    this.rng = new Rng(this.params.seed);
    this.budget = { uplift: 0, exported: 0 };
    this.last = { substeps: 0, rockfallEvents: 0, rockfallVolume: 0, avalancheVolume: 0, exported: 0 };

    this._buildBoundaries();
    this._buildDerived();
    this._initialTerrain();
    this._updateDerivedState();
    routeFlow(this.grid, this.z, this.outlet, this.precipWeight, this.flow);
  }

  /** Rebuild a simulation exactly from snapshot() output. */
  static fromSnapshot(snap) {
    const sim = new Simulation(snap.params);
    sim.rock.set(snap.rock);
    sim.soil.set(snap.soil);
    sim.upliftCum.set(snap.upliftCum);
    sim.time = snap.time;
    sim.stepCount = snap.stepCount;
    sim.budget = { ...snap.budget };
    sim._updateDerivedState();
    routeFlow(sim.grid, sim.z, sim.outlet, sim.precipWeight, sim.flow);
    sim.rng.state = snap.rngState >>> 0; // after routing, which may draw random numbers
    return sim;
  }

  /** Everything needed to reproduce and continue this run, as plain JSON-able data. */
  snapshot() {
    return {
      format: 'edgy-erosion-snapshot/1',
      params: this.params,
      time: this.time,
      stepCount: this.stepCount,
      rngState: this.rng.state,
      budget: { ...this.budget },
      rock: Array.from(this.rock),
      soil: Array.from(this.soil),
      upliftCum: Array.from(this.upliftCum),
    };
  }

  /**
   * Change parameters mid-run (climate, rates, rocks, strata...). Grid geometry and
   * the initial condition cannot change; make a new Simulation for that.
   */
  setParams(overrides) {
    const next = deepMerge(this.params, overrides);
    for (const k of ['cols', 'rows', 'dx']) {
      if (next.grid[k] !== this.params.grid[k]) throw new Error('grid cannot change mid-run; create a new Simulation');
    }
    validate(next);
    this.params = next;
    this._buildBoundaries();
    this._buildDerived();
    this._updateDerivedState();
  }

  /** Advance one step. */
  step(dt = this.params.time.dt) {
    const p = this.params;
    const { grid, rock, soil, z, boundaryOutlet } = this;
    const n = grid.size;
    const ac = grid.cellArea;
    this.scratch.zStart.set(z);

    // 1. uplift
    let upliftVol = 0;
    for (let i = 0; i < n; i++) {
      if (boundaryOutlet[i]) continue;
      const u = this.upliftField[i] * dt;
      rock[i] += u;
      this.upliftCum[i] += u;
      upliftVol += u * ac;
    }
    this.budget.uplift += upliftVol;
    this._updateSurfaceRock();

    // 2. weathering
    if (p.weathering.enabled) {
      const wp = p.weathering;
      // climate: frost cracking speeds production, and so does moisture (chemical weathering)
      const frost = 1 + wp.frostBoost * p.climate.frost;
      const wet = Math.pow(Math.max(p.climate.precipitation, 1e-6), wp.moistureExponent ?? 0);
      const vb = p.vegetation.productionBoost;
      const hs = wp.productionDepth;
      for (let i = 0; i < n; i++) {
        if (boundaryOutlet[i] || soil[i] > 40 * hs) continue; // production negligible under deep soil
        // dh/dt = P exp(-h/h*) integrates exactly to h(t+dt) = h* ln(exp(h/h*) + P dt / h*)
        const P = this.lith.weathering[this.surfaceRock[i]] * frost * wet * (1 + vb * this.veg[i]);
        const h1 = hs * Math.log(Math.exp(soil[i] / hs) + (P * dt) / hs);
        const d = h1 - soil[i];
        if (!(d > 0)) continue;
        rock[i] -= d;
        soil[i] = h1;
      }
      this._updateSurfaceRock();
    }
    for (let i = 0; i < n; i++) z[i] = rock[i] + soil[i];

    // 3. vegetation, 4. flow
    this._updateVegetation();
    this._updateOutlets();
    routeFlow(grid, z, this.outlet, this.precipWeight, this.flow);

    // 5. rivers
    let exported = 0;
    if (p.fluvial.enabled) exported += fluvial(this, dt);

    // 6. creep
    this.last.substeps = p.hillslope.enabled ? creep(this, dt).substeps : 0;

    // 7. rockfall
    const act = this.rockfallActivity;
    for (let i = 0; i < n; i++) act[i] *= 0.7;
    if (p.rockfall.enabled) {
      const rf = rockfall(this, dt);
      this.last.rockfallEvents = rf.events;
      this.last.rockfallVolume = rf.volume;
    } else {
      this.last.rockfallEvents = 0;
      this.last.rockfallVolume = 0;
    }

    // 8. avalanche
    this.last.avalancheVolume = p.hillslope.enabled ? avalanche(this) : 0;

    // 9. open boundaries: loose material leaves; base level stays fixed
    for (let i = 0; i < n; i++) {
      if (boundaryOutlet[i] && soil[i] > 0) {
        exported += soil[i] * ac;
        soil[i] = 0;
      }
      z[i] = rock[i] + soil[i];
    }
    this.budget.exported += exported;
    this.last.exported = exported;

    this.time += dt;
    this.stepCount++;
    const zs = this.scratch.zStart;
    for (let i = 0; i < n; i++) this.dzdt[i] = (z[i] - zs[i]) / dt;
    this._updateDerivedState();
    // Re-route on the final surface so lakes, drainage area etc. match `z` for display
    // and analysis. (The next step routes again after uplift.)
    routeFlow(grid, z, this.outlet, this.precipWeight, this.flow);
    return this;
  }

  /** Advance `steps` steps; optional callback(sim) after each. */
  run(steps, onStep) {
    for (let s = 0; s < steps; s++) {
      this.step();
      if (onStep) onStep(this);
    }
    return this;
  }

  /** Total volume of rock + soil above z = 0 datum (m^3), for budget checks. */
  volume() {
    let v = 0;
    for (let i = 0; i < this.grid.size; i++) v += this.rock[i] + this.soil[i];
    return v * this.grid.cellArea;
  }

  /** Summary numbers for logging. */
  stats() {
    const { z, soil, grid } = this;
    let zmin = Infinity, zmax = -Infinity, zsum = 0, ssum = 0, bare = 0, lake = 0;
    const f = this.flow.filled;
    for (let i = 0; i < grid.size; i++) {
      if (z[i] < zmin) zmin = z[i];
      if (z[i] > zmax) zmax = z[i];
      zsum += z[i];
      ssum += soil[i];
      if (soil[i] < 0.05) bare++;
      if (f[i] - z[i] > 0.1) lake++;
    }
    return {
      time: this.time,
      step: this.stepCount,
      minElevation: zmin,
      maxElevation: zmax,
      meanElevation: zsum / grid.size,
      meanSoil: ssum / grid.size,
      bareRockFraction: bare / grid.size,
      lakeFraction: lake / grid.size,
      rockfallEvents: this.last.rockfallEvents,
      rockfallVolume: this.last.rockfallVolume,
      exportedVolume: this.last.exported,
      creepSubsteps: this.last.substeps,
    };
  }

  // ---------------------------------------------------------------- internals

  _buildBoundaries() {
    const open = new Set(this.params.boundary.open);
    const g = this.grid;
    for (let i = 0; i < g.size; i++) {
      const e = g.edge[i];
      this.boundaryOutlet[i] =
        ((e & 1) && open.has('west')) || ((e & 2) && open.has('east')) ||
        ((e & 4) && open.has('north')) || ((e & 8) && open.has('south')) ? 1 : 0;
    }
  }

  _buildDerived() {
    const p = this.params;
    const g = this.grid;
    this.flow.flowExponent = p.fluvial.routing === 'mfd' ? p.fluvial.flowExponent : 0;
    this.flow.randomExponent = p.fluvial.randomReceivers ? p.fluvial.randomExponent : 0;
    this.flow.rng = this.rng;
    this.lith = new Lithology(p, g);
    const W = g.width, H = g.height;
    const u = p.uplift;
    const ang = ((u.angle || 0) * Math.PI) / 180;
    const ux = Math.cos(ang), uy = -Math.sin(ang);
    for (let i = 0; i < g.size; i++) {
      const fx = g.x[i] / W - 0.5;
      const fy = (g.y[i] / W) - 0.5 * (H / W); // width units, centred
      let f = 1;
      switch (u.pattern) {
        case 'uniform': f = 1; break;
        case 'dome': f = Math.exp(-(fx * fx + fy * fy) / (2 * u.radius * u.radius)); break;
        case 'tilt': f = clamp01(0.5 + fx * ux + fy * uy); break;
        case 'fault': f = -fx * uy + fy * ux + (u.offset || 0) < 0 ? 1 : 0; break;
        default: throw new Error(`unknown uplift pattern "${u.pattern}"`);
      }
      this.upliftField[i] = this.boundaryOutlet[i] ? 0 : u.rate * f;

      const P = Math.max(0, p.climate.precipitation * (1 + p.climate.precipitationGradient * (fx)));
      this.precipWeight[i] = P; // relative to a 1 m/yr reference
      const vc = p.vegetation.cover;
      this.vegMax[i] = vc === 'auto' ? P / (P + p.vegetation.halfSaturation) : Math.max(0, Math.min(1, +vc));
    }
  }

  _initialTerrain() {
    const p = this.params.initial;
    const g = this.grid;
    const W = g.width, H = g.height;
    const ang = ((p.angle || 0) * Math.PI) / 180;
    const ux = Math.cos(ang), uy = -Math.sin(ang);
    const noise = p.noise || { amplitude: 0 };
    for (let i = 0; i < g.size; i++) {
      const fx = g.x[i] / W;
      const fy = g.y[i] / H;
      let shape = 0;
      switch (p.type) {
        case 'flat': shape = 0; break;
        case 'plateau': {
          // distance inside the plateau rectangle, in width units
          let d = Math.min(fx - p.margin, 1 - p.margin - fx, (fy - p.margin) * (H / W), (1 - p.margin - fy) * (H / W));
          if (p.edgeNoise) d += p.edgeNoise * fbm(g.x[i], g.y[i], { wavelength: 0.3 * W, octaves: 4, seed: (this.params.seed | 0) + 31 });
          shape = smoothstep(clamp01(d / p.edgeWidth + 0.5));
          break;
        }
        case 'dome': {
          const rx = fx - 0.5, ry = (fy - 0.5) * (H / W);
          shape = Math.exp(-(rx * rx + ry * ry) / (2 * 0.22 * 0.22));
          break;
        }
        case 'ramp': shape = clamp01(0.5 + (fx - 0.5) * ux + (fy - 0.5) * (H / W) * uy); break;
        case 'ridge': shape = clamp01(1 - 2 * Math.abs((fx - 0.5) * -uy + (fy - 0.5) * (H / W) * ux)); break;
        default: throw new Error(`unknown initial terrain type "${p.type}"`);
      }
      let zi = p.base + p.height * shape;
      if (noise.amplitude) {
        zi += noise.amplitude * fbm(g.x[i], g.y[i], { wavelength: noise.wavelength, octaves: noise.octaves ?? 5, gain: noise.gain ?? 0.5, seed: this.params.seed | 0 });
      }
      this.rock[i] = zi - (this.boundaryOutlet[i] ? 0 : p.soil);
      this.soil[i] = this.boundaryOutlet[i] ? 0 : p.soil;
    }
    // Open edges are base level: no higher than `base`, so rivers have somewhere to go.
    for (let i = 0; i < g.size; i++) if (this.boundaryOutlet[i]) this.rock[i] = Math.min(this.rock[i], p.base);
  }

  _updateSurfaceRock() {
    const { rock, upliftCum, lith, surfaceRock } = this;
    // sample just below the surface so a cell sitting exactly on a boundary uses the rock beneath
    for (let i = 0; i < this.grid.size; i++) surfaceRock[i] = lith.rockAt(i, rock[i] - upliftCum[i] - 1e-6);
  }

  _updateVegetation() {
    const hv = this.params.vegetation.soilDepthScale;
    for (let i = 0; i < this.grid.size; i++) this.veg[i] = this.vegMax[i] * (1 - Math.exp(-this.soil[i] / hv));
  }

  _updateOutlets() {
    const sea = this.params.boundary.seaLevel;
    for (let i = 0; i < this.grid.size; i++) {
      this.outlet[i] = this.boundaryOutlet[i] || (sea != null && this.z[i] < sea) ? 1 : 0;
    }
  }

  _updateDerivedState() {
    for (let i = 0; i < this.grid.size; i++) this.z[i] = this.rock[i] + this.soil[i];
    this._updateSurfaceRock();
    this._updateVegetation();
    this._updateOutlets();
  }
}

function clamp01(v) {
  return v < 0 ? 0 : v > 1 ? 1 : v;
}

function smoothstep(t) {
  return t * t * (3 - 2 * t);
}

// ---- src/render.js ----
// Turning simulation state into pixels. Pure functions on typed arrays, so they
// work the same in a browser (into ImageData) and in Node (into a PNG file).

const VIEWS = {
  terrain: 'Terrain (rock, soil, vegetation, water)',
  elevation: 'Elevation (hypsometric tint)',
  geology: 'Geology (rock at the surface)',
  soil: 'Soil thickness',
  vegetation: 'Vegetation cover',
  discharge: 'Drainage area',
  erosion: 'Erosion / deposition rate',
  rockfall: 'Recent rockfall',
};

function hexToRgb(hex) {
  const v = parseInt(hex.replace('#', ''), 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}

/** Piecewise-linear colormap; stops = [[t, [r,g,b]], ...] with t ascending in [0, 1]. */
function ramp(stops, t) {
  if (!(t > 0)) return stops[0][1];
  if (t >= 1) return stops[stops.length - 1][1];
  for (let k = 1; k < stops.length; k++) {
    if (t <= stops[k][0]) {
      const [t0, c0] = stops[k - 1];
      const [t1, c1] = stops[k];
      const u = (t - t0) / (t1 - t0);
      return [c0[0] + u * (c1[0] - c0[0]), c0[1] + u * (c1[1] - c0[1]), c0[2] + u * (c1[2] - c0[2])];
    }
  }
  return stops[stops.length - 1][1];
}

const HYPSO = [[0, [62, 110, 70]], [0.25, [120, 150, 85]], [0.5, [190, 175, 115]], [0.75, [150, 110, 80]], [0.92, [200, 190, 185]], [1, [250, 250, 250]]];
const SEQ = [[0, [250, 245, 225]], [0.33, [220, 180, 100]], [0.66, [160, 95, 50]], [1, [70, 40, 25]]];
const GREEN = [[0, [235, 225, 200]], [0.5, [150, 185, 95]], [1, [35, 95, 40]]];
const BLUE = [[0, [245, 245, 240]], [0.4, [150, 190, 220]], [1, [20, 60, 140]]];
const HEAT = [[0, [0, 0, 0]], [0.3, [200, 40, 20]], [0.7, [255, 170, 30]], [1, [255, 255, 200]]];
const SOIL_RGB = [176, 152, 112];
const VEG_RGB = [72, 112, 52];
const LAKE_RGB = [70, 120, 175];
const SEA_RGB = [40, 80, 140];

/**
 * Lambertian hillshade per cell, light from the north-west at 45 degrees.
 * Gradient by least squares over the available neighbours.
 * @returns {Float32Array} values in [0, 1]
 */
function hillshade(sim, exaggeration = 1) {
  const { grid, z } = sim;
  const n = grid.size;
  const nb = grid.neighbors;
  const out = new Float32Array(n);
  const L = [-0.5, -0.5, Math.SQRT1_2]; // unit vector towards the light (x east, y south, z up)
  for (let i = 0; i < n; i++) {
    let sxx = 0, sxy = 0, syy = 0, sxz = 0, syz = 0;
    for (let k = 0; k < 6; k++) {
      const j = nb[6 * i + k];
      if (j < 0) continue;
      const ddx = grid.x[j] - grid.x[i];
      const ddy = grid.y[j] - grid.y[i];
      const dz = (z[j] - z[i]) * exaggeration;
      sxx += ddx * ddx; sxy += ddx * ddy; syy += ddy * ddy;
      sxz += ddx * dz; syz += ddy * dz;
    }
    const det = sxx * syy - sxy * sxy;
    let gx = 0, gy = 0;
    if (det > 1e-12) {
      gx = (syy * sxz - sxy * syz) / det;
      gy = (sxx * syz - sxy * sxz) / det;
    }
    const norm = Math.sqrt(gx * gx + gy * gy + 1);
    out[i] = Math.max(0, (-gx * L[0] - gy * L[1] + L[2]) / norm);
  }
  return out;
}

/**
 * Colour every cell for the given view.
 * @param {import('./simulation.js').Simulation} sim
 * @param {string} view one of VIEWS
 * @param {Uint8ClampedArray} [out] 3 bytes per cell
 */
function cellColors(sim, view = 'terrain', out) {
  const { grid, z, soil, lith, surfaceRock, veg } = sim;
  const n = grid.size;
  out = out || new Uint8ClampedArray(3 * n);
  const shade = hillshade(sim, view === 'terrain' || view === 'geology' ? 2 : 1.5);
  const rockRgb = lith.color.map(hexToRgb);
  const { filled, area } = sim.flow;
  const sea = sim.params.boundary.seaLevel;
  const cellA = grid.cellArea;

  let zmin = Infinity, zmax = -Infinity, amax = 0, emax = 1e-9;
  for (let i = 0; i < n; i++) {
    if (z[i] < zmin) zmin = z[i];
    if (z[i] > zmax) zmax = z[i];
    if (area[i] > amax) amax = area[i];
    const e = Math.abs(sim.dzdt[i]);
    if (e > emax) emax = e;
  }
  const zr = Math.max(1e-6, zmax - zmin);
  const logAmax = Math.log(Math.max(amax / cellA, 2));
  const riverStart = Math.min(Math.log(150), 0.6 * logAmax); // contributing cells at which rivers show

  for (let i = 0; i < n; i++) {
    let c;
    const s = shade[i];
    const lit = 0.35 + 0.75 * s;
    const water = sea != null && z[i] < sea ? 2 : filled[i] - z[i] > 0.05 ? 1 : 0;
    switch (view) {
      case 'elevation':
        c = ramp(HYPSO, (z[i] - zmin) / zr).map((v) => v * lit);
        break;
      case 'geology':
        c = rockRgb[surfaceRock[i]].map((v) => v * lit);
        break;
      case 'soil': {
        const t = (Math.log10(Math.max(soil[i], 0.01)) + 2) / 3; // 1 cm .. 10 m
        c = ramp(SEQ, t).map((v) => v * (0.6 + 0.4 * s));
        break;
      }
      case 'vegetation':
        c = ramp(GREEN, veg[i]).map((v) => v * (0.6 + 0.4 * s));
        break;
      case 'discharge': {
        const t = Math.log(Math.max(area[i] / cellA, 1)) / logAmax;
        c = ramp(BLUE, t).map((v) => v * (0.75 + 0.25 * s));
        break;
      }
      case 'erosion': {
        // red = lowering, blue = rising (uplift included); square-root stretch
        const r = sim.dzdt[i] / emax;
        const t = Math.sign(r) * Math.sqrt(Math.abs(r));
        c = t < 0 ? [255, 255 * (1 + t), 255 * (1 + t)] : [255 * (1 - t), 255 * (1 - t), 255];
        c = c.map((v) => v * (0.7 + 0.3 * s));
        break;
      }
      case 'rockfall': {
        const g = 90 + 120 * s;
        const t = Math.min(1, Math.sqrt(sim.rockfallActivity[i] / 10));
        c = t > 0.01 ? ramp(HEAT, 0.3 + 0.7 * t) : [g, g, g];
        break;
      }
      case 'terrain':
      default: {
        const rc = rockRgb[surfaceRock[i]];
        const cover = 1 - Math.exp(-soil[i] / 0.3);
        c = [0, 1, 2].map((k) => rc[k] + cover * (SOIL_RGB[k] - rc[k]));
        c = c.map((v, k) => v + veg[i] * (VEG_RGB[k] - v));
        c = c.map((v) => v * lit);
        const t = (Math.log(Math.max(area[i] / cellA, 1)) - riverStart) / (logAmax - riverStart);
        if (t > 0 && !water) c = c.map((v, k) => v + Math.min(1, 0.4 + t) * (LAKE_RGB[k] - v));
        if (water === 1) c = LAKE_RGB.map((v) => v * (0.85 + 0.15 * s));
        if (water === 2) {
          const depth = Math.min(1, (sea - z[i]) / 50);
          c = SEA_RGB.map((v) => v * (1 - 0.5 * depth) + 40 * (1 - depth));
        }
      }
    }
    out[3 * i] = c[0];
    out[3 * i + 1] = c[1];
    out[3 * i + 2] = c[2];
  }
  return out;
}

/**
 * For each pixel of a width x height image, the cell it shows (-1 = none).
 * The grid is fitted inside the image preserving aspect ratio.
 */
function pixelMap(grid, width, height) {
  const x0 = -grid.dx / 2;
  const y0 = -grid.edgeLength;
  const scale = Math.min(width / grid.width, height / grid.height); // pixels per metre
  const map = new Int32Array(width * height);
  for (let py = 0; py < height; py++) {
    for (let px = 0; px < width; px++) {
      map[py * width + px] = grid.cellAt(x0 + (px + 0.5) / scale, y0 + (py + 0.5) / scale);
    }
  }
  return { map, width, height, scale, x0, y0 };
}

/** Fill an RGBA buffer from per-cell colours through a pixel map. */
function paint(pm, colors, rgba, background = [24, 24, 28]) {
  const { map } = pm;
  for (let p = 0; p < map.length; p++) {
    const i = map[p];
    const o = 4 * p;
    if (i < 0) {
      rgba[o] = background[0]; rgba[o + 1] = background[1]; rgba[o + 2] = background[2];
    } else {
      rgba[o] = colors[3 * i]; rgba[o + 1] = colors[3 * i + 1]; rgba[o + 2] = colors[3 * i + 2];
    }
    rgba[o + 3] = 255;
  }
}

/**
 * Vertical cross-section along one grid row: sky, water, soil, and the rock
 * layers below the surface, coloured by lithology.
 * @returns {{zmin:number, zmax:number, exaggeration:number}}
 */
function crossSection(sim, row, width, height, rgba) {
  const { grid, z, rock, lith, upliftCum } = sim;
  const filled = sim.flow.filled;
  const sea = sim.params.boundary.seaLevel;
  const cols = grid.cols;
  row = Math.max(0, Math.min(grid.rows - 1, row | 0));
  let zmin = Infinity, zmax = -Infinity;
  for (let c = 0; c < cols; c++) {
    const i = row * cols + c;
    zmin = Math.min(zmin, rock[i]);
    zmax = Math.max(zmax, z[i], sea ?? -Infinity);
  }
  const relief = Math.max(zmax - zmin, 10);
  zmin -= 0.35 * relief;
  zmax += 0.08 * relief;
  const rockRgb = lith.color.map(hexToRgb);
  const sky = [34, 36, 44];
  const water = [70, 120, 175];
  const soilC = [196, 172, 128];
  for (let px = 0; px < width; px++) {
    const c = Math.min(cols - 1, Math.floor((px / width) * cols));
    const i = row * cols + c;
    const wl = Math.max(filled[i], sea ?? -Infinity);
    for (let py = 0; py < height; py++) {
      const e = zmax - ((py + 0.5) / height) * (zmax - zmin);
      let col;
      if (e > z[i]) col = e <= wl ? water : sky;
      else if (e > rock[i]) col = soilC;
      else col = rockRgb[lith.rockAt(i, e - upliftCum[i])];
      const o = 4 * (py * width + px);
      rgba[o] = col[0]; rgba[o + 1] = col[1]; rgba[o + 2] = col[2]; rgba[o + 3] = 255;
    }
  }
  const horiz = grid.width / width; // metres per pixel horizontally
  const vert = (zmax - zmin) / height;
  return { zmin, zmax, exaggeration: horiz / vert };
}

const $ = (id) => document.getElementById(id);

// Live-adjustable parameters. `log` sliders move in powers of ten.
const SLIDERS = [
  { group: 'Tectonics' },

  { group: 'Vegetation' },
  { path: 'vegetation.cover', label: 'Max cover (auto = from rain)', unit: '', min: 0, max: 1, auto: true },
  { group: 'Rivers' },
  { path: 'fluvial.deposition', label: 'Deposition G', unit: '', min: 0, max: 3 },

  { path: 'hillslope.diffusivity', label: 'Creep diffusivity', unit: 'm²/yr', min: 1e-4, max: 0.5, log: true },
  { path: 'hillslope.criticalSlope', label: 'Soil repose slope', unit: '', min: 0.2, max: 1.5 },
  { path: 'weathering.enabled', label: 'Weathering (soil production)', toggle: true },
  { group: 'Rockfall' },
